name: Linkprüfung
on:
  schedule:
    - cron: "17 5 * * 1"   # montags
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: check
        run: npm run check-links 2>&1 | tee links.log
        continue-on-error: true
      - if: steps.check.outcome == 'failure'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "Tote Links $(date +%F)" --label "tote-links" --body-file links.log || true
