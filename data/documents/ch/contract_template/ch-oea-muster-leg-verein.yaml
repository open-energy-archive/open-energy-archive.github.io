status_note: "Muster, keine Rechtsberatung. Abgestimmt auf Art. 17d/17e StromVG (Fassung 1.4.2026) und Art. 19e–19h StromVV (AS 2025 139, in Kraft seit 1.1.2026). Vor Verwendung anpassen und mit dem Verteilnetzbetreiber abstimmen."
