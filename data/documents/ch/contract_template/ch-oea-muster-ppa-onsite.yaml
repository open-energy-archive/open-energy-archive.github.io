id: ch-oea-muster-ppa-onsite
title: "Mustervertrag On-site-PPA für eine Photovoltaikanlage – Stromliefervertrag, technisches Anlageblatt, Preisblatt mit drei Preismodellen, Eckpunkte der Dienstbarkeit, Übernahmewerte"
title_en: "Model on-site PPA for a solar PV plant – power supply agreement, technical plant sheet, price sheet with three pricing models, key terms of the easement, buy-out values"
short_title: Muster On-site-PPA
doc_type: contract_template
jurisdiction: CH
