summary_de: Vertragsmuster für einen virtuellen Zusammenschluss zum Eigenverbrauch, bei dem mehrere Grundeigentümerinnen und Grundeigentümer – etwa Einfamilienhäuser, Stockwerkeigentum oder Gewerbebauten – den Strom aus einer oder mehreren Anlagen über die Anschlussleitungen und den gemeinsamen Netzanschlusspunkt gemeinsam nutzen. Organisiert als einfache Gesellschaft. Geregelt sind Gründung und Meldung, Eigentum an den Anlagen (eigene oder gemeinsame Anlage), Messkonzept (VNB-Zähler oder Privatzähler), Geschäftsführung, internes Abrechnungsmodell nach Viertelstunden mit drei Varianten für den internen Preis, Verteilung von Arbeitspreis, Grundpreis, Leistungspreis und Messentgelten, Rückliefervergütung, Herkunftsnachweise, Speicher, Solidarhaftung, Beschlüsse, Eintritt, Austritt bei Handänderung, Ausschluss, Fortsetzung und Auflösung. Mit Zusatz zum Mietvertrag für Mietparteien von Teilnehmenden und Vorlagen für Beitritt und Meldung an den Verteilnetzbetreiber.
summary_en: Model agreement for a virtual self-consumption community in which several landowners – such as single-family homes, condominiums or commercial buildings – share electricity from one or more installations via the connection lines and the common grid connection point. Organised as a simple partnership. It covers formation and notification, ownership of installations (own or shared), metering concept (grid operator meters or private meters), management, internal quarter-hourly billing with three options for the internal price, allocation of energy, standing, demand and metering charges, feed-in remuneration, guarantees of origin, storage, joint and several liability, decisions, accession, exit on sale of property, exclusion, continuation and dissolution. Includes a tenancy addendum for tenants of participants and templates for accession and notification to the distribution system operator. Available in German only.
