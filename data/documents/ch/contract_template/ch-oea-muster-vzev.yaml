id: ch-oea-muster-vzev
title: Mustervertrag virtueller Zusammenschluss zum Eigenverbrauch (vZEV) – Gesellschaftsvertrag unter Grundeigentümern, Zusatz zum Mietvertrag, Abrechnungsmodell mit Berechnungsbeispiel, Stammdatenblatt, Beitrittserklärung und Meldung an den Netzbetreiber
title_en: Model agreement for a virtual self-consumption community (vZEV) – partnership agreement among landowners, tenancy addendum, billing model with worked example, master data sheet, accession form and notification to the grid operator
