status_note: Entwurf zur Diskussion, nicht fachlich geprüft – Rückmeldungen aus der Praxis erwünscht (offene Fragen am Schluss des Musters). Muster, keine Rechtsberatung. Gestützt auf Art. 16–18 EnG, Art. 14–18 EnV (Anschlussleitungen nach Art. 14 Abs. 3 EnV), Art. 14, 17a und 17abis StromVG, Art. 530 ff. OR sowie die Fragen und Antworten des Fachsekretariats der ElCom (Update vom 16.6.2026).
status_note_en: Draft for discussion, not reviewed by an expert – feedback from practice welcome (open questions at the end of the template). Template, not legal advice. Based on Art. 16–18 EnG, Art. 14–18 EnV (connection lines under Art. 14(3) EnV), Art. 14, 17a and 17abis StromVG, Art. 530 et seq. of the Code of Obligations and the questions and answers of the ElCom secretariat (update of 16 June 2026).
