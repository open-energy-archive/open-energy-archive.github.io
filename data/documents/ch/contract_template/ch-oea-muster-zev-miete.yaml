status_note: "Entwurf zur Diskussion, nicht fachlich geprüft – Rückmeldungen aus der Praxis erwünscht (offene Fragen am Schluss des Musters). Muster, keine Rechtsberatung. Gestützt auf Art. 16–18 EnG, Art. 14–18 EnV (Stand der Kostenanlastung an Mietparteien gemäss Fassung 2023; Nummerierung seit 2025 zu prüfen), Mietrecht und den Leitfaden Eigenverbrauch 3.0."
status_note_en: "Draft for discussion, not reviewed by an expert – feedback from practice welcome (open questions at the end of the template). Template, not legal advice. Based on Art. 16–18 EnG, Art. 14–18 EnV (cost allocation to tenants as in the 2023 version; numbering since 2025 to be checked), tenancy law and the Self-Consumption Guide 3.0."
languages: [de]
topics: [self_consumption, solar, tariffs, storage, mobility]
summary_de: "Vertragsmuster für einen Zusammenschluss zum Eigenverbrauch auf grösseren Arealen mit einer Vermieterin und vielen Mietparteien. Es umfasst einen Zusatz zum Mietvertrag mit den schriftlich festzuhaltenden Mindestinhalten, Abrechnungsgrundsätze für die Pauschale von höchstens 80 % des externen Standardstromprodukts mit Berechnungsbeispiel, Unterlagen zur Einführung in bestehenden Mietverhältnissen (Begleitschreiben, Begründung für das amtliche Formular, Erklärung über Teilnahme oder Ablehnung) sowie ein Stammdatenblatt. Hinweise zu Contracting, Abrechnungsdienstleistern, Gewerbemietparteien, Speichern und Ladeinfrastruktur."
summary_en: "Model agreement for a self-consumption community (ZEV) on larger sites with one landlord and many tenants. It contains a lease rider with the minimum content to be agreed in writing, billing principles for the flat rate of at most 80% of the external standard electricity product with a worked example, documents for introduction in existing tenancies (cover letter, wording for the official form, declaration of participation or refusal) and a master data sheet. Notes on contracting, billing service providers, commercial tenants, storage and charging infrastructure. Available in German only."
