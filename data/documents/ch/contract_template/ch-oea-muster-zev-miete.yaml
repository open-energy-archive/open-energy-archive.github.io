id: ch-oea-muster-zev-miete
title: "Mustervertrag Zusammenschluss zum Eigenverbrauch (ZEV) in Mietverhältnissen – Zusatz zum Mietvertrag, Abrechnungsgrundsätze, Unterlagen zur Einführung, Stammdatenblatt"
title_en: "Model agreement for a self-consumption community (ZEV) with tenants – lease rider, billing principles, introduction documents, master data sheet"
short_title: Muster ZEV Miete
doc_type: contract_template
