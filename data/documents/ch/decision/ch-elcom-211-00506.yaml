id: ch-elcom-211-00506
title: "Feststellungsverfügung der ElCom vom 16. Dezember 2025 in Sachen VUE Verein für umweltgerechte Energie – Zertifizierungskosten und Fondsbeiträge naturemade in der Grundversorgung"
title_en: "ElCom declaratory decision of 16 December 2025 – naturemade certification costs and fund contributions in basic supply tariffs"
doc_type: decision
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "211-00506"
date: 2025-12-16
status: pending
status_note: "Noch nicht rechtskräftig; gemäss ElCom-Newsletter 01/2026 ist ein Beschwerdeverfahren hängig"
status_note_en: "Not yet final; according to ElCom newsletter 01/2026 an appeal is pending"
languages: [de]
topics: [tariffs, market, renewables]
summary_de: "Der Trägerverein des Stromlabels naturemade verlangte die Feststellung, dass Zertifizierungskosten und Beiträge an ökologische Fonds wie bisher als Energiekosten in die Grundversorgungstarife eingerechnet werden dürfen. Die ElCom wies Haupt- und Eventualbegehren ab: Weder die bisherige Praxis noch die vorgeschlagene Kostenaufteilung für Zertifizierung, naturemade-zertifizierte Herkunftsnachweise und Projektbeiträge sei mit dem Stromversorgungsrecht und der Weisung 7/2025 vereinbar. Eine Verlängerung der Umsetzungsfrist gewährte sie nicht; die Kosten sind ab den Tarifen 2027 zu entfernen."
summary_en: "The association behind the naturemade electricity label sought a ruling that certification costs and contributions to ecological funds may continue to be included as energy costs in basic supply tariffs. ElCom rejected both the main and alternative requests: neither the past practice nor the proposed cost allocation for certification, naturemade-certified guarantees of origin and project contributions is compatible with electricity supply law and Directive 7/2025. It refused to extend the implementation deadline; the costs must be removed from tariffs from 2027."
