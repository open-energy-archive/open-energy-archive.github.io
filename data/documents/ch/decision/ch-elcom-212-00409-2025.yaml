id: ch-elcom-212-00409-2025
title: "Verfügung der ElCom vom 15. August 2025 in Sachen Serge Ferrari Tersuisse AG gegen CKW AG – individuelle Tarifstreitigkeit, Energietarife 2023 und 2024"
title_en: "ElCom decision of 15 August 2025, Serge Ferrari Tersuisse v CKW – individual tariff dispute, energy tariffs 2023 and 2024"
doc_type: decision
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "212-00409"
date: 2025-08-15
status: final
status_note: "Hauptentscheid im Verfahren, in dem die ElCom am 20.2.2023 und 6.7.2023 vorsorgliche Massnahmen abgelehnt hatte (Beschwerde dagegen vom BVGer mit A-4335/2023 abgewiesen; Rechtsverzögerungsbeschwerde A-3636/2024 ebenfalls abgewiesen). Das Dispositiv und eine allfällige Anfechtung wurden nicht im Einzelnen geprüft."
status_note_en: "Main decision in the proceedings in which ElCom had refused interim measures on 20 February and 6 July 2023 (appeal against this dismissed by the Federal Administrative Court in A-4335/2023; delay complaint A-3636/2024 also dismissed). The operative part and any appeal were not checked in detail."
languages: [de]
topics: [tariffs, market]
summary_de: "Ein stromintensives Industrieunternehmen in der Grundversorgung verlangte die Überprüfung seiner um mehr als 100 % gestiegenen Energietarife 2023 und 2024 und die Rückerstattung angeblicher Übergewinne. Die ElCom prüfte die Tarife auf Grundlage der Plan-Kosten, also der Ist-Kosten des letzten abgeschlossenen Geschäftsjahres ergänzt um Plan-Werte, und nicht anhand der Ist-Zahlen der Tarifjahre; Abweichungen werden über die Deckungsdifferenzen ausgeglichen. Hohe Gewinne und Dividenden eines Unternehmens machen die Grundversorgungstarife nicht für sich allein unangemessen, da Entflechtung und Quersubventionierungsverbot die Bereiche trennen. Zudem schützte die ElCom die Geschäftsgeheimnisse der Netzbetreiberin weitgehend und gewährte der Endverbraucherin Einsicht über Bandbreiten, Prozentangaben und Umschreibungen."
summary_en: "An electricity-intensive industrial company in basic supply requested a review of its 2023 and 2024 energy tariffs, which had risen by more than 100%, and repayment of alleged excess profits. ElCom reviewed the tariffs on the basis of planned costs, i.e. actual costs of the last completed financial year plus planned values, not the actual figures of the tariff years; deviations are settled through cost recovery differences. High profits and dividends do not on their own make basic supply tariffs inappropriate, as unbundling and the ban on cross-subsidisation separate the business areas. ElCom also largely protected the network operator's business secrets and gave the end user access through ranges, percentages and descriptions."
