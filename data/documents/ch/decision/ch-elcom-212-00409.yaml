id: ch-elcom-212-00409
title: "Verfügung der ElCom vom 20. Februar 2023 in Sachen Serge Ferrari Tersuisse AG gegen CKW AG – Elektrizitätstarife 2023, Gesuch um vorsorgliche Massnahmen"
title_en: "ElCom decision of 20 February 2023, Serge Ferrari Tersuisse v CKW – 2023 electricity tariffs, request for interim measures"
doc_type: decision
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "212-00409"
date: 2023-02-20
status: final
status_note: "Zwischenverfügung über vorsorgliche Massnahmen. Ein zweites Gesuch wies die ElCom am 6.7.2023 ab; die Beschwerde dagegen wies das BVGer mit A-4335/2023 vom 12.3.2024 ab. Hauptentscheid zu den Energietarifen 2023 und 2024: Verfügung vom 15.8.2025 (eigener Eintrag)."
status_note_en: "Interim decision on provisional measures. ElCom rejected a second request on 6 July 2023; the Federal Administrative Court dismissed the appeal against it in A-4335/2023 of 12 March 2024. Main decision on the 2023 and 2024 energy tariffs: decision of 15 August 2025 (separate entry)."
languages: [de]
topics: [tariffs, market]
summary_de: "Ein stromintensives Industrieunternehmen in der Grundversorgung wehrte sich gegen eine Erhöhung des Energietarifs 2023 um mehr als 100 % und beantragte, bis zum Entscheid weiterhin den Tarif 2022 anzuwenden. Die ElCom wies das Gesuch ab: Ein nicht leicht wiedergutzumachender Nachteil sei nicht glaubhaft gemacht, Dringlichkeit fehle, weil die Tarife seit Ende August 2022 bekannt waren, und eine Prognose zur Hauptsache sei nicht möglich. Eine Verdoppelung des Tarifs sage für sich allein nichts über dessen Angemessenheit aus; massgebend sei die Cost-Plus-Methode beim einzelnen Verteilnetzbetreiber."
summary_en: "An electricity-intensive industrial company in basic supply challenged an increase of more than 100% in its 2023 energy tariff and asked for the 2022 tariff to continue to apply until a decision. ElCom rejected the request: irreparable harm had not been shown, urgency was lacking because the tariffs had been known since the end of August 2022, and no prognosis on the merits was possible. A doubling of the tariff says nothing on its own about its appropriateness; the cost-plus method at the level of the individual distribution system operator is decisive."
