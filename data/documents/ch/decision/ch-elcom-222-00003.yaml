id: ch-elcom-222-00003
title: "Verfügung der ElCom vom 2. Juli 2024 in Sachen ADEV Wasserkraftwerk AG gegen BKW Energie AG – Vergütung für bezogenen Strom im Zeitraum 1. April bis 30. September 2022"
title_en: "ElCom decision of 2 July 2024 – remuneration for electricity taken off from a small hydropower plant, April to September 2022"
doc_type: decision
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "222-00003"
date: 2024-07-02
status: final
languages: [de]
topics: [renewables, hydro, subsidies]
summary_de: "Die ADEV Wasserkraftwerk AG verlangte von der BKW Energie AG rund CHF 160'000 für Strom, den ihr Kraftwerk Moosbrunnen 3 vom 1. April bis 30. September 2022 eingespeist hatte, und machte eine Übergangsphase bis zum Beginn der Direktvermarktung geltend. Die ElCom trat auf das Gesuch mangels Zuständigkeit nicht ein: Da die Anlage am Einspeisevergütungssystem teilnimmt, besteht nach Art. 15 Abs. 4 EnG keine Abnahme- und Vergütungspflicht nach Art. 15 EnG, über die die ElCom zu entscheiden hätte."
summary_en: "ADEV Wasserkraftwerk AG claimed about CHF 160,000 from BKW Energie AG for electricity fed in by its Moosbrunnen 3 plant between 1 April and 30 September 2022, arguing that a transitional period applied until direct marketing began. ElCom declined jurisdiction and dismissed the request: because the plant participates in the feed-in tariff system, Art. 15(4) EnG excludes the purchase and remuneration obligation under Art. 15 EnG on which ElCom could rule."
