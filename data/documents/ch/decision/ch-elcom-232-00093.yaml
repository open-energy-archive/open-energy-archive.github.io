id: ch-elcom-232-00093
title: "Verfügung der ElCom vom 4. Februar 2025 in Sachen Swissgrid AG – Verwendung der Einnahmen aus marktorientierten Zuteilungsverfahren (Auktionserlöse) 2026"
title_en: "ElCom decision of 4 February 2025 – use of revenues from market-based allocation procedures (auction proceeds) in 2026"
doc_type: decision
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "232-00093"
date: 2025-02-04
status: final
status_note: "Im Kopf der veröffentlichten Fassung steht das Aktenzeichen 232-00039; Dateiname und Zusammenhang (Folgeentscheid zu 232-00092 vom 8.2.2024 für das Jahr 2025) sprechen für 232-00093. Rechtskraft nicht gesondert geprüft. Zu früheren Jahren siehe BVGer A-1317/2023."
status_note_en: "The header of the published version shows reference 232-00039; file name and context (follow-up to 232-00092 of 8 February 2024 for 2025) indicate 232-00093. Finality not checked separately. For earlier years see Federal Administrative Court A-1317/2023."
languages: [de]
topics: [grid, tariffs, market]
summary_de: "Swissgrid beantragte, die Erlöse aus der Versteigerung grenzüberschreitender Übertragungskapazität für 2026 nach Abzug der Redispatch- und Vollzugskosten vollständig zur Senkung der Netztarife einzusetzen. Die ElCom lehnte dies ab: Die geltend gemachten Mehrkosten wie Stromreserve, Netzverstärkungen und Entlastung der Stahl- und Aluminiumproduktion beruhten auf politischen Entscheiden und seien keine ausserordentlichen Sondereffekte. Die verbleibenden Auktionserlöse sind nach ihrer Praxis seit 2018 zu 65 % für Erhalt und Ausbau des Übertragungsnetzes und zu 35 % zur Deckung der anrechenbaren Netzkosten zu verwenden (Art. 17 Abs. 5 StromVG)."
summary_en: "Swissgrid asked to use the 2026 proceeds from auctioning cross-border transmission capacity, after deducting redispatch and implementation costs, entirely to lower grid tariffs. ElCom refused: the additional costs cited, such as the electricity reserve, grid reinforcements and relief for steel and aluminium production, stemmed from political decisions and were not exceptional one-off effects. In line with its practice since 2018, the remaining auction proceeds must be used 65% for maintaining and expanding the transmission grid and 35% to cover chargeable grid costs (Art. 17(5) StromVG)."
