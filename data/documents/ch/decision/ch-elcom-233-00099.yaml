id: ch-elcom-233-00099
title: "Verfügung der ElCom vom 4. März 2025 in Sachen Netzbetreiberin gegen A. – Auswechslung konventioneller Stromzähler durch intelligentes Messsystem (Smartmeter)"
title_en: "ElCom decision of 4 March 2025 – replacement of a conventional electricity meter by an intelligent metering system (smart meter)"
doc_type: decision
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "233-00099"
date: 2025-03-04
status: final
languages: [de]
topics: [grid]
summary_de: "Eine kommunale Netzbetreiberin beantragte, eine Liegenschaftseigentümerin zur Duldung des Ersatzes ihres konventionellen Zählers durch ein intelligentes Messsystem zu verpflichten, nachdem diese den Einbau unter Berufung auf Sicherheits-, Gesundheits- und Datenschutzbedenken verweigert hatte. Die ElCom verpflichtete die Eigentümerin gestützt auf Art. 17a StromVG und die Bestimmungen der StromVV zum Messwesen, der Netzbetreiberin Zugang zur Liegenschaft zu gewähren und bis zu einer bestimmten Frist Termine für den Zählerwechsel anzubieten; die Einschränkung der Eigentumsgarantie erachtete sie als zulässig. Für den Fall der Nichtbefolgung wurde auf die Strafbestimmungen des Stromversorgungsrechts hingewiesen."
summary_en: "A municipal grid operator asked ElCom to order a property owner to accept the replacement of her conventional meter by an intelligent metering system after she had refused installation, citing safety, health and data protection concerns. Relying on Art. 17a StromVG and the metering provisions of the StromVV, ElCom ordered the owner to grant the operator access to the property and to offer appointments for the meter exchange by a set deadline, finding the restriction of property rights admissible. Non-compliance was made subject to the penal provisions of electricity supply law."
