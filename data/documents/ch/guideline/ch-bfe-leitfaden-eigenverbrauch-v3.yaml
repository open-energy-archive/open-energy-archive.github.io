status_note: "Stand Mai 2023, vor Inkrafttreten des Mantelerlasses; vZEV und LEG (seit 2025/2026) sind nicht abgedeckt. Am 6.10.2026 keine neuere Fassung gefunden: pubdb 9329 liefert weiterhin Version 3.0, und Swissolar verlinkt diese Fassung. Zu vZEV und LEG siehe die VSE-Dokumente HER – CH 2025 und BD LEG – CH 2025."
status_note_en: "Status May 2023, before the Mantelerlass entered into force; virtual ZEV and LEG (since 2025/2026) are not covered. No newer version found on 6 October 2026: pubdb 9329 still delivers version 3.0, and Swissolar links this version. For virtual ZEV and LEG see the VSE documents HER – CH 2025 and BD LEG – CH 2025."
