summary_de: "Der Leitfaden erklärt, wie Eigentümer und Mieter einen Zusammenschluss zum Eigenverbrauch (ZEV) gründen und betreiben können. Er behandelt Rechtsgrundlagen, Mieterschutz, Preismodelle und technische Anforderungen und enthält Vorlagen und Rechenbeispiele."
summary_en: "The guide explains how owners and tenants can set up and operate a self-consumption community (ZEV). It covers the legal basis, tenant protection, pricing models and technical requirements, and includes templates and worked examples."
