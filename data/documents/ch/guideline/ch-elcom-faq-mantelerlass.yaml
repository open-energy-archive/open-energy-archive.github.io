summary_de: 'Das Fachsekretariat der ElCom beantwortet Praxisfragen zur Umsetzung des Mantelerlasses: Rückliefervergütung und Minimalvergütungen, Eigenverbrauch und virtuelle ZEV (Ort der Produktion mit Anschlussleitungen, Messkonzept, Grundpreis und Messentgelt, keine Verschachtelung von ZEV, Speicher, Rückliefervergütung pro Anlage, Zuständigkeit ElCom oder Zivilgerichte), Netzanschluss und Netzverstärkungen, Informationspflichten, Netznutzungs- und Energietarife, intelligente Messsysteme, Flexibilität, lokale Elektrizitätsgemeinschaften, Sunshine-Regulierung, Speicher und Effizienzmassnahmen.'
summary_en: 'The ElCom Secretariat answers practical questions on implementing the Mantelerlass: feed-in remuneration and minimum remuneration, self-consumption and virtual self-consumption communities (place of production with connection lines, metering, standing and metering charges, no nesting of communities, storage, feed-in remuneration per installation, jurisdiction of ElCom or civil courts), grid connection and reinforcement, information duties, grid and energy tariffs, smart meters, flexibility, local electricity communities, sunshine regulation, storage and efficiency measures.'
