summary_de: "Die Weisung erläutert, wie die ElCom die Einhaltung der Mindestanforderungen an die Cybersicherheit beaufsichtigt, die das Stromversorgungsrecht den massgebenden Unternehmen der Elektrizitätswirtschaft auferlegt. Sie beschreibt drei sich ergänzende Aufsichtsinstrumente, darunter Sensibilisierungsgespräche und punktuelle Audits, sowie Fristen, Abläufe und eine Übergangsfrist für die Umsetzung der Mindestanforderungen."
summary_en: "The directive explains how ElCom supervises compliance with the minimum cybersecurity requirements that electricity supply law imposes on relevant electricity companies. It describes three complementary supervisory instruments, including awareness meetings and selective audits, as well as deadlines, procedures and a transition period for implementing the minimum requirements."
