id: ch-elcom-weisung-5-2025
title: "Weisung 5/2025 der ElCom – Transparente und vergleichbare Rechnungsstellung"
title_en: "ElCom Directive 5/2025 – Transparent and comparable billing"
doc_type: guideline
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "Weisung 5/2025"
date: 2025-05-06
status: in_force
status_note: "Ersetzt die Weisung von 2014 zum gleichen Thema. Gilt grösstenteils ab Tarifjahr 2025, Regeln zu Messentgelten ab 2026."
languages: [de]
topics: [tariffs, grid, market]
summary_de: "Die Weisung setzt die Vorgaben des revidierten StromVG zur Rechnungsstellung um und verlangt, dass Netznutzung, Energie, Abgaben und weitere Positionen einzeln ausgewiesen werden. Sie regelt auch Angaben zu dynamischen Tarifen und den Datenzugang über intelligente Messsysteme."
