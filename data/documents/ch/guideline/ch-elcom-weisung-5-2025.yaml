id: ch-elcom-weisung-5-2025
title: "Weisung 5/2025 der ElCom – Transparente und vergleichbare Rechnungsstellung"
title_en: "ElCom Directive 5/2025 – Transparent and comparable billing"
doc_type: guideline
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "Weisung 5/2025"
date: 2025-05-06
status: in_force
status_note: "Ersetzt die Weisung 1/2014 vom 11. März 2014 zum gleichen Thema. Gilt grösstenteils ab Tarifjahr 2025, Regeln zu Messentgelten ab 2026. Gemäss Weisungsliste der ElCom am 6.10.2026 weiterhin aufgeführt; keine ersetzende Weisung."
status_note_en: "Replaces Directive 1/2014 of 11 March 2014 on the same subject. Applies mostly from tariff year 2025; rules on metering charges from 2026. Still listed in ElCom's list of directives as of 6 October 2026; no replacing directive."
languages: [de]
topics: [tariffs, grid, market]
summary_de: "Die Weisung setzt die Vorgaben des revidierten StromVG zur Rechnungsstellung um und verlangt, dass Netznutzung, Energie, Abgaben und weitere Positionen einzeln ausgewiesen werden. Sie regelt auch Angaben zu dynamischen Tarifen und den Datenzugang über intelligente Messsysteme."
summary_en: "The directive implements the revised Electricity Supply Act's billing requirements and requires grid usage, energy, levies and other items to be shown separately. It also covers information on dynamic tariffs and data access via smart metering systems."
