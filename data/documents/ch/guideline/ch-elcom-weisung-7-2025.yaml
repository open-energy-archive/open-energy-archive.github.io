id: ch-elcom-weisung-7-2025
title: "Weisung 7/2025 der ElCom – Grundversorgung: StromVG-konformer Umgang mit Zertifizierungskosten und Beiträgen zur Speisung von Fonds oder zur Finanzierung von Projekten"
title_en: "ElCom Directive 7/2025 – Basic supply: certification costs and contributions to funds or projects"
doc_type: guideline
jurisdiction: CH
issuer: "Eidgenössische Elektrizitätskommission ElCom"
reference: "Weisung 7/2025"
date: 2025-06-03
status: in_force
status_note: "Aktualisiert am 3.2.2026 nach BGer 2C_609/2024 und ElCom-Verfügung 211-00506. Gilt für Verteilnetzbetreiber ab den Tarifen 2027."
status_note_en: "Updated on 3 February 2026 following BGer 2C_609/2024 and ElCom decision 211-00506. Applies to distribution grid operators from the 2027 tariffs."
languages: [de]
topics: [tariffs, market]
summary_de: "Die Weisung hält fest, dass Beiträge an Fonds oder Projekte nicht in den Energietarif der Grundversorgung eingerechnet werden dürfen, weil ihnen der direkte Bezug zur Energieproduktion fehlt. Solche Beiträge sind nur auf anderem Weg zulässig, etwa als Abgabe mit kantonaler oder kommunaler Grundlage."
summary_en: "The directive states that contributions to funds or projects may not be included in the energy tariff for basic supply because they lack a direct link to energy production. Such contributions are only permissible by other means, for example as a levy with a cantonal or municipal legal basis."
