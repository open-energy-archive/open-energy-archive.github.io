summary_de: "Der Leitfaden erläutert das kantonale Baubewilligungsverfahren für alpine Photovoltaik-Grossanlagen nach Art. 71a EnG in Graubünden: die Voraussetzungen der Privilegierung, die befristete Anwendbarkeit, die Fristen für Einspeisung und Inbetriebnahme, die erforderlichen Unterlagen und den Ablauf mit den beteiligten Behörden."
summary_en: "The guide explains the cantonal building permit procedure for large alpine PV plants under Art. 71a EnG in Graubünden: the conditions for the privileged treatment, its limited period of application, the deadlines for feed-in and commissioning, the required documents and the process with the authorities involved."
