summary_de: "Die Empfehlung beschreibt den technischen und administrativen Rahmen für lokale Elektrizitätsgemeinschaften, die lokal erzeugten Strom über das Verteilnetz zu einem reduzierten Netznutzungstarif austauschen. Sie behandelt Gründung, Messung, Abrechnung, Speicher und Vergütung."
summary_en: "The recommendation describes the technical and administrative framework for local electricity communities that exchange locally produced electricity over the distribution grid at a reduced grid usage tariff. It covers formation, metering, billing, storage and remuneration."
