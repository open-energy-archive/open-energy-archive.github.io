id: ch-ag-vgr-wbe-2018-330
title: "Entscheid des Verwaltungsgerichts des Kantons Aargau WBE.2018.330 vom 3. Dezember 2018 – Grenzabstand für Luft-Wasser-Wärmepumpen mit Aussenstandort"
title_en: "Aargau Administrative Court decision WBE.2018.330 of 3 December 2018 – boundary setback for air-water heat pumps with outdoor units"
doc_type: judgment
jurisdiction: CH
subdivision: CH-AG
issuer: "Obergericht des Kantons Aargau, Verwaltungsgericht, 3. Kammer"
reference: "WBE.2018.330"
date: 2018-12-03
status: final
status_note: "Publiziert als Auszug in AGVE 2018 Nr. 21 S. 245; der Auszug enthält das Dispositiv nicht. Ergebnis gemäss den publizierten Erwägungen: Der Aussenteil wahrt den Grenzabstand nicht, eine ordentliche Baubewilligung ist am geplanten Standort ausgeschlossen. Die Gemeinde ist im publizierten Text nicht genannt."
status_note_en: "Published as an excerpt in AGVE 2018 No. 21 p. 245; the excerpt does not contain the operative part. Result according to the published reasons: the outdoor unit does not observe the boundary setback, and an ordinary building permit is excluded at the planned location. The municipality is not named in the published text."
languages: [de]
topics: [heat, permitting]
summary_de: "Streitig war der Grenzabstand für den Splitverdampfer einer innen aufgestellten Luft-Wasser-Wärmepumpe (rund 1,1 × 1,3 × 1 m), der 0,8 m von der Nachbargrenze entfernt aufgestellt werden sollte. Das Verwaltungsgericht hielt fest, dass die aargauischen Grenzabstandsvorschriften nicht nur für Gebäude im Sinne der IVHB, sondern für Bauten und Anlagen aller Art gelten. Das Abstandsprivileg für Kleinbauten von 2 m ist aus Gründen der Gleichbehandlung auf Anlagen vergleichbarer Grösse anzuwenden; der Aussenteil gehört nicht zum Hauptgebäude, das den ordentlichen Abstand von 4 m einhalten müsste. Ohne schriftliche Zustimmung der Nachbarn kommt bei Unterschreitung höchstens eine Ausnahmebewilligung nach § 67 BauG in Frage."
summary_en: "The dispute concerned the boundary setback for the split evaporator of an indoor air-water heat pump (about 1.1 × 1.3 × 1 m), to be placed 0.8 m from the neighbouring boundary. The Administrative Court held that Aargau's setback rules apply not only to buildings as defined in the IVHB but to structures and installations of all kinds. The 2 m setback privilege for small buildings must, for reasons of equal treatment, be applied to installations of comparable size; the outdoor unit is not part of the main building, which would have to observe the ordinary 4 m distance. Without the neighbours' written consent, a shortfall can at most be allowed through an exceptional permit under § 67 BauG."
