id: ch-ag-vgr-wbe-2025-125
title: 'Urteil des Verwaltungsgerichts des Kantons Aargau WBE.2025.125 vom 26. Januar 2026 – Abluft-Wärmepumpe: keine Beschwerdelegitimation des Nachbarn, energierechtliche Vorschriften nicht nachbarschützend'
title_en: 'Aargau Administrative Court WBE.2025.125 of 26 January 2026 – exhaust-air heat pump: no standing for the neighbour, energy rules do not protect neighbours'
doc_type: judgment
jurisdiction: CH
subdivision: CH-AG
issuer: Obergericht des Kantons Aargau, Verwaltungsgericht, 3. Kammer
reference: WBE.2025.125
date: 2026-01-26
