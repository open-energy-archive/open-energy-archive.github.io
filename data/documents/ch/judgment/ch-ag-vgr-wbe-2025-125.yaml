summary_de: Das Verwaltungsgericht bestätigte, dass der Eigentümer einer benachbarten Einheit im selben Terrassenhaus nicht zur Beschwerde gegen die Baubewilligung einer innen aufgestellten Abluft-Wärmepumpe befugt ist. Ihm erwächst kein praktischer Nachteil; das Interesse an der richtigen Anwendung des Energierechts und an tieferen Stromkosten ist allgemeiner Natur, und die Vorschriften über Heizungsanlagen (§ 7 Abs. 3 und 4 Energiegesetz) haben keine nachbarschützende Funktion. Den aufsichtsrechtlichen Entscheid des Departements, die Anlage bis zum Ende ihrer Lebensdauer zu tolerieren, kann das Verwaltungsgericht nicht überprüfen. Für den eigenen Aufwand einer nicht vertretenen Partei wird keine Parteientschädigung zugesprochen.
summary_en: The Administrative Court confirmed that the owner of a neighbouring unit in the same terraced house has no standing to appeal the building permit for an indoor exhaust-air heat pump. He suffers no practical disadvantage; the interest in correct application of energy law and lower electricity costs is general in nature, and the rules on heating systems (§ 7(3) and (4) Energy Act) do not protect neighbours. The court cannot review the department’s supervisory decision to tolerate the system until the end of its service life. A self-represented party is not awarded costs for its own effort.
