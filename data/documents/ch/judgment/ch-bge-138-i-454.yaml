id: ch-bge-138-i-454
title: "BGE 138 I 454 (Urteil 2C_269/2012 vom 27. Oktober 2012) – Abschliessende Bundesregelung der Vergütung für dezentral erzeugte Energie; keine zusätzlichen kantonalen Vergütungspflichten"
title_en: "BGE 138 I 454 (judgment 2C_269/2012 of 27 October 2012) – exhaustive federal rules on remuneration for decentralised generation; no additional cantonal remuneration obligations"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "BGE 138 I 454 / 2C_269/2012"
date: 2012-10-27
status: final
status_note: "Amtlich publiziert als Auszug. Bestätigt und angewendet in BGE 138 I 468."
status_note_en: "Officially published as an excerpt. Confirmed and applied in BGE 138 I 468."
languages: [de]
topics: [subsidies, tariffs, renewables]
summary_de: "Eine Gasleitungsbetreiberin musste auf kantonale Anordnung Abwärme ihrer Kompressorenstation zur Stromerzeugung nutzen und speiste den Strom ins Netz eines Verteilwerks ein; das Luzerner Departement hatte die Vergütung gestützt auf § 18 des kantonalen Energiegesetzes festgesetzt. Das Bundesgericht entschied, dass die seit 1. Januar 2009 geltenden Art. 7 und 7a EnG (Abnahme- und Vergütungspflicht, kostendeckende Einspeisevergütung) abschliessend sind. Kantonale Vergütungspflichten, die sich auf die Elektrizitätstarife auswirken, haben daneben keinen Raum mehr; Mehrkosten durch Abnahme über dem Marktpreis sind nur zulässig, soweit das Bundesrecht sie vorsieht. Die Strompreise regelt das Stromversorgungsrecht grundsätzlich abschliessend."
summary_en: "A gas pipeline operator was required by cantonal order to use waste heat from its compressor station to generate electricity and fed it into a distribution utility's grid; the Lucerne department had set the remuneration under § 18 of the cantonal Energy Act. The court held that Art. 7 and 7a EnG in force since 1 January 2009 (offtake and remuneration obligation, cost-covering feed-in tariff) are exhaustive. Cantonal remuneration obligations affecting electricity tariffs no longer have any room; additional costs from offtake above market prices are only permissible where federal law provides for them. Electricity prices are in principle regulated exhaustively by electricity supply law."
