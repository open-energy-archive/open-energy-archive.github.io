id: ch-bge-141-ii-141
title: "BGE 141 II 141 (Urteil 2C_300/2014) – Rechte und Pflichten von Verteilnetzbetreibern, Arealnetzbetreibern und Endverbrauchern in Arealnetzen"
title_en: "Federal Supreme Court BGE 141 II 141 (2C_300/2014) – rights and obligations of distribution system operators, site network operators and end users in site networks"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "BGE 141 II 141 / 2C_300/2014"
date: 2015-02-09
status: final
status_note: "Amtlich publiziert als BGE 141 II 141; Beschwerde im Sinne der Erwägungen abgewiesen, soweit darauf eingetreten"
status_note_en: "Officially published as BGE 141 II 141; appeal dismissed in the sense of the reasons, as far as admissible."
languages: [de]
topics: [grid, market, self_consumption]
summary_de: "Die Betreiberin eines Arealnetzes in einem Einkaufszentrum stritt mit der Energie Thun AG darüber, ob die Mieter im Areal als Endverbraucher im Sinne des Stromversorgungsrechts gelten und wie die Elektrizitätsleistungen zur Feinverteilung abzurechnen sind. Das Bundesgericht klärte die Stellung der Arealnetzbetreiber gegenüber dem Verteilnetzbetreiber und den Endverbrauchern und hielt fest, dass die Endverbraucher im Arealnetz ihre stromversorgungsrechtlichen Ansprüche behalten und der Arealnetzbetreiber deren Verbrauch nicht ohne Weiteres bündeln kann. Die Beschwerde wurde abgewiesen."
summary_en: "The operator of a site network in a shopping centre disputed with Energie Thun AG whether the tenants on the site count as end consumers under electricity supply law and how fine-distribution services are to be billed. The Federal Supreme Court clarified the position of site-network operators towards the distribution grid operator and end consumers, holding that end consumers in a site network keep their rights under electricity supply law and that the site-network operator cannot simply pool their consumption. The appeal was dismissed."
