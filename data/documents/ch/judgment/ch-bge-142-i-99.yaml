id: ch-bge-142-i-99
title: "BGE 142 I 99 (Urteil 2C_689/2015) – Wasserkraftkonzessionen im Kanton Uri, Konkurrenzverfahren bei der Konzessionsverleihung (abstrakte Normenkontrolle)"
title_en: "Federal Supreme Court BGE 142 I 99 (2C_689/2015) – hydropower concessions in the Canton of Uri, competitive award procedure (abstract judicial review)"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "BGE 142 I 99 / 2C_689/2015"
date: 2016-03-31
status: final
status_note: "Amtlich publiziert als BGE 142 I 99; Beschwerde abgewiesen, soweit darauf eingetreten"
status_note_en: "Officially published as BGE 142 I 99; appeal dismissed as far as admissible."
languages: [de]
topics: [hydro, permitting]
summary_de: "Die Kraftwerk Schächenschale AG focht die revidierten Bestimmungen der Urner Gewässernutzungsverordnung über das Verfahren bei konkurrierenden Gesuchen um Wasserkraftkonzessionen im Rahmen einer abstrakten Normenkontrolle an. Das Bundesgericht entschied, dass die Regelungen mit Art. 60 Abs. 3bis WRG und der Bundesverfassung vereinbar sind; die Kantone dürfen ein transparentes Verfahren mit mehreren Bewerbern vorsehen, ohne eine eigentliche Ausschreibung durchzuführen, und die Wirtschaftsfreiheit steht der Bevorzugung einer Beteiligung der öffentlichen Hand angesichts des kantonalen Wasserrechtsregals nicht entgegen. Die Beschwerde wurde abgewiesen."
summary_en: "Kraftwerk Schächenschale AG challenged the revised provisions of the Uri water-use ordinance on the procedure for competing hydropower concession applications in an abstract review of norms. The Federal Supreme Court held the rules compatible with Art. 60(3bis) of the Water Rights Act and the Federal Constitution: cantons may provide a transparent procedure with several applicants without a formal tender, and economic freedom does not preclude favouring public-sector participation given the cantonal water-rights monopoly. The appeal was dismissed."
