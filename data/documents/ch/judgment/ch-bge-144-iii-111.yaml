id: ch-bge-144-iii-111
title: "BGE 144 III 111 (Urteil 4A_305/2017 vom 18. Januar 2018) – Rechtsnatur des Netzanschlussverhältnisses"
title_en: "Leading decision BGE 144 III 111 – legal nature of the grid connection relationship"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. zivilrechtliche Abteilung"
reference: "BGE 144 III 111 / 4A_305/2017"
date: 2018-01-18
status: final
status_note: "Amtlich publizierter Leitentscheid."
status_note_en: "Officially published leading decision."
languages: [de]
topics: [grid, market]
summary_de: "Das Bundesgericht stufte das Netzanschlussverhältnis im Rahmen der Stromversorgung als öffentlich-rechtlich ein, weil der Anschluss Voraussetzung für die Netznutzung und Teil des Service public ist. Das gilt auch dann, wenn ein Endverbraucher seinen Netzzugang im freien Markt wahrnimmt."
summary_en: "The Federal Supreme Court classified the grid connection relationship in electricity supply as governed by public law, because connection is a precondition for grid usage and part of the public service. This also applies where an end consumer exercises network access in the free market."
