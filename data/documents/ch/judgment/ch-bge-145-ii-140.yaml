id: ch-bge-145-ii-140
title: "BGE 145 II 140 (Urteil 1C_631/2017 vom 29. März 2019) – Ehehafte Wasserrechte und Restwassersanierung"
title_en: "BGE 145 II 140 (judgment 1C_631/2017 of 29 March 2019) – historic water rights (ehehafte Wasserrechte) and residual flow remediation"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "BGE 145 II 140 / 1C_631/2017"
date: 2019-03-29
status: final
status_note: "Leitentscheid zu ehehaften Wasserrechten; publiziert auch mit Leitsätzen in URP 2019 S. 557. Zusammenfassung gestützt auf die veröffentlichten Leitsätze bzw. die Angaben zu Gegenstand und Ergebnis; Volltext nicht im Einzelnen gesichtet."
status_note_en: "Leading case on historic water rights; also published with headnotes in URP 2019 p. 557. Summary based on the published headnotes or on the information on subject and outcome; full text not reviewed in detail."
languages: [de]
topics: [hydro, permitting]
summary_de: "Streitig war, ob ein vom Kanton früher anerkanntes ehehaftes Wasserrecht einer umfassenden Restwassersanierung eines bestehenden Kraftwerks entgegensteht. Ehehafte Rechte haben ihren Ursprung in einer nicht mehr bestehenden Rechtsordnung und könnten heute nicht mehr begründet werden. Das Bundesgericht entschied, dass solche zeitlich unbegrenzten Rechte mit der geltenden Verfassungs- und Gesetzesordnung nicht vereinbar sind und die Anwendung der Restwasservorschriften nicht ausschliessen. Das Urteil hat Auswirkungen auf zahlreiche Kleinwasserkraftwerke."
summary_en: "The issue was whether a historic water right previously recognised by the canton precludes a comprehensive residual flow remediation of an existing power plant. Historic rights originate in a legal order that no longer exists and could not be created today. The court held that such unlimited rights are incompatible with the current constitutional and statutory order and do not exclude the application of the residual flow rules. The judgment affects numerous small hydropower plants."
