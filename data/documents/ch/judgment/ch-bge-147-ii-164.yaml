id: ch-bge-147-ii-164
title: "BGE 147 II 164 (Urteil 1C_356/2019) – Vergrösserung des Grimselsees, Richtplanpflicht und nationales Interesse an erneuerbarer Stromproduktion"
title_en: "Federal Supreme Court BGE 147 II 164 (1C_356/2019) – enlargement of the Grimsel reservoir, structure-plan requirement and national interest in renewable power"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "BGE 147 II 164 / 1C_356/2019"
date: 2020-11-04
status: final
status_note: "Amtlich publiziert als BGE 147 II 164; Beschwerde gutgeheissen, Konzessionsänderung aufgehoben und Sache zur Neubeurteilung zurückgewiesen"
languages: [de]
topics: [hydro, renewables, storage, permitting]
summary_de: "Umweltorganisationen fochten die Konzessionsänderung für die Erhöhung der Staumauern am Grimselsee durch die Kraftwerke Oberhasli AG an. Das Bundesgericht anerkannte das nationale Interesse am Ausbau der erneuerbaren Stromproduktion, hielt aber fest, dass das Vorhaben wegen seiner gewichtigen Auswirkungen auf Raum und Umwelt einer Festsetzung im kantonalen Richtplan bedarf, dass die mögliche Qualifikation des Gletschervorfelds als Moorlandschaft bzw. Schutzgebiet von nationaler Bedeutung zu prüfen ist und dass die Konzession eine verbindliche Frist für die Realisierung enthalten muss. Die Beschwerde wurde gutgeheissen und die Sache zur Neubeurteilung zurückgewiesen."
