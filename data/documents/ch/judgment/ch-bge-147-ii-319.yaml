id: ch-bge-147-ii-319
title: "ATF 147 II 319 (arrêt 1C_657/2018, 1C_658/2018) – Parc éolien de Sainte-Croix : définition de l'intérêt national et protection contre le bruit"
title_en: "Federal Supreme Court BGE 147 II 319 (1C_657/2018) – Sainte-Croix wind farm, definition of national interest and noise protection"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "BGE 147 II 319 / 1C_657/2018"
date: 2021-03-18
status: final
status_note: "Amtlich publiziert als BGE 147 II 319; Beschwerden im Wesentlichen abgewiesen, in zwei Punkten teilweise gutgeheissen (Ausdehnung des Fahrverbots auf der Route de l'Aiguillon bis 31. Mai; Erleichterung nach Lärmschutz-Verordnung für das Chalet du Mont-des-Cerfs)."
status_note_en: "Officially published as BGE 147 II 319; appeals largely dismissed, partly upheld on two points (extension of the motor traffic ban on the Route de l'Aiguillon until 31 May; relief under the Noise Abatement Ordinance for the Chalet du Mont-des-Cerfs)."
languages: [fr]
topics: [wind, renewables, permitting]
summary_de: "Umwelt- und Landschaftsschutzorganisationen sowie Anwohner fochten die Bewilligungen für den Windpark Sainte-Croix (VD) mit sechs Anlagen an und bestritten insbesondere das nationale Interesse und die Einhaltung der Lärmschutzvorschriften. Das Bundesgericht bestätigte, dass die Schwelle von 20 GWh pro Jahr in der Energieverordnung bundesrechtskonform ist und vom Projekt erreicht wird, und dass der Lärm von Windenergieanlagen nach den Belastungsgrenzwerten für Industrie- und Gewerbelärm zu beurteilen ist. Mobile Schallschutzschirme an einem Gebäude sind keine Emissionsbegrenzung an der Anlage und dürfen bei der Prüfung der Planungswerte nicht berücksichtigt werden; werden diese nicht eingehalten, ist eine Erleichterung nach Art. 7 Abs. 2 LSV gestützt auf eine umfassende Interessenabwägung nötig. Die Beschwerden wurden im Wesentlichen abgewiesen; teilweise gutgeheissen wurden sie insoweit, als das Fahrverbot auf der Route de l'Aiguillon zum Schutz brütender Vögel bis Ende Mai auszudehnen und für das Chalet du Mont-des-Cerfs eine Erleichterung zu gewähren ist."
summary_en: "Environmental and landscape organisations and residents challenged the permits for the six-turbine Sainte-Croix wind farm (VD), disputing in particular the national interest and compliance with noise rules. The Federal Supreme Court confirmed that the 20 GWh per year threshold in the Energy Ordinance complies with federal law and is met by the project, and that wind turbine noise is assessed under the limits for industrial and commercial noise. Mobile acoustic screens on a building are not an emission limitation at the installation and may not be taken into account when assessing compliance with the planning values; if these are exceeded, relief under Art. 7(2) of the Noise Abatement Ordinance based on a comprehensive balancing of interests is required. The appeals were largely dismissed; they were partly upheld insofar as the motor traffic ban on the Route de l'Aiguillon must be extended until the end of May to protect breeding birds and relief must be granted for the Chalet du Mont-des-Cerfs."
