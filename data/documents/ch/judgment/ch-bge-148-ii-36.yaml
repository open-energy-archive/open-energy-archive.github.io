title: "BGE 148 II 36 (Urteil 1C_573/2018) – Windpark Grenchenberg, Richtplanpflicht und Vogelschutz"
title_en: "Federal Supreme Court BGE 148 II 36 (1C_573/2018) – Grenchenberg wind farm, structure-plan requirement and bird protection"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "BGE 148 II 36 / 1C_573/2018"
date: 2021-11-24
status: final
status_note: "Amtlich publiziert als BGE 148 II 36; Beschwerde teilweise gutgeheissen (2 von 6 Windenergieanlagen nicht bewilligungsfähig)"
languages: [de]
topics: [wind, renewables, permitting]
summary_de: "Vogelschutzverbände fochten die Nutzungsplanung und Baubewilligung für den Windpark Grenchenberg mit sechs Windenergieanlagen an. Das Bundesgericht hielt fest, dass auf Stufe Richtplan auch das Vorkommen gefährdeter und national prioritärer Arten mit Konfliktpotenzial abzuklären ist; da diese Abklärungen im Nutzungsplanverfahren nachgeholt wurden und keine besseren Alternativstandorte ersichtlich waren, war das Projekt nicht schon deswegen aufzuheben. Wegen des Kollisionsrisikos für ein nahe gelegenes Wanderfalken-Brutpaar erachtete es jedoch zwei der sechs Anlagen als nicht bewilligungsfähig und hiess die Beschwerde insoweit teilweise gut."
