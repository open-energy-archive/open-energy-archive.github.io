id: ch-bge-148-iii-172
title: "BGE 148 III 172 (Urteil 4A_275/2021, 4A_283/2021) – Ausgleichsenergie von Swissgrid, Zuständigkeit und Verfassungswidrigkeit von Art. 5 Abs. 5 StromVV"
title_en: "Federal Supreme Court BGE 148 III 172 (4A_275/2021) – Swissgrid balancing energy, jurisdiction and unconstitutionality of Art. 5(5) StromVV"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. zivilrechtliche Abteilung"
reference: "BGE 148 III 172 / 4A_275/2021"
date: 2022-01-11
status: final
status_note: "Amtlich publiziert als BGE 148 III 172; Zuständigkeit der Zivilgerichte verneint"
status_note_en: "Officially published as BGE 148 III 172; jurisdiction of the civil courts denied."
languages: [de]
topics: [grid, supply_security]
summary_de: "Zwei Unternehmen klagten vor einem kantonalen Handelsgericht gegen Swissgrid auf Korrektur einer Bilanzgruppenabrechnung und Rückerstattung von Kosten für Ausgleichsenergie, die nach einem Eingriff von Swissgrid zur Gewährleistung der Netzsicherheit verrechnet worden waren. Das Bundesgericht qualifizierte die zugrunde liegenden Vereinbarungen als öffentlich-rechtlich und hielt fest, dass Art. 5 Abs. 5 StromVV gegen Art. 164 und Art. 182 Abs. 1 BV verstösst, soweit er Streitigkeiten aus öffentlich-rechtlichen Verhältnissen auf den Zivilweg verweist, da eine solche Zuständigkeitsregelung ein formelles Gesetz erfordert. Die Zivilgerichte waren daher für die Klage nicht zuständig."
summary_en: "Two companies sued Swissgrid before a cantonal commercial court to correct a balance-group settlement and recover balancing-energy costs charged after a Swissgrid intervention to ensure grid security. The Federal Supreme Court classified the underlying agreements as governed by public law and held that Art. 5(5) StromVV violates Art. 164 and 182(1) of the Federal Constitution insofar as it refers public-law disputes to the civil courts, since such a rule on jurisdiction requires a formal statute. The civil courts therefore lacked jurisdiction."
