id: ch-bge-149-i-49
title: "BGE 149 I 49 (Urteil 1C_37/2022 vom 23. März 2023) – Zürcher Energiegesetz: Pflicht zum Ersatz elektrischer Widerstandsheizungen bis 2030 verfassungsmässig"
title_en: "BGE 149 I 49 (judgment 1C_37/2022 of 23 March 2023) – Zurich Energy Act: obligation to replace electric resistance heating by 2030 constitutional"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "BGE 149 I 49 / 1C_37/2022"
date: 2023-03-23
status: final
status_note: "Abstrakte Normenkontrolle; Beschwerde abgewiesen. Ob im Einzelfall eine Entschädigung geschuldet sein könnte, etwa bei nach 1991 bewilligten Elektroheizungen, liess das Bundesgericht offen."
status_note_en: "Abstract review of legislation; appeal dismissed. The court left open whether compensation might be owed in individual cases, for example for electric heating approved after 1991."
languages: [de]
topics: [heat, energy_efficiency]
summary_de: "Mit der 2021 vom Zürcher Stimmvolk angenommenen Revision des Energiegesetzes (Umsetzung der MuKEn 2014) müssen bestehende ortsfeste elektrische Widerstandsheizungen und rein direkt beheizte zentrale Wassererwärmer bis 2030 ersetzt werden; Verstösse sind strafbar. Das Bundesgericht wies die Beschwerde wegen Verletzung der Eigentumsgarantie ab: Die Ersatzpflicht dient dem Umweltschutz und der Versorgungssicherheit, weil Wärmepumpen mit derselben Strommenge deutlich mehr Wärme erzeugen. Sie ist verhältnismässig, da Elektroheizungen seit 1991 bewilligungspflichtig sind, ihre übliche Lebensdauer bis 2030 erreicht ist und die Verordnung Ausnahmen vorsieht, etwa die Kompensation mit einer Photovoltaikanlage. Eine entschädigungspflichtige materielle Enteignung liegt in der Regel nicht vor."
summary_en: "Under the revision of the Zurich Energy Act adopted by voters in 2021 (implementing MuKEn 2014), existing fixed electric resistance heating and purely directly heated central water heaters must be replaced by 2030; violations are punishable. The court dismissed the appeal alleging a breach of the guarantee of property: the obligation serves environmental protection and security of supply, as heat pumps produce much more heat from the same amount of electricity. It is proportionate, since electric heating has required a permit since 1991, its usual service life will have ended by 2030 and the ordinance provides exceptions, such as compensation by a PV system. As a rule there is no material expropriation requiring compensation."
