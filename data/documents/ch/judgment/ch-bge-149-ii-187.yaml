id: ch-bge-149-ii-187
title: "BGE 149 II 187 (Urteil 2C_273/2022) – Energietarife in der Grundversorgung, Durchschnittspreismethode und zeitliche Geltung von Art. 6 Abs. 5 StromVG"
title_en: "Federal Supreme Court BGE 149 II 187 (2C_273/2022) – energy tariffs in basic supply, average-price method and temporal scope of Art. 6(5) StromVG"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "BGE 149 II 187 / 2C_273/2022"
date: 2023-03-29
status: final
status_note: "Amtlich publiziert als BGE 149 II 187; vereinigt mit 2C_488/2020 (als gegenstandslos abgeschrieben); Beschwerde in 2C_273/2022 abgewiesen"
status_note_en: "Officially published as BGE 149 II 187; joined with 2C_488/2020 (struck off as moot); appeal in 2C_273/2022 dismissed."
languages: [de]
topics: [tariffs, market]
summary_de: "Ein Verteilnetzbetreiber focht die Überprüfung seiner anrechenbaren Energiekosten und Energietarife für die Geschäftsjahre 2009/2010 durch die ElCom an und verlangte die Anwendung des per 1. Juni 2019 revidierten Art. 6 Abs. 5 StromVG. Das Bundesgericht entschied, dass die revidierte Bestimmung auf die früheren Tarifjahre nicht anwendbar ist, und präzisierte seine Rechtsprechung zur Durchschnittspreismethode, namentlich zur Berücksichtigung von Konzernstrukturen und zum massgebenden Energieportfolio. Die Beschwerde wurde abgewiesen."
summary_en: "A distribution grid operator challenged ElCom's review of its chargeable energy costs and energy tariffs for 2009/2010 and sought application of Art. 6(5) StromVG as revised on 1 June 2019. The Federal Supreme Court held that the revised provision does not apply to earlier tariff years and clarified its case law on the average-price method, in particular regarding group structures and the relevant energy portfolio. The appeal was dismissed."
