id: ch-bge-149-ii-86
title: "BGE 149 II 86 (arrêt 1C_240/2021 du 27 janvier 2023) – Parc éolien Eoljoux (Vallée de Joux): sans coordination réglée dans le plan directeur, pas de plan d'affectation"
title_en: "BGE 149 II 86 (judgment 1C_240/2021 of 27 January 2023) – Eoljoux wind farm (Vallée de Joux): no land-use plan without a settled entry in the structure plan"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "BGE 149 II 86 / 1C_240/2021"
date: 2023-01-27
status: final
status_note: "Beschwerde der Gemeinde Le Chenit abgewiesen; die Aufhebung des Nutzungsplans durch das Kantonsgericht Waadt bleibt bestehen."
status_note_en: "Appeal by the municipality of Le Chenit dismissed; the annulment of the land-use plan by the Vaud Cantonal Court stands."
languages: [fr]
topics: [wind, permitting]
summary_de: "Der Bundesrat hatte den Windpark Eoljoux im Wald und im BLN-Objekt Nr. 1022 «Vallée de Joux et Haut-Jura vaudois» bei der Genehmigung des Waadtländer Richtplans nicht als Festsetzung genehmigt. Das Kantonsgericht hob deshalb den Nutzungsplan auf. Das Bundesgericht hielt fest, dass eine Gemeinde, die durch den behördenverbindlichen Richtplan an der Realisierung eines Projekts gehindert wird, diesen im Anfechtungsverfahren vorfrageweise überprüfen lassen kann. In der Sache bestätigte es aber: Ohne Festsetzung im Richtplan kann ein Windpark dieser Grösse weder Gegenstand eines Nutzungsplans noch einer Rodungsbewilligung sein."
summary_en: "When approving the Vaud structure plan, the Federal Council had not approved the Eoljoux wind farm, located in forest and in Federal Inventory of Landscapes site No. 1022 'Vallée de Joux et Haut-Jura vaudois', as a settled entry. The Cantonal Court therefore annulled the land-use plan. The court held that a municipality prevented by the binding structure plan from realising a project may have the plan reviewed incidentally. On the merits, however, it confirmed that without a settled entry in the structure plan a wind farm of this size can be the subject neither of a land-use plan nor of a clearance permit."
