id: ch-bge-151-ii-136
title: "BGE 151 II 136 (Urteil 2C_671/2023) – Entschädigung von Sanierungsmassnahmen bei Wasserkraftwerken, keine Anrechnung wiederkehrender Unterhalts- und Betriebskosten"
title_en: "Federal Supreme Court BGE 151 II 136 (2C_671/2023) – compensation for remediation measures at hydropower plants, recurring maintenance and operating costs not eligible"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "BGE 151 II 136 / 2C_671/2023"
date: 2025-01-21
status: final
status_note: "Amtlich publiziert als BGE 151 II 136; Beschwerde abgewiesen"
status_note_en: "Officially published as BGE 151 II 136; appeal dismissed."
languages: [de]
topics: [hydro, subsidies]
summary_de: "Zwei Betreiberinnen eines Wasserkraftwerks verlangten im Rahmen der Entschädigung für bauliche Sanierungsmassnahmen zur Wiederherstellung der Fischwanderung nach Art. 34 EnG auch die Übernahme der jährlich wiederkehrenden Unterhalts- und Betriebskosten. Das Bundesgericht entschied, dass der Grundsatz der vollständigen Kostenerstattung nur die Kosten der Sanierungsmassnahme selbst erfasst und wiederkehrende Unterhalts- und Betriebskosten nach dem Grundsatz der Einmaligkeit der Subventionsgewährung nicht anrechenbar sind. Die Beschwerde wurde abgewiesen."
summary_en: "Two operators of a hydropower plant sought compensation not only for construction measures to restore fish migration under Art. 34 EnG but also for recurring annual maintenance and operating costs. The Federal Supreme Court held that the principle of full cost reimbursement covers only the costs of the remediation measure itself, and that recurring maintenance and operating costs are not chargeable under the principle that subsidies are granted once. The appeal was dismissed."
