id: ch-bge-151-ii-687
title: "BGE 151 II 687 (Urteil 2C_21/2024) – Individuelle Prüfung der Netznutzungstarife 2009–2016, Basisjahrprinzip und Beweisrecht"
title_en: "Federal Supreme Court BGE 151 II 687 (2C_21/2024) – individual review of grid usage tariffs 2009–2016, base-year principle and rules of evidence"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "BGE 151 II 687 / 2C_21/2024"
date: 2025-02-05
status: final
status_note: "Amtlich publiziert als BGE 151 II 687; Beschwerde abgewiesen"
status_note_en: "Officially published as BGE 151 II 687; appeal dismissed."
languages: [de]
topics: [grid, tariffs]
summary_de: "Ein Endverbraucher verlangte im Streitfall vor der ElCom die Überprüfung der Netznutzungstarife der CKW AG für die Jahre 2009 bis 2016 und rügte unter anderem eine ungenügende Sachverhaltsabklärung und eine eingeschränkte Akteneinsicht. Das Bundesgericht hielt fest, dass im individuellen Tarifprüfungsverfahren derselbe Prüfmassstab wie bei einer Prüfung von Amtes wegen gilt und nach dem Basisjahrprinzip auf die effektiven Kosten des letzten abgeschlossenen Geschäftsjahres abzustellen ist; die ElCom darf sich ohne konkrete Zweifel auf die deklarierten Werte der Kostenrechnung stützen. Die Beschwerde wurde abgewiesen."
summary_en: "An end consumer asked ElCom to review CKW AG's grid usage tariffs for 2009 to 2016, complaining among other things of insufficient fact-finding and restricted access to files. The Federal Supreme Court held that individual tariff reviews apply the same standard as reviews ex officio and that, under the base-year principle, the actual costs of the last completed financial year are decisive; absent concrete doubts, ElCom may rely on the values declared in the cost accounts. The appeal was dismissed."
