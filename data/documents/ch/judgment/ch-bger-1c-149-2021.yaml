id: ch-bger-1c-149-2021
title: "Arrêt du Tribunal fédéral 1C_149/2021 du 25 août 2022 – Tramelan: distance minimale de 500 m entre éoliennes industrielles et habitations dans le règlement communal"
title_en: "Federal Supreme Court judgment 1C_149/2021 of 25 August 2022 – Tramelan: 500 m minimum distance between industrial wind turbines and dwellings in municipal building rules"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_149/2021"
date: 2022-08-25
status: final
status_note: "Publiziert mit Regeste in URP 2023 S. 158. Beschwerde gutgeheissen; die kantonalen Entscheide wurden aufgehoben und die Sache zur Genehmigung der Änderung des Baureglements (Art. 26 Abs. 5) an die kantonale Behörde zurückgewiesen. Zum Windpark Montagne de Tramelan siehe 1C_329/2021 und 1C_335/2021."
status_note_en: "Published with headnote in URP 2023 p. 158. Appeal upheld; the cantonal decisions were annulled and the case remitted to the cantonal authority for approval of the amendment to the building regulations (Art. 26(5)). On the Montagne de Tramelan wind farm see 1C_329/2021 and 1C_335/2021."
languages: [fr]
topics: [wind, permitting]
summary_de: "Das Baureglement der Gemeinde Tramelan darf um eine Bestimmung ergänzt werden, wonach zwischen einer industriellen Windenergieanlage und einem Wohngebäude ein Mindestabstand von 500 Metern einzuhalten ist. Der vom Stimmvolk genehmigte Überbauungsplan für den Windpark Montagne de Tramelan, gegen den sich die kommunale Bestimmung richtete, war zu diesem Zeitpunkt beim Bundesgericht angefochten."
summary_en: "The building regulations of the municipality of Tramelan may be supplemented with a provision requiring a minimum distance of 500 metres between an industrial wind turbine and a residential building. The detailed plan for the Montagne de Tramelan wind farm approved by voters, against which the municipal provision was directed, was at that time under appeal before the Federal Supreme Court."
