id: ch-bger-1c-3-2024
title: "Urteil des Bundesgerichts 1C_3/2024 vom 29. Januar 2025 – Keine kommunalen Belastungsgrenzwerte für Windenergieanlagen"
title_en: "Federal Supreme Court judgment 1C_3/2024 of 29 January 2025 – no municipal exposure limits for wind turbines"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_3/2024"
date: 2025-01-29
status: final
status_note: "Publiziert mit Leitsätzen in URP 2025 S. 689. Beschwerde der Gemeinde Wuppenau nur bezüglich eines Teilsatzes der kommunalen Richtplanmassnahme gutgeheissen (Rückweisung zur Genehmigung an das Departement für Bau und Umwelt TG), im Übrigen abgewiesen."
status_note_en: "Published with headnotes in URP 2025 p. 689. Appeal by the municipality of Wuppenau upheld only regarding one clause of the municipal structure plan measure (remitted to the Thurgau Department of Construction and Environment for approval), otherwise dismissed."
languages: [de]
topics: [wind, permitting]
summary_de: "Die Gemeinde Wuppenau (TG) hatte in ihrem kommunalen Richtplan (Massnahme E 2.1 Windkraftanlagen) und im Baureglement für Windenergieanlagen im Gebiet Greutensberg strenge Vorgaben vorgesehen, darunter Belastungsgrenzwerte für Infraschall, Vorgaben zu Licht und Lichtverschmutzung, einen Mindestabstand von 700 m zu Wohn- und Arbeitsgebäuden und einen maximalen Sichtwinkel von 18° zur Rotorspitze. Der Kanton genehmigte diese Bestimmungen weitgehend nicht, und das Verwaltungsgericht Thurgau bestätigte dies. Das Bundesgericht hielt fest, dass für Infraschall, der dem Lärm gleichgestellt ist, einzig der Bundesrat Belastungsgrenzwerte erlassen darf. Der Mindestabstand und der Sichtwinkel würden Windenergieanlagen in der Gemeinde de facto vereiteln und die nach dem kantonalen Richtplan gebotene umfassende Interessenabwägung im Einzelfall ausschliessen; die Lichtvorgaben fallen in die Zuständigkeit der Bundesbehörden für die Luftfahrt. Gutgeheissen wurde die Beschwerde der Gemeinde nur bezüglich des allgemeinen Grundsatzes, wonach im Gebiet Greutensberg höchstens Grosswindanlagen realisiert werden dürfen, welche die landschaftliche Qualität sowie die Wohn- und Lebenssituation der bestehenden Besiedlung nicht übermässig beeinträchtigen."
summary_en: "The municipality of Wuppenau (TG) had laid down strict requirements for wind turbines in the Greutensberg area in its municipal structure plan (measure E 2.1 wind turbines) and building regulations, including exposure limits for infrasound, rules on lighting and light pollution, a minimum distance of 700 m from residential and work buildings and a maximum viewing angle of 18° to the rotor tip. The canton largely refused to approve these provisions, and the Thurgau Administrative Court confirmed this. The court held that only the Federal Council may set exposure limits for infrasound, which is treated like noise. The minimum distance and the viewing angle would de facto prevent wind turbines in the municipality and exclude the comprehensive case-by-case balancing of interests required by the cantonal structure plan; the lighting rules fall within the competence of the federal aviation authorities. The municipality's appeal was upheld only regarding the general principle that in the Greutensberg area only large wind turbines may be built that do not excessively impair the quality of the landscape and the living conditions of the existing settlement."
