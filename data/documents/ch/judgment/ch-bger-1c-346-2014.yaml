id: ch-bger-1c-346-2014
title: "Urteil des Bundesgerichts 1C_346/2014 vom 26. Oktober 2016 – Windpark Schwyberg (FR), Richtplanpflicht und Landschaftsschutz"
title_en: "Federal Supreme Court judgment 1C_346/2014 of 26 October 2016 – Schwyberg wind farm (FR), structure plan requirement and landscape protection"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_346/2014"
date: 2016-10-26
status: final
status_note: "Beschwerde von Natur- und Umweltschutzorganisationen gutgeheissen und an das Kantonsgericht Freiburg zurückgewiesen. Ob das Urteil amtlich publiziert wurde und in welcher Sprache es ergangen ist, wurde nicht geprüft; Angaben zum Inhalt aus Sekundärquellen."
status_note_en: "Appeal by nature and environmental organisations upheld and remitted to the Fribourg Cantonal Court. Whether the judgment was officially published and its language were not checked; content information from secondary sources."
languages: [de]
topics: [wind, permitting]
summary_de: "Am Schwyberg im Kanton Freiburg war ein Windpark mit neun rund 140 Meter hohen Anlagen geplant. Das Bundesgericht hiess die Beschwerde von Natur- und Umweltschutzorganisationen gut: Ein Windpark dieser Grösse mit gewichtigen Auswirkungen auf Raum und Umwelt braucht eine Grundlage im kantonalen Richtplan, die hier fehlte; zudem seien die Interessen des Landschaftsschutzes zu wenig gewichtet worden, zumal der Windpark einen ersten schweren Eingriff seiner Art darstelle."
summary_en: "A wind farm with nine turbines of about 140 metres was planned on the Schwyberg in the canton of Fribourg. The court upheld the appeal by nature and environmental organisations: a wind farm of this size with significant spatial and environmental impacts needs a basis in the cantonal structure plan, which was lacking; moreover, landscape protection had been given too little weight, as the wind farm would be the first serious intervention of its kind."
