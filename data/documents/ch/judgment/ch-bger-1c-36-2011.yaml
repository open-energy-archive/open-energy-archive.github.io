id: ch-bger-1c-36-2011
title: "Urteil des Bundesgerichts 1C_36/2011 vom 8. Februar 2012 – Gaskombikraftwerk: kantonales Planungs- und Baurecht anwendbar"
title_en: "Federal Supreme Court judgment 1C_36/2011 of 8 February 2012 – combined-cycle gas power plant: cantonal planning and building law applies"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_36/2011"
date: 2012-02-08
status: final
status_note: "Publiziert mit Leitsätzen in URP 2013 S. 541. Zusammenfassung gestützt auf die veröffentlichten Leitsätze bzw. die Angaben zu Gegenstand und Ergebnis; Volltext nicht im Einzelnen gesichtet."
status_note_en: "Published with headnotes in URP 2013 p. 541. Summary based on the published headnotes or on the information on subject and outcome; full text not reviewed in detail."
languages: [de]
topics: [permitting, supply_security]
summary_de: "Soweit das Bundesrecht keine verbindlichen Vorschriften zur Planung und Errichtung fossil-thermischer Kraftwerke enthält, gilt das Planungs- und Baurecht der Kantone und Gemeinden. Auch die CO2-Gesetzgebung setzt voraus, dass die Baubewilligung für ein Gaskombikraftwerk im ordentlichen planungs- und baurechtlichen Verfahren erteilt wird."
summary_en: "Insofar as federal law contains no binding rules on planning and building fossil-thermal power plants, the planning and building law of the cantons and municipalities applies. The CO2 legislation likewise presupposes that the building permit for a combined-cycle gas power plant is granted in the ordinary planning and building procedure."
