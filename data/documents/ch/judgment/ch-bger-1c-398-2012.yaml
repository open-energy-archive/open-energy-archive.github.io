id: ch-bger-1c-398-2012
title: "Urteil des Bundesgerichts 1C_398/2012 vom 27. Mai 2013 – Ausbau der Leitung Altgass/Horgen–Obfelden von 50 auf 110 kV: keine Teilverkabelung"
title_en: "Federal Supreme Court judgment 1C_398/2012 of 27 May 2013 – upgrade of the Altgass/Horgen–Obfelden line from 50 to 110 kV: no partial undergrounding"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_398/2012"
date: 2013-05-27
status: final
status_note: "Beschwerde abgewiesen. Zuvor hatte das Bundesgericht mit Urteil 1C_560/2010 vom 14. Juli 2011 eine frühere Plangenehmigung aufgehoben, weil die Interessenabwägung zur Verkabelung wesentliche Lücken aufwies."
status_note_en: "Appeal dismissed. Previously the court had annulled an earlier planning approval in judgment 1C_560/2010 of 14 July 2011 because the balancing of interests regarding undergrounding had significant gaps."
languages: [de]
topics: [grid, permitting]
summary_de: "Gegenstand war die Plangenehmigung des BFE vom 27. Oktober 2009 für den Umbau und die Verlegung einer Teilstrecke der bestehenden 50-kV-Leitung Altgass/Horgen–Obfelden (Mast 35–60) in eine neue, rund 4 km lange 110-kV-Betonmastleitung entlang der Autobahn. Anwohnende und die Katholische Kirchgemeinde Mettmenstetten verlangten eine Teilverkabelung. Nach erneuter Prüfung kam das Bundesgericht zum Schluss, dass der Nutzen der Teilverkabelung für das Landschaftsschutzobjekt (Drumlinlandschaft Mettmenstetten-Uttenberg, ein kantonal inventarisiertes geomorphologisches Objekt) zu gering ist, um die Mehrkosten zu rechtfertigen, zumal die Umgebung durch Autobahn und Siedlung bereits vorbelastet ist."
summary_en: "The subject was the Federal Office of Energy's planning approval of 27 October 2009 for converting and relocating a section of the existing 50 kV Altgass/Horgen–Obfelden line (pylons 35–60) into a new, approximately 4 km 110 kV concrete-pylon line along the motorway. Residents and the Catholic parish of Mettmenstetten sought partial undergrounding. After re-examination, the court concluded that the benefit of partial undergrounding for the protected landscape (the Mettmenstetten-Uttenberg drumlin landscape, a geomorphological object in the cantonal inventory) was too small to justify the additional cost, particularly as the surroundings were already affected by the motorway and settlements."
