id: ch-bger-1c-398-2012
title: "Urteil des Bundesgerichts 1C_398/2012 vom 27. Mai 2013 – 110-kV-Leitungen Altgass/Horgen–Obfelden: keine Verkabelung"
title_en: "Federal Supreme Court judgment 1C_398/2012 of 27 May 2013 – 110 kV lines Altgass/Horgen–Obfelden: no undergrounding"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_398/2012"
date: 2013-05-27
status: final
status_note: "Beschwerde abgewiesen. Zuvor hatte das Bundesgericht mit Urteil 1C_560/2010 vom 14. Juli 2011 eine frühere Plangenehmigung aufgehoben, weil die Interessenabwägung zur Verkabelung wesentliche Lücken aufwies. Zusammenfassung gestützt auf die veröffentlichten Leitsätze bzw. die Angaben zu Gegenstand und Ergebnis; Volltext nicht im Einzelnen gesichtet."
status_note_en: "Appeal dismissed. Previously the court had annulled an earlier planning approval in judgment 1C_560/2010 of 14 July 2011 because the balancing of interests regarding undergrounding had significant gaps. Summary based on the published headnotes or on the information on subject and outcome; full text not reviewed in detail."
languages: [de]
topics: [grid, permitting]
summary_de: "Gegenstand war die Plangenehmigung für die Verlegung der 110-kV-Leitungen Altgass/Horgen–Obfelden (Abschnitt Mast 35–60) als Betonmastleitung. Nach erneuter Prüfung der Verkabelung zur Schonung der Landschaft (Art. 3 NHG) kam das Bundesgericht zum Schluss, dass die Mehrkosten einer Verkabelung im konkreten Fall nicht gerechtfertigt sind, um die Umgebung eines Landschaftsschutzobjekts von störenden Infrastrukturbauten freizuhalten."
summary_en: "The subject was the planning approval for relocating the 110 kV Altgass/Horgen–Obfelden lines (section pylon 35–60) as a concrete-pylon line. After re-examining undergrounding to protect the landscape (Art. 3 Nature and Cultural Heritage Act), the court concluded that the additional cost of undergrounding was not justified in this case to keep the surroundings of a protected landscape free of disturbing infrastructure."
