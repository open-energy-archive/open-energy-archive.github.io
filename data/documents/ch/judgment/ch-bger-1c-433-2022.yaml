id: ch-bger-1c-433-2022
title: "Urteil des Bundesgerichts 1C_433/2022 vom 12. Dezember 2023 – Gemeindeinitiative «Hochdorf nutzt die Solarenergie»"
title_en: "Federal Supreme Court judgment 1C_433/2022 of 12 December 2023 – municipal initiative 'Hochdorf uses solar energy'"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_433/2022"
date: 2023-12-12
status: final
status_note: "Stimmrechtsbeschwerde abgewiesen."
status_note_en: "Appeal on voting rights dismissed."
languages: [de]
topics: [solar, subsidies, tariffs]
summary_de: "Eine Gemeindeinitiative in Hochdorf (LU) wollte den Ausbau der Solarenergie über eine kommunale Abgabe finanzieren. Die Vorinstanz verneinte die Kompetenz der Gemeinde, eine solche Abgabe zu erheben, weil eine kantonalgesetzliche Grundlage fehle und es sich um eine Steuer handle. Das Bundesgericht erachtete dies nicht als willkürlich; einen Verstoss gegen Art. 15 EnG oder Art. 14 StromVG sah es nicht."
summary_en: "A municipal initiative in Hochdorf (LU) sought to finance the expansion of solar energy through a municipal levy. The lower court denied the municipality's power to impose such a levy because there was no cantonal statutory basis and the levy was a tax. The court did not consider this arbitrary; it saw no breach of Art. 15 EnG or Art. 14 StromVG."
