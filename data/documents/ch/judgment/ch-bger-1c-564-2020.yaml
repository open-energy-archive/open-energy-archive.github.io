id: ch-bger-1c-564-2020
title: "Arrêt du Tribunal fédéral 1C_564/2020 du 24 février 2022 – Parc éolien: plan d'affectation adopté avant l'inscription au plan directeur cantonal"
title_en: "Federal Supreme Court judgment 1C_564/2020 of 24 February 2022 – wind farm: land-use plan adopted before entry in the cantonal structure plan"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_564/2020"
date: 2022-02-24
status: final
status_note: "Publiziert mit Regeste in URP 2022 S. 523. Zusammenfassung gestützt auf die veröffentlichten Leitsätze bzw. die Angaben zu Gegenstand und Ergebnis; Volltext nicht im Einzelnen gesichtet."
status_note_en: "Published with headnote in URP 2022 p. 523. Summary based on the published headnotes or on the information on subject and outcome; full text not reviewed in detail."
languages: [fr]
topics: [wind, permitting]
summary_de: "Der Detailnutzungsplan für einen Windpark wurde von der Gemeinde beschlossen und vom Kanton genehmigt, bevor der kantonale Richtplan einen entsprechenden Eintrag enthielt; der Richtplan wurde erst während des Beschwerdeverfahrens vor dem Kantonsgericht ergänzt. Das Bundesgericht bezeichnete dieses Vorgehen mit Blick auf den Grundsatz der Planhierarchie als kritikwürdig und risikobehaftet."
summary_en: "The detailed land-use plan for a wind farm was adopted by the municipality and approved by the canton before the cantonal structure plan contained a corresponding entry; the structure plan was only supplemented during the appeal before the Cantonal Court. The court described this approach as open to criticism and risky in view of the principle of the hierarchy of plans."
