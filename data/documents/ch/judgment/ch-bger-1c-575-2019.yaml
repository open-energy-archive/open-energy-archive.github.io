id: ch-bger-1c-575-2019
title: "Arrêt du Tribunal fédéral 1C_575/2019 et 1C_576/2019 du 1er mars 2022 – Parc éolien: réexamen du potentiel énergétique dans la planification d'affectation"
title_en: "Federal Supreme Court judgments 1C_575/2019 and 1C_576/2019 of 1 March 2022 – wind farm: re-examining energy potential in land-use planning"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_575/2019, 1C_576/2019"
date: 2022-03-01
status: final
status_note: "Publiziert mit Regeste in URP 2022 S. 526. Das Bundesgericht verweist in späteren Urteilen (u. a. BGE 152 II 461) auf die Anforderungen an Nutzungspläne für Windparks aus diesem Urteil. Zusammenfassung gestützt auf die veröffentlichten Leitsätze bzw. die Angaben zu Gegenstand und Ergebnis; Volltext nicht im Einzelnen gesichtet."
status_note_en: "Published with headnote in URP 2022 p. 526. Later judgments (including BGE 152 II 461) refer to its requirements for land-use plans for wind farms. Summary based on the published headnotes or on the information on subject and outcome; full text not reviewed in detail."
languages: [fr]
topics: [wind, permitting]
summary_de: "Dass ein ausreichendes Energiepotenzial bereits bei der Festsetzung im kantonalen Richtplan anerkannt wurde, entbindet nicht davon, die Rechtfertigung jedes konkreten Projekts im Nutzungsplanverfahren erneut zu prüfen, insbesondere die Windgeschwindigkeiten, von denen das Energiepotenzial direkt abhängt. Nutzungspläne für Windparks müssen Zahl, Standort und Grösse der Anlagen sowie die erwartete Produktion festlegen; technische Einzelheiten wie das genaue Anlagenmodell können dem Baubewilligungsverfahren vorbehalten bleiben."
summary_en: "The fact that sufficient energy potential was already recognised when the project was entered in the cantonal structure plan does not relieve the authorities of re-examining the justification of each specific project in the land-use planning procedure, in particular the wind speeds on which the energy potential directly depends. Land-use plans for wind farms must set the number, location and size of the turbines and the expected production; technical details such as the exact turbine model may be left to the building permit procedure."
