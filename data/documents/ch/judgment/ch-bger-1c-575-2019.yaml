id: ch-bger-1c-575-2019
title: "Arrêt du Tribunal fédéral 1C_575/2019 et 1C_576/2019 du 1er mars 2022 – Parc éolien: réexamen du potentiel énergétique dans la planification d'affectation"
title_en: "Federal Supreme Court judgments 1C_575/2019 and 1C_576/2019 of 1 March 2022 – wind farm: re-examining energy potential in land-use planning"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_575/2019, 1C_576/2019"
date: 2022-03-01
status: final
status_note: "Publiziert mit Regeste in URP 2022 S. 526. Beschwerden abgewiesen. Das Bundesgericht verweist in späteren Urteilen (u. a. BGE 152 II 461) auf die Anforderungen an Nutzungspläne für Windparks aus diesem Urteil."
status_note_en: "Published with headnote in URP 2022 p. 526. Appeals dismissed. Later judgments (including BGE 152 II 461) refer to its requirements for land-use plans for wind farms."
languages: [fr]
topics: [wind, permitting]
summary_de: "Betroffen war der Windpark EolJorat Sud im Jorat-Wald (Lausanne, VD) mit acht Anlagen und einer erwarteten Produktion von 55–58 GWh pro Jahr. Dass ein ausreichendes Energiepotenzial bereits bei der Festsetzung im kantonalen Richtplan anerkannt wurde, entbindet nicht davon, die Rechtfertigung des konkreten Projekts im Nutzungsplanverfahren erneut zu prüfen, insbesondere die Windgeschwindigkeiten, von denen das Energiepotenzial direkt abhängt. Der Nutzungsplan muss Standorte und Abmessungen der Anlagen hinreichend genau festlegen und die erwartete Produktion ausweisen; die definitive Wahl des Anlagenmodells kann dem Baubewilligungsverfahren vorbehalten bleiben. Das Bundesgericht wies die Beschwerden der Gemeinde Cugy und von Privaten ab."
summary_en: "The case concerned the EolJorat Sud wind farm in the Jorat forest (Lausanne, VD) with eight turbines and an expected production of 55–58 GWh per year. The fact that sufficient energy potential was already recognised when the project was entered in the cantonal structure plan does not relieve the authorities of re-examining the justification of the specific project in the land-use planning procedure, in particular the wind speeds on which the energy potential directly depends. The land-use plan must define the locations and dimensions of the turbines with sufficient precision and state the expected production; the final choice of turbine model may be left to the building permit procedure. The court dismissed the appeals by the municipality of Cugy and private individuals."
