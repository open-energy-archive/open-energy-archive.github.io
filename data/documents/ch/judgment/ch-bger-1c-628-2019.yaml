id: ch-bger-1c-628-2019
title: "Arrêt du Tribunal fédéral 1C_628/2019 du 22 décembre 2021 – Intérêt national des parcs éoliens dès 20 GWh par an"
title_en: "Federal Supreme Court judgment 1C_628/2019 of 22 December 2021 – national interest of wind farms from 20 GWh per year"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, I. öffentlich-rechtliche Abteilung"
reference: "1C_628/2019"
date: 2021-12-22
status: final
status_note: "Publiziert mit Regeste in URP 2022 S. 519. Betrifft den Windpark Sur Grati (Premier, Vallorbe, Vaulion VD); Beschwerde abgewiesen, soweit darauf eingetreten wurde."
status_note_en: "Published with headnote in URP 2022 p. 519. Concerns the Sur Grati wind farm (Premier, Vallorbe, Vaulion VD); appeal dismissed insofar as admissible."
languages: [fr]
topics: [wind, permitting, renewables]
summary_de: "Nach der Energieverordnung haben Windparks ein nationales Interesse, wenn sie eine mittlere erwartete Jahresproduktion von mindestens 20 GWh erreichen. Das Bundesgericht bestätigte diese Schwelle: In der Schweiz erreichen 84 % der Projekte mehr als 20 GWh pro Jahr, aber nur 53 % mehr als 40 GWh. Ein höherer Schwellenwert würde fast der Hälfte der Windparks das nationale Interesse absprechen und die Ausbauziele des Energiegesetzes unerreichbar machen."
summary_en: "Under the Energy Ordinance, wind farms are of national interest if they reach an expected average annual production of at least 20 GWh. The court confirmed this threshold: in Switzerland 84% of projects exceed 20 GWh per year, but only 53% exceed 40 GWh. A higher threshold would deny national interest to almost half of all wind farms and make the expansion targets of the Energy Act unattainable."
