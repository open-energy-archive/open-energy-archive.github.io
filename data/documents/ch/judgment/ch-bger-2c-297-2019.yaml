id: ch-bger-2c-297-2019
title: "Urteil des Bundesgerichts 2C_297/2019 vom 28. Mai 2020 (Energie Wasser Bern gegen ElCom) – Tarife 2009 und 2010, Abgaben an das Gemeinwesen, ökologische Mehrwerte, Abbruchkosten"
title_en: "Federal Supreme Court judgment 2C_297/2019 of 28 May 2020 (Energie Wasser Bern v ElCom) – tariffs 2009 and 2010, charges to public authorities, ecological added value, demolition costs"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "2C_297/2019"
date: 2020-05-28
status: final
status_note: "Nicht amtlich publiziert; Beschwerde in allen Hauptpunkten abgewiesen, in zwei Nebenpunkten gutgeheissen und an die ElCom zurückgewiesen. Das daraus hervorgegangene Verfahren zur Gewinnablieferung führte zu den Urteilen A-5380/2022 und 2C_609/2024."
status_note_en: "Not officially published; appeal dismissed on all main points, upheld on two secondary points and remitted to ElCom. The resulting proceedings on the profit transfer led to judgments A-5380/2022 and 2C_609/2024."
languages: [de]
topics: [tariffs, grid, renewables]
summary_de: "Das Bundesgericht bestätigte die ElCom in den Hauptpunkten. Die ElCom darf prüfen, ob Abgaben und Leistungen an Gemeinwesen im richtigen Tarifbestandteil ausgewiesen sind und ob dafür eine gesetzliche Grundlage besteht. Der Begriff des Elektrizitätstarifs umfasst auch ökologische Mehrwerte und Zusatzqualitäten; sie sind ein alternatives Energieprodukt in der Grundversorgung und unterliegen der vollen Überprüfung durch die ElCom. Abbruchkosten dürfen nicht zu den anrechenbaren Kapitalkosten geschlagen, sondern nur als Betriebskosten berücksichtigt werden, und ein auf Planwerten beruhender Umlageschlüssel für Gemeinkosten ist nicht gesetzeskonform. Zurückgewiesen wurden die Fragen, ob die Gewinnablieferung an die Stadt Bern energiebezogen ist, und die Berechnung der Kosten für Pumpenergie."
summary_en: "The court confirmed ElCom on the main points. ElCom may examine whether charges and payments to public authorities are shown in the correct tariff component and whether there is a legal basis for them. The concept of electricity tariff also covers ecological added value and additional qualities; they are an alternative energy product in basic supply and subject to ElCom's full review. Demolition costs may not be added to chargeable capital costs but only treated as operating costs, and an allocation key for overheads based on planned values is not lawful. The questions whether the profit transfer to the City of Bern relates to energy and how pumping energy costs are calculated were remitted."
