summary_de: "Das Bundesgericht bestätigte die vorsorgliche Senkung des Tarifs für Systemdienstleistungen durch die ElCom von 0,90 auf 0,77 Rp./kWh. Der Entscheid betrifft die Tarifierung auf der Übertragungsnetzebene."
summary_en: "The Federal Supreme Court upheld ElCom's provisional reduction of the tariff for ancillary services from 0.90 to 0.77 Rp./kWh. The decision concerns tariffs at transmission grid level."
