title: "Urteil des Bundesgerichts 2C_367/2012 vom 20. November 2012 (swissgrid ag gegen ElCom) – Tarife Netzebene 1 und Systemdienstleistungen"
title_en: "Federal Supreme Court 2C_367/2012 – tariffs for grid level 1 and ancillary services"
doc_type: judgment
