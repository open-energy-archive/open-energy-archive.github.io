id: ch-bger-2c-409-2020
title: "Urteil des Bundesgerichts 2C_409/2020 vom 24. März 2021 – Investitionsbeitrag für die Erneuerung der Staumauer Grimselsee"
title_en: "Federal Supreme Court judgment 2C_409/2020 of 24 March 2021 – investment contribution for renewing the Grimselsee dam"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "2C_409/2020"
date: 2021-03-24
status: final
status_note: "Beschwerde der Kraftwerke Oberhasli AG gutgeheissen und zur neuen Beurteilung an das BFE zurückgewiesen."
status_note_en: "Appeal by Kraftwerke Oberhasli AG upheld and remitted to the Federal Office of Energy for reassessment."
languages: [de]
topics: [hydro, subsidies]
summary_de: "Streitig war ein Investitionsbeitrag für die erhebliche Erneuerung der Staumauer am Grimselsee. Das Bundesgericht äusserte sich zur Anwendbarkeit von Art. 63 Abs. 4 EnFV und zur Berechnung der Geldzuflüsse bei der Prüfung, ob ein Anspruch auf einen Investitionsbeitrag besteht; dabei waren der Schadenszustand der Staumauer und seine prognostizierte Entwicklung zu berücksichtigen. Es hiess die Beschwerde gut und wies die Sache zur neuen Beurteilung zurück."
summary_en: "The dispute concerned an investment contribution for the substantial renewal of the Grimselsee dam. The court addressed the applicability of Art. 63(4) of the Energy Promotion Ordinance and the calculation of cash inflows when assessing entitlement to an investment contribution, taking into account the dam's state of damage and its forecast development. It upheld the appeal and remitted the case for reassessment."
