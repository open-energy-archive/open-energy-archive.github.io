id: ch-bger-2c-549-2026
title: 'Urteil des Bundesgerichts 2C_549/2026 vom 28. September 2026 – Strompreis-Bonus Basel-Stadt: Nichteintreten auf eine übermässig weitschweifige, mit KI erstellte Beschwerde'
title_en: 'Federal Supreme Court 2C_549/2026 of 28 September 2026 – Basel-Stadt electricity price bonus: inadmissibility of an excessively lengthy appeal drafted with AI'
doc_type: judgment
jurisdiction: CH
issuer: Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung
reference: 2C_549/2026
date: 2026-09-28
status: final
status_note: 'Einzelrichterlicher Nichteintretensentscheid im vereinfachten Verfahren (Art. 108 Abs. 1 lit. b BGG). Vorinstanz: Appellationsgericht Basel-Stadt, VD.2026.48 vom 20.7.2026. Energierechtlich nur am Rand relevant: Das Bundesgericht prüfte die Sache nicht materiell; die Ausführungen zum Strompreis-Bonus stammen aus der Zusammenfassung des kantonalen Urteils.'
status_note_en: 'Single-judge decision of inadmissibility in the simplified procedure (Art. 108(1)(b) Federal Supreme Court Act). Lower instance: Basel-Stadt Court of Appeal, VD.2026.48 of 20 July 2026. Of marginal relevance to energy law: the Federal Supreme Court did not examine the merits; the statements on the electricity price bonus come from the summary of the cantonal judgment.'
