summary_de: Streitig war, ob ein am 24. Dezember 2024 geborenes Kind Anspruch auf den Strompreis-Bonus 2024 hat, mit dem Basel-Stadt die Lenkungsabgabe auf Strom an die Bevölkerung zurückverteilt. Nach dem kantonalen Recht ist der Wohnsitz an einem Stichtag Mitte Dezember massgebend (§ 10 Abs. 2 der Verordnung zur Lenkungsabgabe und zum Strompreis-Bonus); das Appellationsgericht hatte den Stichtag als sachlich begründet und mit Rechtsgleichheit und Willkürverbot vereinbar beurteilt. Das Bundesgericht trat auf die 243-seitige Beschwerde – das 28-Fache des angefochtenen Urteils – wegen übermässiger Weitschweifigkeit nicht ein, ohne Nachfrist, weil der Beschwerdeführer die Anforderungen bewusst missachtet hatte. Es hielt fest, dass der Einsatz künstlicher Intelligenz nicht von den Begründungsanforderungen entbindet und keinen Freipass für ausufernde Rechtsschriften bildet.
summary_en: At issue was whether a child born on 24 December 2024 was entitled to the 2024 electricity price bonus, through which Basel-Stadt redistributes its steering levy on electricity to the population. Under cantonal law, residence on a reference date in mid-December is decisive; the Court of Appeal had found the reference date objectively justified and compatible with equal treatment and the prohibition of arbitrariness. The Federal Supreme Court declined to hear the 243-page appeal – 28 times the length of the contested judgment – as excessively lengthy, without granting time to amend because the appellant had knowingly disregarded the requirements. It held that using artificial intelligence does not exempt a party from the requirements for stating reasons and is no licence for sprawling submissions.
