summary_de: "Das Bundesgericht entschied, dass Gewinnablieferungen an das Gemeinwesen über den regulierten Gewinn hinaus nicht dem Energietarif, sondern den Abgaben und Leistungen an Gemeinwesen im Netztarif zuzuordnen sind. Abgaben auf der Energie sind nur zulässig, wenn sie direkt mit der Energieproduktion zusammenhängen."
