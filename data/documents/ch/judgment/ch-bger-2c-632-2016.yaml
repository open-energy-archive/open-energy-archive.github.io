id: ch-bger-2c-632-2016
title: "Urteil des Bundesgerichts 2C_632/2016 vom 6. November 2017 (Stadt Winterthur gegen Swissgrid AG) – Vorrang bei der Zuteilung grenzüberschreitender Übertragungskapazitäten"
title_en: "Federal Supreme Court 2C_632/2016 – priority in the allocation of cross-border transmission capacity"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung"
reference: "2C_632/2016"
date: 2017-11-06
status: final
status_note: "Nicht amtlich publiziert; Beschwerde abgewiesen"
status_note_en: "Not officially published; appeal dismissed."
languages: [de]
topics: [cross_border, grid, market]
summary_de: "Die Stadt Winterthur beschaffte ab 2014 Strom für ihre grundversorgten Endverbraucher im europäischen Markt und verlangte, dass die entsprechenden Importe bei der Zuteilung grenzüberschreitender Netzkapazitäten nach Art. 17 Abs. 2 StromVG Vorrang erhalten. Das Bundesgericht entschied, dass dieser Vorrang nur gewährt wird, wenn der Import zur Erfüllung der Versorgungspflicht notwendig ist; ein blosser Preisvorteil gegenüber inländischer Beschaffung genügt nicht. Die Beschwerde wurde abgewiesen."
summary_en: "From 2014 the City of Winterthur procured electricity for its basic-supply customers on the European market and demanded priority for these imports in the allocation of cross-border grid capacity under Art. 17(2) StromVG. The Federal Supreme Court held that priority is granted only if the import is necessary to fulfil the supply obligation; a mere price advantage over domestic procurement is not sufficient. The appeal was dismissed."
