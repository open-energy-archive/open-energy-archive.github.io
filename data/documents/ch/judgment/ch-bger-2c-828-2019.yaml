id: ch-bger-2c-828-2019
title: Arrêt du Tribunal fédéral 2C_828/2019 du 16 juillet 2020 (Ville de Lausanne contre ElCom) – Contrôle des tarifs de l’approvisionnement de base en électricité 2009 et 2010, méthode «cost-plus»
title_en: Federal Supreme Court 2C_828/2019 of 16 July 2020 (City of Lausanne v ElCom) – review of basic supply electricity tariffs 2009 and 2010, cost-plus method
doc_type: judgment
jurisdiction: CH
issuer: Schweizerisches Bundesgericht, II. öffentlich-rechtliche Abteilung
reference: 2C_828/2019
date: 2020-07-16
status: final
status_note: 'Nicht amtlich publiziert. Vorinstanz: BVGer A-699/2017 vom 26.8.2019 (bestätigt); Verfügung der ElCom vom 15.12.2016 (Services industriels de Lausanne). Wird von der ElCom und in der Rechtsprechung regelmässig zur kostenbasierten Prüfung der Energietarife zitiert.'
status_note_en: 'Not officially published. Lower instance: Federal Administrative Court A-699/2017 of 26 August 2019 (upheld); ElCom decision of 15 December 2016 (Services industriels de Lausanne). Regularly cited by ElCom and the courts on cost-based review of energy tariffs.'
languages:
- fr
topics:
- tariffs
- market
summary_de: 'Das Bundesgericht bestätigte die kostenbasierte Prüfung der Energietarife in der Grundversorgung durch die ElCom («cost-plus»): Ein «angemessener» Tarif nach Art. 6 Abs. 1 StromVG bemisst sich an den anrechenbaren Kosten (Gestehungskosten einer effizienten Produktion, langfristige Bezugsverträge und Marktkäufe) zuzüglich Verwaltungs- und Vertriebskosten mit Gewinn nach der Regel «95/150 Franken». Ein Netzbetreiber, der günstiger produziert als der Markt, darf seinen gebundenen Kunden deshalb keine Marktpreise verrechnen. Überdeckungen sind über Deckungsdifferenzen zurückzuerstatten; die Begrenzung nach Art. 6 Abs. 5 StromVG gilt nur für Kosten aus erneuerbarer inländischer Produktion über dem Marktpreis. Weil die ElCom keine Verzinsung verfügt hatte, schuldet die Stadt Lausanne keinen Zins auf den Rückerstattungen.'
summary_en: 'The Federal Supreme Court upheld ElCom’s cost-based review of basic supply energy tariffs (cost-plus): an "equitable" tariff under Article 6(1) of the Electricity Supply Act is measured by allowable costs (production costs of efficient generation, long-term supply contracts and market purchases) plus administration and sales costs including profit under the "CHF 95/150" rule. A grid operator that generates more cheaply than the market may therefore not charge captive customers market prices. Over-recoveries must be refunded through coverage differences; the limitation under Article 6(5) applies only to costs of domestic renewable generation above market price. As ElCom had not ordered interest, the City of Lausanne owes no interest on the refunds.'
