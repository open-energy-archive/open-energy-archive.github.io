id: ch-bvge-2015-38
title: "Urteil des Bundesverwaltungsgerichts A-2850/2014 vom 28. Mai 2015 (Heuberge AG gegen Repower Schweiz AG und ElCom) – Zuständigkeit für Netzanschlusskosten und Netzkostenbeiträge (BVGE 2015/38)"
title_en: "Federal Administrative Court BVGE 2015/38 (A-2850/2014) – ElCom has no jurisdiction over grid connection costs and grid cost contributions"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesverwaltungsgericht, Abteilung I"
reference: "BVGE 2015/38 / A-2850/2014"
date: 2015-05-28
status: final
languages: [de]
topics: [grid, tariffs]
summary_de: "Die ElCom hatte sich für die Festlegung von Netzanschlusskosten und Netzkostenbeiträgen als unzuständig erklärt. Das Bundesverwaltungsgericht bestätigte dies im publizierten Leitentscheid: Aus dem Sachzusammenhang zwischen Netznutzungsentgelt und Anschlusskosten lasse sich keine Prüfungsbefugnis der ElCom ableiten. Art. 5 Abs. 2 StromVG begründe lediglich eine Anschlusspflicht, während sich die Kostentragung weiterhin nach kantonalem oder kommunalem Recht oder nach Vertrag richte."
summary_en: "ElCom had declared itself not competent to determine grid connection costs and grid cost contributions. The Federal Administrative Court confirmed this in a published leading decision: no review power for ElCom can be derived from the link between grid usage charges and connection costs. Art. 5(2) StromVG establishes only an obligation to connect, while cost allocation continues to be governed by cantonal or municipal law or by contract."
