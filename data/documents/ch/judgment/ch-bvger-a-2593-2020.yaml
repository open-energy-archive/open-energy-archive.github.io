id: ch-bvger-a-2593-2020
title: "Urteil des Bundesverwaltungsgerichts A-2593/2020 vom 5. Mai 2021 – Verjährung des Anspruchs auf Vergütung von Netzverstärkungskosten"
title_en: "Federal Administrative Court judgment A-2593/2020 of 5 May 2021 – limitation of claims for reimbursement of grid reinforcement costs"
doc_type: judgment
jurisdiction: CH
issuer: "Bundesverwaltungsgericht, Abteilung I"
reference: "A-2593/2020"
date: 2021-05-05
status: final
status_note: "Beschwerde abgewiesen. Bestätigt die Praxis der ElCom (u. a. 236-01184)."
status_note_en: "Appeal dismissed. Confirms ElCom practice (including 236-01184)."
languages: [de]
topics: [grid, solar, renewables]
summary_de: "Ein Netzbetreiber verlangte die Vergütung von Netzverstärkungskosten für den Anschluss einer Photovoltaikanlage. Das Bundesverwaltungsgericht qualifizierte die Rückerstattungszahlung als Subvention und bestätigte, dass der Anspruch verjährt war; es wies die Beschwerde ab."
summary_en: "A network operator sought reimbursement of grid reinforcement costs for connecting a PV system. The court classified the reimbursement as a subsidy and confirmed that the claim was time-barred; it dismissed the appeal."
