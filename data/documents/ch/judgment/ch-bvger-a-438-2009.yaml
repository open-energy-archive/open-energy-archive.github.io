id: ch-bvger-a-438-2009
title: "Urteil des Bundesverwaltungsgerichts A-438/2009 vom 8. März 2011 (Gemeinde Lauerz u.a. gegen Alpiq Netz AG Gösgen und BFE) – Plangenehmigung 380-kV-Leitung Amsteg–Mettlen, Teilstück Ingenbohl–Lauerz"
title_en: "Federal Administrative Court A-438/2009 – plan approval for the 380 kV line Amsteg–Mettlen (Ingenbohl–Lauerz section)"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesverwaltungsgericht, Abteilung I"
reference: "A-438/2009"
date: 2011-03-08
status: final
languages: [de]
topics: [grid, permitting]
summary_de: "Das Bundesverwaltungsgericht wies die Beschwerden der Gemeinde Lauerz und weiterer Betroffener gegen die Plangenehmigung des BFE für den Ersatz einer 380-kV-Leitung auf dem Abschnitt Ingenbohl–Lauerz ab. Es hielt fest, dass zwei räumlich nahe, parallel geführte Leitungen nach der NISV als eine einzige Anlage gelten und der Ersatz einer dieser Leitungen deshalb als Änderung und nicht als Neuanlage zu beurteilen ist. Verfahrensmängel bei der Publikation und die blosse Aussteckung mit Holzpfählen statt Profilen führten nicht zur Aufhebung der Genehmigung."
