id: ch-bvger-a-484-2024
title: "Urteil des Bundesverwaltungsgerichts A-484/2024 vom 20. Juni 2025 (Politische Gemeinde Rorschacherberg und A. gegen ElCom) – Smart Meter: Duldungspflicht, Abschaltfunktion und Datenbearbeitung"
title_en: "Federal Administrative Court A-484/2024 – smart meters: duty to accept installation, disconnection function and data processing"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesverwaltungsgericht, Abteilung I"
reference: "A-484/2024 / A-503/2024"
date: 2025-06-20
status: final
languages: [de]
topics: [grid]
summary_de: "Nach der Rückweisung im Urteil A-2372/2021 bestätigte das Bundesverwaltungsgericht die neue Verfügung der ElCom vom 5. Dezember 2023 im Wesentlichen. Endverbraucher müssen den Einbau eines intelligenten Messsystems auch ohne Zustimmung dulden; statt eines Ausbaus genügt ein Nutzungsverbot der Abschaltfunktion, und die Erfassung von Viertelstunden-Lastgängen mit fünfjähriger Aufbewahrung ist verhältnismässig. Zudem hielt das Gericht fest, dass einer Gemeinde als Netzbetreiberin Verfahrenskosten auferlegt werden können."
summary_en: "Following the remand in A-2372/2021, the Federal Administrative Court largely upheld ElCom's new decision of 5 December 2023. End consumers must accept installation of a smart metering system even without consent; instead of removal, a ban on using the disconnection function suffices, and recording 15-minute load profiles with five-year retention is proportionate. The court also held that procedural costs may be imposed on a municipality acting as grid operator."
