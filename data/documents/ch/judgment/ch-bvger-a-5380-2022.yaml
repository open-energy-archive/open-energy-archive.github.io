id: ch-bvger-a-5380-2022
title: "Urteil des Bundesverwaltungsgerichts A-5380/2022 vom 25. Oktober 2024 (Energie Wasser Bern gegen ElCom) – Elektrizitätstarife 2009 und 2010, Gewinnablieferung an die Stadt Bern"
title_en: "Federal Administrative Court A-5380/2022 – electricity tariffs 2009/2010: allocation of profit distributions to the City of Bern"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesverwaltungsgericht, Abteilung I"
reference: "A-5380/2022"
date: 2024-10-25
status: final
status_note: "Auf Beschwerde des UVEK aufgehoben durch Urteil des Bundesgerichts 2C_609/2024 vom 3. Dezember 2025; die Verfügung der ElCom (211-00016 vom 18. Oktober 2022) wurde bestätigt"
status_note_en: "Overturned on DETEC's appeal by Federal Supreme Court judgment 2C_609/2024 of 3 December 2025; ElCom's decision (211-00016 of 18 October 2022) was upheld."
languages: [de]
topics: [tariffs]
summary_de: "Strittig war, ob die Gewinnablieferung von Energie Wasser Bern an die Stadt Bern in den Jahren 2009 und 2010 als Abgabe auf dem Energietarif oder auf dem Netznutzungstarif zu erheben war. Das Bundesverwaltungsgericht qualifizierte sie gestützt auf das kommunale Reglement als energiebezogene Abgabe, hob die Verfügung der ElCom in diesem Punkt auf und wies die Sache zur Neuberechnung zurück. Das Bundesgericht hob dieses Urteil später auf und hielt fest, dass Abgaben auf der Energie nur zulässig sind, wenn sie in direktem Zusammenhang mit der Energie stehen."
summary_en: "At issue was whether the profit distribution of Energie Wasser Bern to the City of Bern in 2009 and 2010 was to be levied on the energy tariff or on the grid usage tariff. The Federal Administrative Court classified it, based on the municipal regulation, as an energy-related levy, set aside ElCom's decision on this point and remanded the case for recalculation. The Federal Supreme Court later overturned this judgment, holding that levies on energy are only permissible if directly linked to energy."
