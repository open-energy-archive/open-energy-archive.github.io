id: ch-bvger-a-5561-2016
title: "Urteil des Bundesverwaltungsgerichts A-5561/2016 vom 17. Mai 2017 (A. gegen Swissgrid AG und ElCom) – KEV: integrierte oder angebaute Photovoltaikanlage, Vertrauensschaden"
title_en: "Federal Administrative Court A-5561/2016 – feed-in tariff (KEV): integrated vs. attached PV system and compensation for reliance damage"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesverwaltungsgericht, Abteilung I"
reference: "A-5561/2016"
date: 2017-05-17
status: final
languages: [de]
topics: [renewables, solar, subsidies]
summary_de: "Das Bundesverwaltungsgericht bestätigte die Einstufung einer Photovoltaikanlage als angebaute und nicht als integrierte Anlage, weil eine integrierte Anlage sowohl baulich in das Gebäude eingefügt sein als auch eine Doppelfunktion erfüllen muss. Hingegen hob es die pauschale Bemessung des Vertrauensschadens durch die ElCom auf: Der Betreiber habe grundsätzlich Anspruch auf Ersatz der tatsächlich im Vertrauen getätigten Aufwendungen, weshalb die Sache zur Neubeurteilung zurückgewiesen wurde."
summary_en: "The Federal Administrative Court upheld the classification of a photovoltaic plant as attached rather than integrated, because an integrated plant must both be structurally built into the building and fulfil a dual function. It set aside, however, ElCom's flat-rate assessment of reliance damages: the operator is in principle entitled to compensation for expenses actually incurred in reliance, so the case was remanded."
