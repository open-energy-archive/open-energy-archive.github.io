id: ch-bvger-a-5705-2018
title: "Urteil des Bundesverwaltungsgerichts A-5705/2018 vom 6. Februar 2020 (Gemeinde Rüschlikon u.a. gegen ewz, Axpo Power AG und BFE) – Plangenehmigung 380/220-kV-Leitung Samstagern–Zürich, Freileitung statt Verkabelung"
title_en: "Federal Administrative Court A-5705/2018 – plan approval for the 380/220 kV line Samstagern–Zurich: overhead line instead of underground cable"
doc_type: judgment
jurisdiction: CH
issuer: "Schweizerisches Bundesverwaltungsgericht, Abteilung I"
reference: "A-5705/2018"
date: 2020-02-06
status: final
status_note: "Weitergezogen ans Bundesgericht (1C_141/2020, 1C_142/2020, 1C_145/2020, 1C_153/2020, Urteil vom 13. November 2020); nur im Kostenpunkt teilweise aufgehoben und zurückgewiesen"
status_note_en: "Appealed to the Federal Supreme Court (1C_141/2020, 1C_142/2020, 1C_145/2020, 1C_153/2020, judgment of 13 November 2020); partly set aside and remanded only on costs."
languages: [de]
topics: [grid, permitting]
summary_de: "Gegenstand war die Plangenehmigung des BFE vom 17. September 2018 für die 380/220-kV-Leitung Samstagern–Zürich mit mitgeführten SBB-Bahnstromleitungen sowie die 220-kV-Leitung Obfelden–Thalwil. Das Bundesverwaltungsgericht wies die Beschwerden ab, soweit es darauf eintrat, und bestätigte die Freileitungsvariante, weil eine Teilverkabelung mit separater SBB-Freileitung landschaftlich keine wesentlichen Vorteile gebracht hätte. Das Bundesgericht korrigierte später einzig die Kostenverlegung."
summary_en: "The case concerned the Federal Office of Energy's plan approval of 17 September 2018 for the 380/220 kV Samstagern–Zurich line with co-routed SBB traction-current lines and the 220 kV Obfelden–Thalwil line. The Federal Administrative Court dismissed the appeals as far as admissible and confirmed the overhead-line option, since partial undergrounding with a separate SBB overhead line would not have brought significant landscape benefits. The Federal Supreme Court later corrected only the allocation of costs."
