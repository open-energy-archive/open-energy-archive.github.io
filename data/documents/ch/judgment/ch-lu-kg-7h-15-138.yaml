id: ch-lu-kg-7h-15-138
title: "Urteil des Kantonsgerichts Luzern 7H 15 138 vom 4. Mai 2016 – Luft-Wasser-Wärmepumpe als Anlage: Grenzabstand und Standortwahl nach dem Vorsorgeprinzip"
title_en: "Lucerne Cantonal Court judgment 7H 15 138 of 4 May 2016 – air-water heat pump as an installation: boundary setback and siting under the precautionary principle"
doc_type: judgment
jurisdiction: CH
subdivision: CH-LU
issuer: "Kantonsgericht Luzern, 4. Abteilung"
reference: "7H 15 138"
date: 2016-05-04
status: final
status_note: "Rechtskräftig; publiziert als LGVE 2016 IV Nr. 4. Beschwerde der Nachbarn gutgeheissen, Baubewilligung aufgehoben und zur neuen Prüfung des Standorts an die Vorinstanz zurückgewiesen. Die Gemeinde ist im publizierten Text nicht genannt."
status_note_en: "Final; published as LGVE 2016 IV No. 4. The neighbours' appeal upheld, building permit annulled and remitted to the lower authority to re-examine the location. The municipality is not named in the published text."
languages: [de]
topics: [heat, permitting, energy_efficiency]
summary_de: "Nachbarn fochten die Baubewilligung für eine im Freien aufgestellte Luft-Wasser-Wärmepumpe an, die mit Lärmschutzwand rund 1,7 m von der Grundstücksgrenze entfernt stehen sollte. Das Kantonsgericht qualifizierte eine Wärmepumpe dieser Grösse als Anlage und nicht als Baute, weshalb sie die baurechtlichen Grenzabstände grundsätzlich nicht einhalten muss; die Leitungen zum Wohnhaus machen sie nicht zu dessen Bestandteil. Auch wenn die Planungswerte der Lärmschutz-Verordnung eingehalten sind, verlangt das Vorsorgeprinzip aber die Prüfung, ob ein anderer, mit verhältnismässig geringem Aufwand realisierbarer Standort die Emissionen weiter senken würde. Weil dies nicht abgeklärt war, hob das Gericht die Bewilligung auf."
summary_en: "Neighbours challenged the building permit for an outdoor air-water heat pump which, including its noise barrier, was to stand about 1.7 m from the property boundary. The Cantonal Court classified a heat pump of this size as an installation rather than a building, so it generally does not have to observe building-law boundary setbacks; the pipes to the house do not make it part of the house. Even where the planning values of the Noise Abatement Ordinance are met, the precautionary principle requires examining whether another location, achievable with relatively little effort, would further reduce emissions. As this had not been examined, the court annulled the permit."
