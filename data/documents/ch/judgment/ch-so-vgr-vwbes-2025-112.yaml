id: ch-so-vgr-vwbes-2025-112
title: 'Urteil des Verwaltungsgerichts des Kantons Solothurn VWBES.2025.112 vom 28. Mai 2026 – Solaranlage an Schallschutzwand: Auflage zur Entstörung der Leistungsoptimierer nach EN 55011'
title_en: 'Solothurn Administrative Court VWBES.2025.112 of 28 May 2026 – solar installation on a noise barrier: condition to suppress interference from power optimisers under EN 55011'
doc_type: judgment
jurisdiction: CH
subdivision: CH-SO
issuer: Verwaltungsgericht des Kantons Solothurn
reference: VWBES.2025.112 (FindInfo O_VW.2026.106)
date: 2026-05-28
status: final
status_note: 'Teilweise Gutheissung; Vorinstanz: Bau- und Justizdepartement, Verfügung vom 11.3.2025. Ob das Bundesgericht angerufen wurde, ist nicht geprüft.'
status_note_en: 'Partly upheld; lower instance: Department of Construction and Justice, decision of 11 March 2025. Whether the Federal Supreme Court was seized was not checked.'
languages:
- de
topics:
