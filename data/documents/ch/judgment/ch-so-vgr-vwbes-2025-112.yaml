summary_de: Nachbarn wehrten sich gegen eine Photovoltaikanlage an einer Schallschutzwand auf einem Gebäudedach und verlangten wegen der hochfrequenten Abstrahlung von Leistungsoptimierern ein grundsätzliches Verbot solcher Optimierer. Das Verwaltungsgericht hielt fest, dass Anhang 1 NISV keine Grenzwerte für Photovoltaikanlagen enthält und die Immissionen nach den Abklärungen des BAFU an typischen Aufenthaltsorten gering sind; auf die Beanstandung von Störungen des Amateurfunks trat es mangels eigener Betroffenheit nicht ein, und eine Pflicht zu anderen Schaltungen (z. B. String-Schaltung) wäre unverhältnismässig. Weil die Anlage nahe bei Arbeitsplätzen liegt und die Fachstelle es empfohlen hatte, ergänzte das Gericht die Baubewilligung jedoch gestützt auf das Vorsorgeprinzip (Art. 11 Abs. 2 USG, Art. 4 Abs. 2 NISV) mit der Auflage, die Leistungsoptimierer nach EN 55011, Anhang A2:2021, zu entstören. Ein bereits ausformulierter Industriestandard kann als Auflage verfügt werden, auch wenn er für Hersteller noch nicht verbindlich ist.
summary_en: Neighbours opposed a PV system on a noise barrier on a building roof and, because of high-frequency emissions from power optimisers, demanded a general ban on such optimisers. The Administrative Court noted that Annex 1 of the Ordinance on Non-Ionising Radiation contains no limits for PV systems and that, according to the Federal Office for the Environment, immissions at typical places of stay are low; it declined to consider complaints about interference with amateur radio for lack of personal concern, and requiring other wiring (e.g. string configuration) would be disproportionate. Because the system is close to workplaces and the cantonal environment office had recommended it, the court nevertheless added a condition based on the precautionary principle (Art. 11(2) Environmental Protection Act, Art. 4(2) NISV) requiring interference suppression of the optimisers under EN 55011, Annex A2:2021. An already formulated industry standard may be imposed as a condition even if it is not yet binding on manufacturers.
