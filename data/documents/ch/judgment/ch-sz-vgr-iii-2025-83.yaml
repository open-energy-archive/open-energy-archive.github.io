id: ch-sz-vgr-iii-2025-83
title: 'Entscheid des Verwaltungsgerichts des Kantons Schwyz III 2025 83, 86 und 87 vom 20. Februar 2026 – PV-Fassadenanlage im ISOS-Gebiet: Bundesaufgabe wegen gewässerschutzrechtlicher Bewilligung für Erdwärmesonden, fehlende Beurteilung nach Art. 7 NHG'
title_en: 'Schwyz Administrative Court III 2025 83, 86 and 87 of 20 February 2026 – PV façade system in an ISOS area: federal task because of a water protection permit for geothermal probes, missing assessment under Art. 7 NHG'
doc_type: judgment
jurisdiction: CH
subdivision: CH-SZ
issuer: Verwaltungsgericht des Kantons Schwyz, Kammer III
reference: III 2025 83, III 2025 86, III 2025 87
date: 2026-02-20
status: final
status_note: 'Versand am 10.3.2026. Rückweisung an die Baukommission Schwyz und das Amt für Raumentwicklung zur erneuten Prüfung; Beschwerden der Gemeinde und der Bauherrschaft gegen das Verbot der PV-Fassadenanlage als gegenstandslos abgeschrieben. Vorinstanz: RRB Nr. 271/2025 vom 8.4.2025. Ob das Bundesgericht angerufen wurde, ist nicht geprüft.'
status_note_en: 'Sent on 10 March 2026. Remitted to the Schwyz building commission and the Office for Spatial Development for fresh examination; the appeals of the municipality and the builders against the ban on the PV façade system were struck off as moot. Lower instance: Government Council decision No. 271/2025 of 8 April 2025. Whether the Federal Supreme Court was seized was not checked.'
languages:
- de
topics:
- solar
