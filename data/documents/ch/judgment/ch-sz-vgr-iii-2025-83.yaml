- heat
summary_de: 'Der Regierungsrat hatte für ein Mehrfamilienhaus in der Kernzone von Schwyz (ISOS-Gebiet mit Erhaltungsziel B) die Baubewilligung bestätigt, aber eine PV-Anlage an den Balkonbrüstungen und Fassaden verboten, weil sie die homogene Holzfassadenlandschaft beeinträchtige; die Solarinteressen gingen in einem Gebiet nach Art. 18a Abs. 3 RPG nicht vor. Das Verwaltungsgericht hob den Entscheid aus einem anderen Grund auf: Weil für die Erdwärmesonden im Gewässerschutzbereich Au eine Bewilligung nach Art. 19 Abs. 2 GSchG nötig ist, liegt nach BGer 1C_730/2024 eine Bundesaufgabe vor. Die kantonale Denkmalpflege hätte deshalb beurteilen müssen, ob ein Gutachten der ENHK/EKD nötig ist (Art. 7 NHG), und die Baubehörde muss eine Interessenabwägung nach Art. 3 NHG vornehmen, einschliesslich der Frage, ob die PV-Fassadenanlage mit dem Ortsbild vereinbar ist. Der Entscheid zeigt, dass eine gewöhnliche Erdwärmesonde die Schutzanforderungen für ein ganzes Bauprojekt im ISOS-Gebiet verschärfen kann.'
summary_en: 'The Government Council had upheld the permit for an apartment building in the core zone of Schwyz (ISOS area with conservation objective B) but banned a PV system on the balcony parapets and façades because it would impair the homogeneous wooden façade landscape; solar interests did not prevail in an area under Art. 18a(3) of the Spatial Planning Act. The Administrative Court set the decision aside on other grounds: because the geothermal probes in water protection area Au require a permit under Art. 19(2) of the Water Protection Act, there is a federal task under Federal Supreme Court 1C_730/2024. The cantonal monument authority should therefore have assessed whether an opinion of the federal commissions is needed (Art. 7 NHG), and the building authority must weigh interests under Art. 3 NHG, including whether the PV façade system is compatible with the townscape. The ruling shows that an ordinary geothermal probe can tighten protection requirements for an entire building project in an ISOS area.'
