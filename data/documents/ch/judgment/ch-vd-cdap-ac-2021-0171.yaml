id: ch-vd-cdap-ac-2021-0171
title: "Arrêt de la Cour de droit administratif et public du Tribunal cantonal vaudois AC.2021.0171 du 11 octobre 2022 (Bussigny) – Pompe à chaleur air/eau extérieure, valeurs de planification et principe de prévention"
title_en: "Vaud Cantonal Court (Administrative and Public Law Division) judgment AC.2021.0171 of 11 October 2022 (Bussigny) – outdoor air/water heat pump, planning values and precautionary principle"
doc_type: judgment
jurisdiction: CH
subdivision: CH-VD
issuer: "Tribunal cantonal du canton de Vaud, Cour de droit administratif et public"
reference: "AC.2021.0171"
date: 2022-10-11
status: final
status_note: "Recours des voisins rejeté, décision municipale confirmée. Un recours au Tribunal fédéral n'est pas connu."
status_note_en: "The neighbours' appeal dismissed, municipal decision confirmed. No appeal to the Federal Supreme Court is known."
languages: [fr]
topics: [heat, permitting]
summary_de: "Nachbarn fochten die nachträgliche Baubewilligung für eine bereits installierte Luft/Wasser-Wärmepumpe im Freien an, die ein Schwimmbad beheizt. Die CDAP wies die Beschwerde ab: Die öffentliche Auflage war genügend, da die Anlage bereits bestand und ihre Auswirkungen beurteilt werden konnten. Der Planungswert der Empfindlichkeitsstufe II (55 dB(A) tagsüber) ist eingehalten, und das umweltrechtliche Vorsorgeprinzip ist gewahrt, weil die Anlage weit vom Grundstück der Beschwerdeführer entfernt steht, nur zwischen 7 und 19 Uhr betrieben wird und nach dem Augenschein eine schallabsorbierende Einhausung erhielt."
summary_en: "Neighbours challenged the retrospective building permit for an already installed outdoor air/water heat pump that heats a swimming pool. The CDAP dismissed the appeal: the public inquiry was sufficient, as the installation already existed and its effects could be assessed. The planning value for sensitivity level II (55 dB(A) by day) is met, and the environmental precautionary principle is respected because the unit is far from the appellants' property, operates only between 7 am and 7 pm and received a sound-absorbing enclosure after the site inspection."
