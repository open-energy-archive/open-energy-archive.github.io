languages: [de]
topics: [solar, permitting]
summary_de: "Die Photovoltaikanlagen auf zwei Mehrfamilienhäusern blendeten einen Nachbarbalkon vom 13. April bis 28. August täglich bis zu 50 Minuten mit bis zu 30 % der Intensität direkten Sonnenlichts, deutlich mehr als im Baubewilligungsverfahren prognostiziert. Das Verwaltungsgericht bestätigte die Anordnung, Massnahmen zur Reduktion auf höchstens 20 Minuten pro Tag vorzuschlagen. Reflexionen von Sonnenlicht an einer Anlage sind Einwirkungen im Sinne des Umweltschutzgesetzes; die rechtskräftige Baubewilligung steht zusätzlichen Massnahmen nicht entgegen, wenn sich die Prognosen als falsch erweisen. Ein Bagatellfall lag nicht vor, und die Förderung erneuerbarer Energien schliesst die Anwendung des Vorsorgeprinzips nicht aus. Massnahmen sind an der Quelle zu treffen, nicht beim betroffenen Nachbarn."
summary_en: "The PV installations on two apartment buildings dazzled a neighbouring balcony from 13 April to 28 August for up to 50 minutes a day at up to 30% of the intensity of direct sunlight, much more than forecast in the permit procedure. The Administrative Court upheld the order to propose measures reducing this to at most 20 minutes a day. Reflections of sunlight from an installation are effects within the meaning of the Environmental Protection Act; the final building permit does not prevent additional measures if the forecasts prove wrong. This was not a trivial case, and promoting renewable energy does not exclude applying the precautionary principle. Measures must be taken at the source, not by the affected neighbour."
