title: "Urteil des Verwaltungsgerichts des Kantons Zürich VB.2007.00307 vom 7. November 2007 (Hedingen) – Blendung durch eine Photovoltaikanlage, vorsorgliche Emissionsbegrenzung"
title_en: "Zurich Administrative Court judgment VB.2007.00307 of 7 November 2007 (Hedingen) – glare from a PV installation, precautionary emission limitation"
doc_type: judgment
jurisdiction: CH
subdivision: CH-ZH
issuer: "Verwaltungsgericht des Kantons Zürich, 1. Abteilung"
reference: "VB.2007.00307"
date: 2007-11-07
status: final
status_note: "Rechtskräftig; Beschwerde abgewiesen. Der Link führt in die Entscheiddatenbank des Verwaltungsgerichts; er enthält einen Sitzungsschlüssel und kann ablaufen. In diesem Fall ist der Entscheid über die Suche nach der Geschäftsnummer auffindbar."
