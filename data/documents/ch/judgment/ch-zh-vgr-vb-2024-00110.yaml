title: "Urteil des Verwaltungsgerichts des Kantons Zürich VB.2024.00110 vom 16. Januar 2025 (Stadt Winterthur) – Solaranlage auf ISOS-Objekt, Begutachtung durch ENHK oder EKD"
title_en: "Zurich Administrative Court judgment VB.2024.00110 of 16 January 2025 (City of Winterthur) – solar installation on an ISOS-listed building, expert report by federal commissions"
doc_type: judgment
jurisdiction: CH
subdivision: CH-ZH
issuer: "Verwaltungsgericht des Kantons Zürich, 1. Abteilung"
reference: "VB.2024.00110"
date: 2025-01-16
