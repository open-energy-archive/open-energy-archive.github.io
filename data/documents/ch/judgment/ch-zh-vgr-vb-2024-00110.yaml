status_note_en: "Confirmed by the Federal Supreme Court in judgment 1C_153/2025 of 5 January 2026. Content information from the Federal Supreme Court judgment; the link follows the entscheidsuche.ch address pattern and was not opened directly."
languages: [de]
topics: [solar, permitting]
summary_de: "Der Bauausschuss der Stadt Winterthur hatte eine Photovoltaikanlage auf einem Gebäude in der Kernzone bewilligt, das in einem ISOS-Gebiet mit Erhaltungsziel A liegt. Das Baurekursgericht wies die Sache auf Rekurs des Zürcher Heimatschutzes zurück, weil zuerst die kantonale Fachstelle zur Notwendigkeit eines Gutachtens der ENHK oder EKD Stellung nehmen müsse. Das Verwaltungsgericht bestätigte dies: Art. 18a Abs. 3 RPG sei eine direkt anwendbare, abschliessende Bundesregelung, weshalb die Bewilligung einer Solaranlage auf einem solchen Kulturdenkmal auch innerhalb der Bauzone eine Bundesaufgabe sei."
summary_en: "Winterthur's building committee had approved a PV system on a building in the core zone located in an ISOS area with preservation objective A. On appeal by the Zurich heritage association, the building appeals court remitted the case because the cantonal specialist office first had to give its opinion on whether an expert report by the federal commissions was needed. The Administrative Court confirmed this: Art. 18a(3) RPG is a directly applicable, exhaustive federal rule, so approving a solar installation on such a monument is a federal task even within the building zone."
