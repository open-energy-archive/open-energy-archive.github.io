title: "Urteil des Verwaltungsgerichts des Kantons Zürich VB.2025.00423 vom 25. September 2025 (Männedorf) – Beleuchtender Bericht zur Abstimmung über Klimastrategie 2040 und Rahmenkredit"
title_en: "Zurich Administrative Court judgment VB.2025.00423 of 25 September 2025 (Männedorf) – voting information on the 2040 climate strategy and framework credit"
doc_type: judgment
jurisdiction: CH
subdivision: CH-ZH
