summary_de: "Die Stimmberechtigten von Männedorf nahmen am 18. Mai 2025 die Klimastrategie 2040 (Netto-Null für das Gemeindegebiet bis 2040, für Verwaltung und Schulen bis 2035, 46 Massnahmen) und einen Rahmenkredit von 1,2 Millionen Franken für die erste Umsetzungsphase 2025–2028 mit 51,6 % Ja an. Ein Stimmberechtigter rügte, der Beleuchtende Bericht sei irreführend, weil er unter anderem die Gesamtkosten der Strategie nicht nenne. Das Verwaltungsgericht wies die Beschwerde ab: Der Abstimmungsgegenstand und der Zweck des Rahmenkredits waren klar umschrieben, die Kompetenzdelegation an den Gemeinderat war erläutert, und eine Etappierung der Kosten in Phasen ist zulässig. Ob die Klimaziele mit übergeordnetem Recht vereinbar sind, kann mit einer Stimmrechtsbeschwerde nicht gerügt werden."
summary_en: "On 18 May 2025 the voters of Männedorf approved, with 51.6% yes, the 2040 climate strategy (net zero for the municipal territory by 2040 and for the administration and schools by 2035, 46 measures) and a framework credit of CHF 1.2 million for the first implementation phase 2025–2028. A voter argued that the official voting information was misleading, among other things because it did not state the total cost of the strategy. The Administrative Court dismissed the appeal: the subject of the vote and the purpose of the framework credit were clearly defined, the delegation of powers to the municipal council was explained, and phasing the costs is permissible. Whether the climate targets are compatible with higher-ranking law cannot be challenged in an appeal on voting rights."
