reference: "VB.2025.00423"
date: 2025-09-25
status: final
status_note: "Rechtskräftig; Stimmrechtsbeschwerde abgewiesen. Der Link führt in die Entscheiddatenbank des Verwaltungsgerichts; er enthält einen Sitzungsschlüssel und kann ablaufen. In diesem Fall ist der Entscheid über die Suche nach der Geschäftsnummer auffindbar."
