summary_de: 'Das BATE stärkt die Aufsicht über die Strom- und Gasgrosshandelsmärkte und deren Transparenz. Es übernimmt für den Schweizer Markt wesentliche Teile der EU-Verordnung REMIT: Marktteilnehmer und Vermittler müssen sich bei der ElCom registrieren, ihr Transaktionen und Handelsaufträge mit Energiegrosshandelsprodukten melden und Insiderinformationen veröffentlichen; Insiderhandel und Marktmanipulation werden unabhängig vom Status der Produkte als Effekten verboten. Die ElCom erhält Aufsichts- und Untersuchungsbefugnisse und kann Verwaltungssanktionen verhängen.'
summary_en: 'The BATE strengthens supervision and transparency of the electricity and gas wholesale markets. It transposes key parts of the EU REMIT regulation for the Swiss market: market participants and intermediaries must register with ElCom, report transactions and orders in wholesale energy products and publish inside information; insider dealing and market manipulation are prohibited regardless of whether the products are securities. ElCom receives supervisory and investigative powers and can impose administrative sanctions.'
