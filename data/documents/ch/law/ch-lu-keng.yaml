id: ch-lu-keng
title: "Kantonales Energiegesetz (KEnG)"
title_en: "Cantonal Energy Act of the Canton of Lucerne"
short_title: KEnG LU
doc_type: law
jurisdiction: CH
subdivision: CH-LU
issuer: "Kantonsrat des Kantons Luzern"
reference: "SRL 773"
date: 2017-12-04
status: in_force
status_note: "Die SRL-Seite rendert nicht; Inhalt über LexFind geprüft (dort nur Fassung in Kraft ab 1. Januar 2019). Gemäss uwe.lu.ch Teilrevision vom 17. Juni 2024, in Kraft seit 1. März 2025; aktueller Wortlaut nicht im Volltext verifiziert. Umsetzung der MuKEn 2014: Anforderungen beim Ersatz des Wärmeerzeugers in Wohnbauten (höchstens 90 % nichterneuerbare Energie), Eigenstromerzeugung bei Neubauten bzw. Ersatzabgabe, Grossverbraucher (über 5 GWh Wärme bzw. 0,5 GWh Strom), Förderung."
status_note_en: "The SRL page does not render; content checked via LexFind (which only shows the version in force from 1 January 2019). According to uwe.lu.ch, partial revision of 17 June 2024 in force since 1 March 2025; current wording not verified in full text. Implements MuKEn 2014: requirements when replacing heat generators in residential buildings (max. 90% non-renewable energy), on-site electricity generation for new buildings or a replacement levy, large consumers (over 5 GWh heat or 0.5 GWh electricity), subsidies."
languages: [de]
topics: [energy_efficiency, heat, renewables, solar, subsidies]
summary_de: "Das Luzerner Energiegesetz bezweckt eine sichere, ausreichende, wirtschaftliche und umweltverträgliche Energieversorgung sowie eine effiziente und nachhaltige Energienutzung. Es setzt die Mustervorschriften der Kantone im Energiebereich weitgehend um, mit Anforderungen an Neubauten und an den Heizungsersatz, Eigenstromerzeugung, Pflichten für Grossverbraucher und Förderbeiträgen."
summary_en: "The Lucerne Energy Act aims at a secure, sufficient, economical and environmentally compatible energy supply and efficient, sustainable energy use. It largely implements the cantonal model energy regulations, with requirements for new buildings and heating replacement, on-site electricity generation, obligations for large consumers and subsidies."
