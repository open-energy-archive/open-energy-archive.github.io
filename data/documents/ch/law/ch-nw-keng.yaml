id: ch-nw-keng
title: "Gesetz über die sparsame Energienutzung und die Förderung erneuerbarer Energien (Kantonales Energiegesetz, kEnG)"
title_en: "Act on Economical Energy Use and the Promotion of Renewable Energy of the Canton of Nidwalden (Cantonal Energy Act)"
short_title: kEnG NW
doc_type: law
jurisdiction: CH
subdivision: CH-NW
issuer: "Landrat des Kantons Nidwalden"
reference: "NG 641.1"
date: 2009-12-16
status: in_force
status_note: "Geprüft über die Daten der amtlichen Gesetzessammlung (gesetze.nw.ch, LexWork-API): erlassen am 16. Dezember 2009, in Kraft seit 1. Mai 2010, aktuelle Fassung in Kraft seit 1. Januar 2026 (Beschluss vom 23. Oktober 2024). Inhalt u. a.: Verbot neuer ortsfester elektrischer Widerstandsheizungen, beim Wärmeerzeugerersatz Schwelle von 90 % (nichtfossil gemäss Zusammenfassung; Formulierung nicht im Volltext geprüft), Fast-Nullenergie-Neubauten, Eigenstromerzeugung bei Neubauten (mindestens 10 W/m²), verbrauchsabhängige Heizkostenabrechnung, Förderprogramm. Kein LexFind-Eintrag geprüft."
status_note_en: "Checked via the data of the official law collection (gesetze.nw.ch, LexWork API): enacted 16 December 2009, in force since 1 May 2010, current version in force since 1 January 2026 (decision of 23 October 2024). Content includes: ban on new fixed electric resistance heating, a 90% threshold when replacing heat generators (non-fossil according to the summary; wording not checked in full text), nearly zero-energy new buildings, on-site electricity generation for new buildings (at least 10 W/m²), consumption-based heating cost billing, subsidy programme. No LexFind entry checked."
languages: [de]
topics: [energy_efficiency, heat, renewables, solar, subsidies]
summary_de: "Das Nidwaldner Energiegesetz schafft günstige Rahmenbedingungen für eine sparsame und effiziente Energienutzung und den Einsatz erneuerbarer Energien und vollzieht das Energierecht des Bundes. Es regelt die Zuständigkeiten, die energetischen Anforderungen an Gebäude wie Wärmeschutz, Heizungsersatz, Eigenstromerzeugung und Verbrauchsabrechnung sowie Fördermassnahmen und ein Förderprogramm."
summary_en: "The Nidwalden Energy Act creates favourable conditions for economical and efficient energy use and the use of renewable energy and implements federal energy law. It governs responsibilities, energy requirements for buildings such as thermal protection, heating replacement, on-site electricity generation and consumption-based billing, as well as promotion measures and a subsidy programme."
