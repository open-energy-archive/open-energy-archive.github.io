id: ch-sr-730-0-eng
title: "Energiegesetz (EnG)"
title_en: "Energy Act"
short_title: EnG
doc_type: law
jurisdiction: CH
issuer: "Bundesversammlung der Schweizerischen Eidgenossenschaft"
reference: "SR 730.0"
date: 2016-09-30
status: in_force
status_note: "Konsolidierte Fassung vom 1. April 2026 geprüft (geltende Fassung). Durch den Mantelerlass (AS 2024 679) geändert, in Kraft seit 1.1.2025. Seit 1. April 2026 zudem durch den Beschleunigungserlass (AS 2026 99) geändert: Für Solar-, Wasserkraft- und Windenergieanlagen von nationalem Interesse gelten gestraffte Planungs- und Bewilligungsverfahren, und auf kantonaler Ebene ist nur noch eine Beschwerde an das obere kantonale Gericht möglich. Die bisher nicht in Kraft gesetzten Bestimmungen zur Vergütung zum Zeitpunkt der Einspeisung und zu den Minimalvergütungen für Anlagen unter 150 kW (Art. 15 Abs. 1bis und 75e) treten gemäss Mitteilung über die abschliessende Inkraftsetzung (AS 2026 297) am 1.1.2027 in Kraft. Die künftige Fassung vom 1.1.2027 ist auf Fedlex bereits veröffentlicht; sie berücksichtigt zudem das Bundesgesetz über das Entlastungspaket 2027 (AS 2026 393, in Kraft ab 1.1.2027; dessen Änderungen am EnG nicht im Einzelnen geprüft). Fedlex führt ausserdem bereits eine Fassung per 1.1.2028 (Inhalt nicht geprüft). Ein Verordnungspaket (EnFV, EnV, VPeA, CO2-Verordnung, StromVV u. a.) war ab 15.4.2026 in der Vernehmlassung. Art. 2 enthält die Ausbau-Richtwerte für erneuerbare Energien (ohne Wasserkraft: 35 000 GWh bis 2035, 45 000 GWh bis 2050)."
status_note_en: "Consolidated version of 1 April 2026 checked (version in force). Amended by the Mantelerlass (AS 2024 679), in force since 1 January 2025. Also amended since 1 April 2026 by the acceleration act (AS 2026 99): streamlined planning and permitting procedures apply to solar, hydro and wind plants of national interest, and at cantonal level only one appeal to the higher cantonal court remains possible. The provisions not yet in force on remuneration at the time of feed-in and on minimum remuneration for plants below 150 kW (Art. 15(1bis) and 75e) enter into force on 1 January 2027 according to the notice on final entry into force (AS 2026 297). The future version of 1 January 2027 is already published on Fedlex; it also reflects the Federal Act on the 2027 Relief Package for the federal budget (AS 2026 393, in force from 1 January 2027; its amendments to the EnG not checked in detail). Fedlex also already lists a version as of 1 January 2028 (content not checked). An ordinance package (EnFV, EnV, VPeA, CO2 Ordinance, StromVV and others) was in consultation from 15 April 2026. Art. 2 sets the renewable expansion targets (excluding hydropower: 35,000 GWh by 2035, 45,000 GWh by 2050)."
languages: [de, fr, it]
topics: [renewables, energy_efficiency, subsidies, self_consumption, supply_security]
summary_de: "Das Energiegesetz soll eine ausreichende, sichere, wirtschaftliche und umweltverträgliche Energieversorgung sichern und den Umstieg auf erneuerbare Energien voranbringen. Es enthält Richtwerte für den Ausbau, Regeln zu Eigenverbrauch und Förderung sowie Vorgaben zur Energieeffizienz."
summary_en: "The Energy Act aims to secure a sufficient, reliable, economic and environmentally sound energy supply and to advance the transition to renewable energy. It contains expansion targets, rules on self-consumption and support schemes, and energy-efficiency requirements."
