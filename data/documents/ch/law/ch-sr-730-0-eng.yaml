id: ch-sr-730-0-eng
title: "Energiegesetz (EnG)"
title_en: "Energy Act"
short_title: EnG
doc_type: law
jurisdiction: CH
issuer: "Bundesversammlung der Schweizerischen Eidgenossenschaft"
reference: "SR 730.0"
date: 2016-09-30
status: in_force
status_note: "Konsolidierte Fassung vom 1. Januar 2026 geprüft. Durch den Mantelerlass (AS 2024 679) geändert, in Kraft seit 1.1.2025. Seit 1. April 2026 zudem durch den Beschleunigungserlass (AS 2026 99) geändert: Für Solar-, Wasserkraft- und Windenergieanlagen von nationalem Interesse gelten gestraffte Planungs- und Bewilligungsverfahren, und auf kantonaler Ebene ist nur noch eine Beschwerde an das obere kantonale Gericht möglich. Nicht in Kraft gesetzt sind vorerst die Bestimmungen zur Vergütung zum Zeitpunkt der Einspeisung und zu den Minimalvergütungen für Anlagen unter 150 kW (Art. 15 Abs. 1bis und 75e); die nötigen Ausführungsbestimmungen in der Energieverordnung werden vorbereitet. Ein Verordnungspaket (EnFV, EnV, VPeA, CO2-Verordnung, StromVV u. a.) war ab 15.4.2026 in der Vernehmlassung. Wortlaut der Fassung vom 1.4.2026 nicht im Einzelnen geprüft. Art. 2 enthält die Ausbau-Richtwerte für erneuerbare Energien (ohne Wasserkraft: 35 000 GWh bis 2035, 45 000 GWh bis 2050)."
status_note_en: "Consolidated version of 1 January 2026 checked. Amended by the Mantelerlass (AS 2024 679), in force since 1 January 2025. Also amended since 1 April 2026 by the acceleration act (AS 2026 99): streamlined planning and permitting procedures apply to solar, hydro and wind plants of national interest, and at cantonal level only one appeal to the higher cantonal court remains possible. Not yet in force are the provisions on remuneration at the time of feed-in and on minimum remuneration for plants below 150 kW (Art. 15(1bis) and 75e); the implementing provisions in the Energy Ordinance are being prepared. An ordinance package (EnFV, EnV, VPeA, CO2 Ordinance, StromVV and others) was in consultation from 15 April 2026. Wording of the version of 1 April 2026 not checked in detail. Art. 2 sets the renewable expansion targets (excluding hydropower: 35,000 GWh by 2035, 45,000 GWh by 2050)."
languages: [de, fr, it]
topics: [renewables, energy_efficiency, subsidies, self_consumption, supply_security]
summary_de: "Das Energiegesetz soll eine ausreichende, sichere, wirtschaftliche und umweltverträgliche Energieversorgung sichern und den Umstieg auf erneuerbare Energien voranbringen. Es enthält Richtwerte für den Ausbau, Regeln zu Eigenverbrauch und Förderung sowie Vorgaben zur Energieeffizienz."
summary_en: "The Energy Act aims to secure a sufficient, reliable, economic and environmentally sound energy supply and to advance the transition to renewable energy. It contains expansion targets, rules on self-consumption and support schemes, and energy-efficiency requirements."
