id: ch-tg-eng
title: "Gesetz über die Energienutzung (ENG)"
title_en: "Energy Use Act of the Canton of Thurgau"
short_title: ENG TG
doc_type: law
jurisdiction: CH
subdivision: CH-TG
issuer: "Grosser Rat des Kantons Thurgau"
reference: "RB 731.1"
date: 2004-03-10
status: in_force
status_note: "Geprüft über die Daten der amtlichen Gesetzessammlung (rechtsbuch.tg.ch, LexWork-API): erlassen am 10. März 2004, in Kraft seit 1. April 2005, aktuelle Fassung in Kraft seit 19. Juni 2023 (Beschluss vom 11. Januar 2023). Inhalt u. a.: Vorbildfunktion der öffentlichen Hand (Minergie oder gleichwertig), Energiefonds mit mindestens 12 Mio. Fr. pro Jahr, Eigenstromerzeugung bei Neubauten, gestaffelter erneuerbarer Anteil beim Wärmeerzeugerersatz, Verbot ortsfester Elektroheizungen, Fernwärmeanschluss in bezeichneten Gebieten. Hängig: Teilrevision (Solarstrom, Effizienz, Windenergie; Vernehmlassung bis 29. November 2024, Botschaft an den Grossen Rat), Stand der parlamentarischen Beratung nicht verifiziert. Kein LexFind-Eintrag geprüft."
status_note_en: "Checked via the data of the official law collection (rechtsbuch.tg.ch, LexWork API): enacted 10 March 2004, in force since 1 April 2005, current version in force since 19 June 2023 (decision of 11 January 2023). Content includes: exemplary role of the public sector (Minergie or equivalent), energy fund of at least CHF 12 million per year, on-site electricity generation for new buildings, staged renewable share when replacing heat generators, ban on fixed electric heating, district-heating connection in designated areas. Pending: partial revision (solar power, efficiency, wind energy; consultation until 29 November 2024, message to the Grand Council); status of parliamentary deliberation not verified. No LexFind entry checked."
languages: [de]
topics: [energy_efficiency, heat, renewables, solar, wind, subsidies]
summary_de: "Das Thurgauer Gesetz über die Energienutzung fördert die effiziente Energienutzung und erneuerbare Energien, will die Abhängigkeit von fossilen Energieträgern verringern und vollzieht das Energierecht des Bundes. Es enthält Anforderungen an Neubauten und den Heizungsersatz, eine Eigenstromerzeugungspflicht, Einschränkungen für Elektroheizungen sowie einen Energiefonds für Förderbeiträge."
summary_en: "The Thurgau Energy Use Act promotes efficient energy use and renewable energy, aims to reduce dependence on fossil fuels and implements federal energy law. It contains requirements for new buildings and heating replacement, an on-site electricity generation duty, restrictions on electric heating and an energy fund for subsidies."
