id: ch-ur-eng
title: "Energiegesetz des Kantons Uri (EnG) vom 18. April 1999"
title_en: "Energy Act of the Canton of Uri"
short_title: EnG UR
doc_type: law
jurisdiction: CH
subdivision: CH-UR
issuer: "Volk des Kantons Uri"
reference: "RB 40.7211"
date: 1999-04-18
status: superseded
status_note: "Beschluss vom 18. April 1999, in Kraft seit 1. Januar 2000. Ersetzt durch das totalrevidierte Energiegesetz vom 22. Oktober 2023 (mit Teilrevision vom 8. März 2026), das gemäss regionalen Quellen seit 1. Oktober 2026 gilt; siehe eigenen Eintrag ch-ur-eng-2023. Bis zur Nachführung zeigte die amtliche Gesetzessammlung unter RB 40.7211 noch diese Fassung."
status_note_en: "Decision of 18 April 1999, in force since 1 January 2000. Replaced by the fully revised Energy Act of 22 October 2023 (with the partial revision of 8 March 2026), which according to regional sources has applied since 1 October 2026; see separate entry ch-ur-eng-2023. Until updated, the official collection still showed this version under RB 40.7211."
languages: [de]
topics: [energy_efficiency, heat, renewables, solar, subsidies, tariffs]
summary_de: "Das Urner Energiegesetz legt die Grundlagen der kantonalen Energiepolitik fest und strebt eine ausreichende, diversifizierte, sichere, wirtschaftliche und umweltverträgliche Energieversorgung an. Es regelt energetische Anforderungen an Gebäude, Bewilligungspflichten für Elektroheizungen, Grundsätze der Energieversorgung wie einheitliche Tarife und die Abnahme von Überschussenergie unabhängiger Produzenten sowie Beratung und Förderung."
summary_en: "The Uri Energy Act sets the basis for cantonal energy policy and aims at sufficient, diversified, secure, economical and environmentally compatible energy supply. It governs energy requirements for buildings, permit requirements for electric heating, principles of energy supply such as uniform tariffs and the purchase of surplus energy from independent producers, and advice and subsidies."
