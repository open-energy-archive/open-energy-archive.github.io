summary_de: Die Vorlage ändert mehrere Verordnungen im Energiebereich. Gemäss den Stellungnahmen aus der Vernehmlassung gehören dazu unter anderem eine höhere Einmalvergütung für kleine Photovoltaikanlagen (EnFV), die Zulassung von LiDAR-Messungen für Windmessungen, Bestimmungen zu Sicherheitsleistungen bei der Wasserkraft, zur Offenlegung der Netztopologie durch die Verteilnetzbetreiber (Art. 19g StromVV), zum Netznutzungsabschlag für lokale Elektrizitätsgemeinschaften (Art. 19h StromVV) und zu einem Mindestanteil erneuerbarer Energie in der Grundversorgung (Art. 4a StromVV) sowie eine Anpassung der Prämien der Kernenergiehaftpflicht (KHV). Inhalt nach der Vernehmlassungsvorlage, nicht im Einzelnen geprüft.
summary_en: The draft amends several energy ordinances. According to the consultation responses, it includes a higher one-off payment for small PV systems (EnFV), admission of LiDAR measurements for wind measurement, provisions on security deposits for hydropower, disclosure of network topology by distribution system operators (Art. 19g StromVV), the grid tariff reduction for local electricity communities (Art. 19h StromVV) and a minimum renewable share in basic supply (Art. 4a StromVV), and an adjustment of nuclear liability premiums (KHV). Content according to the consultation draft, not checked in detail.
