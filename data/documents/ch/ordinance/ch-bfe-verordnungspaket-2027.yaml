id: ch-bfe-verordnungspaket-2027
title: Verordnungsänderungen im Bereich des Bundesamtes für Energie mit Inkrafttreten am 1. Januar 2027 (EnFV, EnV, VPeA, CO2-Verordnung, StromVV, KHV) – Vernehmlassungsvorlage
title_en: Amendments to ordinances in the area of the Swiss Federal Office of Energy with entry into force on 1 January 2027 – consultation draft
short_title: Verordnungspaket 1.1.2027
doc_type: ordinance
jurisdiction: CH
issuer: Eidgenössisches Departement für Umwelt, Verkehr, Energie und Kommunikation (UVEK)
reference: Vernehmlassung 2026/11
date: 2026-04-15
status: draft
status_note: Vernehmlassung vom 15.4. bis 15.7.2026. Der Beschluss des Bundesrats stand bei der Erfassung (23.10.2026) noch aus; vorgesehen ist das Inkrafttreten am 1.1.2027. Nach dem Beschluss sind die definitiven Texte zu erfassen und die Einträge zu EnFV, EnV, StromVV und VPeA nachzuführen.
status_note_en: Consultation from 15 April to 15 July 2026. The Federal Council’s decision was still pending when the entry was created (23 October 2026); entry into force is planned for 1 January 2027. After the decision, the final texts should be added and the entries on the EnFV, EnV, StromVV and VPeA updated.
