summary_de: "Die Kernenergieverordnung führt das Kernenergiegesetz aus. Sie regelt unter anderem die Gesuchsunterlagen und Verfahren für Bewilligungen von Kernanlagen, die Grundsätze für Auslegung und Betrieb, die Meldepflichten, die Stilllegung, die Entsorgung radioaktiver Abfälle und das Sachplanverfahren für geologische Tiefenlager."
summary_en: "The Nuclear Energy Ordinance implements the Nuclear Energy Act. Among other things it governs application documents and procedures for licensing nuclear installations, principles for design and operation, reporting duties, decommissioning, disposal of radioactive waste and the sectoral planning procedure for deep geological repositories."
