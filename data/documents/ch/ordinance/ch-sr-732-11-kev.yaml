reference: "SR 732.11"
date: 2004-12-10
status: in_force
status_note: "In Kraft seit 1.2.2005 zusammen mit dem Kernenergiegesetz. Aktuelle Fassung nicht im Detail geprüft."
status_note_en: "In force since 1 February 2005 together with the Nuclear Energy Act. Current version not checked in detail."
languages: [de, fr, it]
