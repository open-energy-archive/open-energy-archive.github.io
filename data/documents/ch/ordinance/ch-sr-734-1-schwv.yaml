id: ch-sr-734-1-schwv
title: "Verordnung über elektrische Schwachstromanlagen (Schwachstromverordnung, SchwV)"
title_en: "Ordinance on Low-Current Electrical Installations"
short_title: SchwV
doc_type: ordinance
jurisdiction: CH
issuer: "Schweizerischer Bundesrat"
reference: "SR 734.1"
date: 1994-03-30
status: in_force
status_note: "In Kraft seit 1.5.1994. Aktuelle Fassung nicht im Detail geprüft."
status_note_en: "In force since 1 May 1994. Current version not checked in detail."
languages: [de, fr, it]
topics: [grid]
summary_de: "Die Schwachstromverordnung legt Sicherheitsanforderungen an Erstellung, Betrieb und Instandhaltung von Schwachstromanlagen fest, etwa Telekommunikations- und Steuerleitungen, und regelt insbesondere den Schutz vor Gefahren durch die Nähe zu Starkstromanlagen. Sie gehört zusammen mit Starkstrom- und Leitungsverordnung zu den technischen Ausführungsbestimmungen des Elektrizitätsgesetzes."
summary_en: "The ordinance sets safety requirements for the construction, operation and maintenance of low-current installations, such as telecommunication and control lines, and in particular protection against hazards from proximity to high-current installations. Together with the high-current and electrical lines ordinances it forms part of the technical implementing provisions of the Electricity Act."
