id: ch-sr-734-25-vpea
title: "Verordnung über das Plangenehmigungsverfahren für elektrische Anlagen (VPeA)"
title_en: "Ordinance on the Planning Approval Procedure for Electrical Installations"
short_title: VPeA
doc_type: ordinance
jurisdiction: CH
issuer: "Schweizerischer Bundesrat"
reference: "SR 734.25"
date: 2000-02-02
status: in_force
status_note: "Mehrfach geändert, u. a. 2019 (Strategie Stromnetze: Sachplanverfahren), 2021 (keine Plangenehmigung mehr für Erzeugungsanlagen am Niederspannungsnetz, stattdessen Meldung an das ESTI) und im Rahmen der Beschleunigung des Netzausbaus. Eine weitere Revision im Zusammenhang mit der Änderung des Elektrizitätsgesetzes vom 26.9.2025 (Aufhebung von Art. 15h EleG, Festsetzung von Planungsgebieten) ist angekündigt. Aktuelle Fassung nicht im Detail geprüft."
status_note_en: "Amended several times, including 2019 (Strategy Electricity Networks: sectoral planning), 2021 (no planning approval for generating plants connected at low voltage, notification to ESTI instead) and as part of accelerating grid expansion. A further revision related to the amendment of the Electricity Act of 26 September 2025 (repeal of Art. 15h EleG on designating planning areas) has been announced. Current version not checked in detail."
languages: [de, fr, it]
topics: [permitting, grid, solar]
summary_de: "Die VPeA regelt das Sachplanverfahren für Übertragungsleitungen und das Plangenehmigungsverfahren für elektrische Anlagen beim Eidgenössischen Starkstrominspektorat und beim BFE: Gesuchsunterlagen, Aussteckung, Behandlungsfristen, Teilgenehmigungen, Ausnahmen von der Plangenehmigungspflicht sowie Bau und Inbetriebnahme."
summary_en: "The VPeA governs the sectoral planning procedure for transmission lines and the planning approval procedure for electrical installations before the Federal Inspectorate for Heavy Current Installations and the SFOE: application documents, staking out, processing deadlines, partial approvals, exemptions from planning approval, and construction and commissioning."
source_url: "https://www.fedlex.admin.ch/eli/cc/2000/123/de"
rights:
  status: official_work
  basis: "Art. 5 Abs. 1 lit. a URG"
  mirror_allowed: true
