id: ch-sr-734-25-vpea
title: "Verordnung über das Plangenehmigungsverfahren für elektrische Anlagen (VPeA)"
title_en: "Ordinance on the Planning Approval Procedure for Electrical Installations"
short_title: VPeA
doc_type: ordinance
jurisdiction: CH
issuer: "Schweizerischer Bundesrat"
reference: "SR 734.25"
date: 2000-02-02
status: in_force
status_note: "Mehrfach geändert, u. a. 2019 (Strategie Stromnetze: Sachplanverfahren) und 2021 (keine Plangenehmigung mehr für Erzeugungsanlagen am Niederspannungsnetz, stattdessen Meldung an das ESTI). Eine vom Bundesrat am 29.10.2025 genehmigte Revision zur Beschleunigung des Netzausbaus ist seit 1.1.2026 in Kraft. Eine weitere Revision, u. a. im Zusammenhang mit der Aufhebung der Festsetzung von Planungsgebieten (Art. 15h EleG), war ab 15.4.2026 als Teil eines Verordnungspakets in der Vernehmlassung. Aktuelle Fassung nicht im Detail geprüft."
status_note_en: "Amended several times, including 2019 (Strategy Electricity Networks: sectoral planning) and 2021 (no planning approval for generating plants connected at low voltage, notification to ESTI instead). A revision to accelerate grid expansion, approved by the Federal Council on 29 October 2025, has been in force since 1 January 2026. A further revision, among other things related to the repeal of the designation of planning areas (Art. 15h EleG), was in consultation from 15 April 2026 as part of an ordinance package. Current version not checked in detail."
languages: [de, fr, it]
topics: [permitting, grid, solar]
summary_de: "Die VPeA regelt das Sachplanverfahren für Übertragungsleitungen und das Plangenehmigungsverfahren für elektrische Anlagen beim Eidgenössischen Starkstrominspektorat und beim BFE: Gesuchsunterlagen, Aussteckung, Behandlungsfristen, Teilgenehmigungen, Ausnahmen von der Plangenehmigungspflicht sowie Bau und Inbetriebnahme."
summary_en: "The VPeA governs the sectoral planning procedure for transmission lines and the planning approval procedure for electrical installations before the Federal Inspectorate for Heavy Current Installations and the SFOE: application documents, staking out, processing deadlines, partial approvals, exemptions from planning approval, and construction and commissioning."
source_url: "https://www.fedlex.admin.ch/eli/cc/2000/123/de"
