id: ch-vate
title: Verordnung über die Aufsicht und Transparenz in den Energiegrosshandelsmärkten (VATE)
title_en: Ordinance on the Supervision and Transparency of Wholesale Energy Markets
short_title: VATE
doc_type: ordinance
jurisdiction: CH
issuer: Schweizerischer Bundesrat
reference: Verordnung vom 2. Oktober 2026
date: 2026-10-02
status: adopted
status_note: Vom Bundesrat am 2.10.2026 genehmigt; tritt zusammen mit dem BATE am 1.1.2027 in Kraft. Die Übergangsbestimmungen sehen eine schrittweise Einführung der Pflichten vor; Einzelheiten regelt die ElCom in Weisungen, die sich an den ACER-Leitlinien orientieren. Fundstelle in der Amtlichen Sammlung bei der Erfassung noch nicht bekannt.
status_note_en: Approved by the Federal Council on 2 October 2026; enters into force together with the BATE on 1 January 2027. Transitional provisions phase in the obligations; ElCom will set out details in directives based on the ACER guidelines. Official compilation reference not yet known when the entry was created.
status_changes:
- date: 2027-01-01
  status: in_force
  status_note: In Kraft seit 1.1.2027, zusammen mit dem BATE. Vom Bundesrat am 2.10.2026 genehmigt. Die Pflichten werden gemäss den Übergangsbestimmungen schrittweise eingeführt; Einzelheiten regelt die ElCom in Weisungen. Fundstelle (AS, SR) nach Inkrafttreten nachtragen.
  status_note_en: In force since 1 January 2027, together with the BATE. Approved by the Federal Council on 2 October 2026. Obligations are phased in under the transitional provisions; ElCom sets out details in directives. Official references (AS, SR) to be added after entry into force.
