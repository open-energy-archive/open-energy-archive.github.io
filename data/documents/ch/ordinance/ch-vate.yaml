summary_de: Die VATE enthält die Ausführungsbestimmungen zum BATE und lehnt sich weitgehend an die REMIT-Regeln der EU an. Sie regelt das Registrierungsverfahren bei der ElCom, die Veröffentlichung von Insiderinformationen, die Meldung von Transaktionen, Handelsaufträgen und Risikopositionen sowie die Übermittlung grundlegender Daten, die Zulassung von Plattformen und Meldemechanismen und die Gebühren der ElCom. Betroffen sind insbesondere Strom- und Gashändler, Swissgrid, Netz- und Speicherbetreiber, Produzenten, Lieferanten, Bilanzgruppenverantwortliche und Endverbraucher mit einer Verbrauchskapazität von mehr als 600 GWh pro Jahr.
summary_en: The VATE contains the implementing provisions of the BATE and is largely aligned with the EU REMIT rules. It governs registration with ElCom, publication of inside information, reporting of transactions, orders and risk positions and transmission of fundamental data, approval of platforms and reporting mechanisms, and ElCom fees. It mainly affects electricity and gas traders, Swissgrid, network and storage operators, producers, suppliers, balance responsible parties and end consumers with a consumption capacity above 600 GWh per year.
