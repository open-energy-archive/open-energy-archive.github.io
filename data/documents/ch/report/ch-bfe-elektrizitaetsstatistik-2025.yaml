summary_de: "Die jährliche Statistik erfasst die gesamte Erzeugung, den Austausch mit dem Ausland und den Verbrauch elektrischer Energie in der Schweiz. Sie gliedert die Produktion nach Kraftwerkstypen und weist Landes- und Endverbrauch aus."
summary_en: "The annual statistics record total generation, cross-border exchange and consumption of electricity in Switzerland. They break down production by plant type and report national and final consumption."
