id: ch-bfe-faktenblatt-neuerungen-2025
title: "Faktenblatt: Neuerungen im Energierecht ab 2025"
title_en: "Fact Sheet: Changes in Energy Law from 2025"
doc_type: report
jurisdiction: CH
