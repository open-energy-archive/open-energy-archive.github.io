summary_de: "Der Bericht beobachtet anhand von Indikatoren, wie weit die Schweiz bei der Umsetzung der Energiestrategie 2050 ist. Er behandelt Energieverbrauch und -produktion, Netzentwicklung, Versorgungssicherheit, Ausgaben und Preise, CO2-Emissionen, Forschung sowie das internationale Umfeld."
