status_note: "Kurzstudie eines Verbands, Version 02 vom 28.1.2026 (Webseite zuletzt am 10.2.2026 aktualisiert). Politischer Vorschlag, kein geltendes Recht. Auf der Webseite ist zusätzlich ein ausführlicheres Whitepaper mit Anhang zum Kapazitätsmodell verlinkt."
status_note_en: "Short study by an association, version 02 of 28 January 2026 (web page last updated 10 February 2026). A policy proposal, not law in force. The web page also links a longer white paper with an annex on the capacity model."
languages: [de]
topics: [solar, subsidies, grid, market]
summary_de: "Die Studie fragt, wie sich das PV-Ziel des Stromgesetzes von 18,7 TWh bis 2030 mit jährlich 3–4 Mrd. Franken überwiegend privater Investitionen erreichen lässt. Sie schlägt zwei Säulen vor: Modelle mit gesicherter Rendite (Kapazitätsmodell mit fixem Preis pro kWp und Steuerung der Einspeisung durch den Netzbetreiber; gleitende Marktprämie) und Marktmodelle (Winter-KEV; Smart-Grid-Bonus mit Echtzeit-Preissignalen). Die Einführung soll in drei Phasen über vier Jahre erfolgen, beginnend mit Pilotanlagen."
summary_en: "The study asks how the Electricity Act's PV target of 18.7 TWh by 2030 can be reached with CHF 3–4 billion of mostly private investment per year. It proposes two pillars: models with secured returns (a capacity model with a fixed price per kWp and feed-in steered by the grid operator; a sliding market premium) and market models (a winter feed-in tariff; a smart-grid bonus based on real-time price signals). Implementation is planned in three phases over four years, starting with pilot plants."
