id: de-by-regk-vokabl-2024
title: Regulierungskammer des Freistaates Bayern, Beschluss vom 11. Dezember 2024, GR-5932a-15/3/4 – Blindleistungskosten als volatile Kostenanteile in der vierten Regulierungsperiode («VoKaBl Bayern»)
title_en: Regulatory Chamber of Bavaria, decision of 11 December 2024, GR-5932a-15/3/4 – reactive power costs as volatile cost shares in the fourth regulatory period ("VoKaBl Bayern")
short_title: VoKaBl Bayern
doc_type: decision
jurisdiction: DE
subdivision: DE-BY
issuer: Regulierungskammer des Freistaates Bayern (Landesregulierungsbehörde)
reference: GR-5932a-15/3/4; BayMBl. 2024 Nr. 662
date: 2024-12-11
status: in_force
status_note: Öffentlich bekannt gemacht am 18.12.2024 (BayMBl. 2024 Nr. 662); gilt ab 1.1.2025 und ist bis 31.12.2028 befristet. Beschwerde zum OLG München möglich; ob Beschwerden eingelegt wurden, ist nicht geprüft.
status_note_en: Published on 18 December 2024 (Bavarian Ministerial Gazette 2024 No. 662); applies from 1 January 2025 and expires on 31 December 2028. Appeal lies to the Munich Higher Regional Court; whether appeals were lodged was not checked.
languages:
