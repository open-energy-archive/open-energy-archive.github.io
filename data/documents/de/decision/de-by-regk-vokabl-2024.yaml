summary_de: Die bayerische Landesregulierungsbehörde legt fest, dass Kosten der Verteilernetzbetreiber mit Hochspannungsnetz aus der marktgestützten Beschaffung von Blindleistung (Dienstleistungen zur Spannungsregelung nach der Festlegung BK6-23-072 der Bundesnetzagentur) ab 2025 als volatile Kostenanteile gelten. Die Erlösobergrenzen werden jährlich auf Basis sachgerecht prognostizierter Kosten angepasst; Abweichungen zu den Ist-Kosten werden über das Regulierungskonto ausgeglichen, bei Preisobergrenzen nur bis zu deren Höhe. Übergangsweise gilt dies auch für noch nicht kündbare Bestandsverträge mit Anlagenbetreibern.
summary_en: The Bavarian state regulatory authority determines that costs incurred by distribution system operators with a high-voltage grid from the market-based procurement of reactive power (voltage control services under Federal Network Agency determination BK6-23-072) count as volatile cost shares from 2025. Revenue caps are adjusted annually on the basis of properly forecast costs; differences from actual costs are balanced via the regulatory account, where price caps apply only up to their level. On a transitional basis this also covers existing contracts with plant operators that cannot yet be terminated.
