id: de-by-bayverfgh-vf-14-vii-14
title: BayVerfGH, Entscheidung vom 9. Mai 2016, Vf. 14-VII-14 u. a. – 10-H-Regelung für Windenergieanlagen im Wesentlichen verfassungsgemäss
title_en: Bavarian Constitutional Court, decision of 9 May 2016, Vf. 14-VII-14 et al. – 10H distance rule for wind turbines largely constitutional
short_title: BayVerfGH 10 H
doc_type: judgment
jurisdiction: DE
subdivision: DE-BY
issuer: Bayerischer Verfassungsgerichtshof
reference: Vf. 14-VII-14, Vf. 3-VIII-15, Vf. 4-VIII-15
date: 2016-05-09
status: final
status_note: Entscheidung über eine Popularklage und zwei Meinungsverschiedenheiten der Landtagsopposition. Die 10-H-Regelung in Art. 82 BayBO wurde 2022 gelockert (u. a. 1000 m in bestimmten Gebieten) und wird durch das Windenergieflächenbedarfsgesetz und § 249 BauGB zunehmend überlagert; die Entscheidung ist deshalb vor allem für die Grenzen landesrechtlicher Abstandsregeln von Bedeutung.
status_note_en: Decision on a popular action and two disputes brought by the parliamentary opposition. The 10H rule in Art. 82 of the Bavarian Building Code was relaxed in 2022 (including 1,000 m in certain areas) and is increasingly overlaid by the Federal Wind Energy Area Requirements Act and section 249 of the Federal Building Code; the decision therefore matters mainly for the limits of state distance rules.
languages:
- de
topics:
- wind
