- renewables
summary_de: Der Bayerische Verfassungsgerichtshof entschied, dass die sogenannte 10-H-Regelung, wonach Windenergieanlagen ihre Privilegierung im Aussenbereich nur behalten, wenn sie einen Mindestabstand vom Zehnfachen ihrer Höhe zu Wohngebäuden einhalten, im Wesentlichen mit der Bayerischen Verfassung vereinbar ist. Der Landesgesetzgeber habe den von § 249 Abs. 3 BauGB eröffneten Gestaltungsrahmen nicht überschritten; Gemeinden könnten durch Bauleitplanung geringere Abstände zulassen. Die Anträge hatten nur in einem Nebenpunkt Erfolg.
summary_en: The Bavarian Constitutional Court held that the so-called 10H rule, under which wind turbines keep their privileged status in the outer area only if they maintain a minimum distance of ten times their height from residential buildings, is largely compatible with the Bavarian Constitution. The state legislature did not exceed the scope opened by section 249(3) of the Federal Building Code; municipalities may allow shorter distances through land-use planning. The applications succeeded only on a minor point.
