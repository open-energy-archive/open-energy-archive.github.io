id: de-mv-ovg-5-k-171-22
title: OVG Mecklenburg-Vorpommern, Urteil vom 7. Februar 2023, 5 K 171/22 OVG – überragendes öffentliches Interesse an Windenergie (§ 2 EEG) gegenüber dem Denkmalschutz
title_en: Higher Administrative Court of Mecklenburg-Western Pomerania, judgment of 7 February 2023, 5 K 171/22 OVG – overriding public interest in wind energy (section 2 EEG) versus monument protection
short_title: OVG Greifswald 5 K 171/22
doc_type: judgment
jurisdiction: DE
subdivision: DE-MV
issuer: Oberverwaltungsgericht Mecklenburg-Vorpommern (Greifswald)
reference: 5 K 171/22 OVG
date: 2023-02-07
status: final
status_note: Untätigkeitsklage gegen die immissionsschutzrechtliche Genehmigungsbehörde; Verpflichtung zur Neubescheidung. Ein Teil der Literatur zitiert das Urteil mit Datum 23.2.2023. Volltext bei juris und im Landesrecht Mecklenburg-Vorpommern; als Quelle hier die Besprechung der Fachagentur Wind und Solar mit den Leitsätzen. Rechtskraft nicht geprüft.
status_note_en: Action for failure to act against the emission control permitting authority; obligation to decide anew. Part of the literature cites the judgment as of 23 February 2023. Full text in juris and the Mecklenburg-Western Pomerania state law database; the source here is the review by the Specialist Agency for Wind and Solar with the headnotes. Finality not checked.
