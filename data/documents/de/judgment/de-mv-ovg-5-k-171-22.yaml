summary_de: Das Oberverwaltungsgericht entschied, dass § 2 EEG, wonach Anlagen zur Erzeugung erneuerbarer Energien im überragenden öffentlichen Interesse liegen, auch bei der Genehmigung einzelner Windenergieanlagen anzuwenden ist. Aus § 2 Satz 2 EEG ergebe sich in den Schutzgüterabwägungen, hier gegenüber dem Denkmalschutz, ein regelmässiges Übergewicht der erneuerbaren Energien, das nur in atypischen, fachlich zu begründenden Ausnahmefällen überwunden werden kann. Die Genehmigungsbehörde ist nicht an die Beurteilung der Denkmalfachbehörde gebunden. Das Urteil gilt als eine der ersten obergerichtlichen Leitentscheidungen zu § 2 EEG.
summary_en: The Higher Administrative Court held that section 2 EEG, under which renewable energy installations are in the overriding public interest, also applies to the permitting of individual wind turbines. Section 2 sentence 2 EEG gives renewables a regular precedence in the balancing of protected interests, here against monument protection, which can only be overcome in atypical exceptional cases that must be substantiated. The permitting authority is not bound by the assessment of the monument protection authority. The judgment is regarded as one of the first leading appellate decisions on section 2 EEG.
