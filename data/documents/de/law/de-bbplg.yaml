summary_de: Das Bundesbedarfsplangesetz stellt für die in seiner Anlage aufgeführten Vorhaben im Übertragungsnetz die energiewirtschaftliche Notwendigkeit und den vordringlichen Bedarf verbindlich fest. Es kennzeichnet unter anderem die Vorhaben, für die das NABEG gilt, die Hochspannungs-Gleichstrom-Übertragungsleitungen mit Vorrang für Erdkabel und Pilotprojekte. Grundlage ist der von der Bundesnetzagentur bestätigte Netzentwicklungsplan.
summary_en: The Federal Requirements Plan Act establishes, with binding effect, the energy-sector necessity and urgent need of the transmission grid projects listed in its annex. Among other things it marks the projects subject to the NABEG, the high-voltage direct current lines with priority for underground cables, and pilot projects. It is based on the network development plan confirmed by the Federal Network Agency.
