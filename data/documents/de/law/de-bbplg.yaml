id: de-bbplg
title: Gesetz über den Bundesbedarfsplan (Bundesbedarfsplangesetz – BBPlG)
title_en: Federal Requirements Plan Act
short_title: BBPlG
doc_type: law
jurisdiction: DE
issuer: Deutscher Bundestag
reference: BGBl. I 2013 S. 2543
date: 2013-07-23
status: in_force
status_note: Erlassen als Art. 1 des Zweiten Gesetzes über Massnahmen zur Beschleunigung des Netzausbaus Elektrizitätsnetze vom 23.7.2013; der Bedarfsplan wird regelmässig auf Grundlage des Netzentwicklungsplans aktualisiert. Aktuelle Fassung nicht im Detail geprüft.
status_note_en: Enacted as Article 1 of the Second Act on Measures to Accelerate Expansion of Electricity Grids of 23 July 2013; the requirements plan is updated regularly on the basis of the network development plan. Current version not checked in detail.
