status_note: Ursprünglich in Kraft seit 24.5.2023; Änderungsgesetz vom 29.5.2024 (Brem.GBl. S. 486) in Kraft seit 27.6.2024, Neufassung bekannt gemacht am 24.7.2024. Pflicht bei Dachsanierungen seit 1.7.2024, bei Neubauten für Bauanträge ab 1.7.2025. Spätere Änderungen nicht im Detail geprüft.
status_note_en: Originally in force since 24 May 2023; amending act of 29 May 2024 in force since 27 June 2024, consolidated text published on 24 July 2024. Obligation for roof renovations since 1 July 2024, for new buildings for permit applications from 1 July 2025. Later amendments not checked in detail.
