summary_de: Das Bremische Solargesetz verpflichtet Bauherrinnen und Bauherren, auf neuen Gebäuden eine Photovoltaikanlage mit einer Modulfläche von mindestens 50 % der Dachfläche zu installieren. Bei bestehenden Gebäuden entsteht die Pflicht mit einer grundlegenden Dachsanierung (Erneuerung von mindestens 80 % der Dachfläche); dann ist innert zwei Jahren eine Anlage von mindestens 1 kW zu errichten. Das Gesetz regelt die massgebliche Dachfläche, Ausnahmen, Solarthermie als Erfüllungsalternative, Befreiungen bei unzumutbarer Härte, Nachweispflichten und Bussgelder.
summary_en: The Bremen Solar Act requires builders to install a PV system with a module area of at least 50% of the roof area on new buildings. For existing buildings, the obligation is triggered by a fundamental roof renovation (renewal of at least 80% of the roof area), after which a system of at least 1 kW must be installed within two years. The act governs the relevant roof area, exemptions, solar thermal as an alternative, waivers for undue hardship, proof requirements and fines.
