title: Bremisches Gesetz zur Beschleunigung des Ausbaus von Anlagen zur Stromerzeugung aus solarer Strahlungsenergie (Bremisches Solargesetz – BremSolarG)
title_en: Bremen Solar Act
short_title: BremSolarG
doc_type: law
