issuer: Bremische Bürgerschaft (Landtag)
reference: Neufassung vom 29.5.2024, Brem.GBl. 2024 S. 589 (ursprünglich Gesetz vom 2.5.2023, Brem.GBl. S. 443)
date: 2024-05-29
