summary_de: Das Hamburgische Klimaschutzgesetz legt die Klimaschutzziele der Stadt fest und enthält Pflichten für Gebäude und Wärmenetze. § 16 verpflichtet zur Errichtung von Photovoltaikanlagen auf Dächern von Neubauten und bei grundlegender Erneuerung der Dachhaut bestehender Gebäude (ab 50 m² Bruttodachfläche), künftig kombiniert mit Gründächern; § 16a regelt Photovoltaik auf Stellplatzanlagen. Weitere Bestimmungen betreffen Beschränkungen für elektrische Heizungen, die Nutzung erneuerbarer Energien bei der Wärmeversorgung, Dekarbonisierungsfahrpläne für Wärmenetze und den Kohleausstieg.
summary_en: The Hamburg Climate Protection Act sets the city's climate targets and contains obligations for buildings and heating networks. Section 16 requires PV systems on the roofs of new buildings and when the roof covering of existing buildings is fundamentally renewed (from 50 m² gross roof area), in future combined with green roofs; section 16a covers PV on parking facilities. Further provisions concern restrictions on electric heating, the use of renewables in heat supply, decarbonisation roadmaps for heating networks and the coal phase-out.
