id: de-hh-hmbklischg
title: Hamburgisches Gesetz zum Schutz des Klimas (Hamburgisches Klimaschutzgesetz – HmbKliSchG)
title_en: Hamburg Climate Protection Act
short_title: HmbKliSchG
doc_type: law
jurisdiction: DE
subdivision: DE-HH
issuer: Hamburgische Bürgerschaft
reference: HmbGVBl. 2020 S. 148
date: 2020-02-20
status: in_force
status_note: In Kraft seit Februar 2020; geändert u. a. am 13.12.2023 (HmbGVBl. S. 443) und am 4.11.2025 (HmbGVBl. S. 597). Nach Angaben der Stadt ist Klimaneutralität bis 2040 gesetzlich festgelegt. Photovoltaikpflicht bei Neubauten seit 1.1.2023, bei grundlegender Dacherneuerung im Bestand für Arbeiten ab 1.1.2025; Gründachpflicht (Solargründach) ab 1.1.2027. Konkretisiert durch die Photovoltaikpflicht-Umsetzungsverordnung (PVUmsVO) vom 16.4.2024. Aktuelle Fassung nicht im Detail geprüft.
status_note_en: In force since February 2020; amended among others on 13 December 2023 and 4 November 2025. According to the city, climate neutrality by 2040 is set in law. PV obligation for new buildings since 1 January 2023, for fundamental roof renewal of existing buildings for works from 1 January 2025; green roof obligation (solar green roof) from 1 January 2027. Detailed in the PV Obligation Implementing Ordinance (PVUmsVO) of 16 April 2024. Current version not checked in detail.
