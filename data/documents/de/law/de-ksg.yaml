id: de-ksg
title: Bundes-Klimaschutzgesetz (KSG)
title_en: Federal Climate Change Act
short_title: KSG
doc_type: law
jurisdiction: DE
issuer: Deutscher Bundestag
reference: BGBl. I 2019 S. 2513
date: 2019-12-12
status: in_force
status_note: In Kraft seit 18.12.2019. Nach dem Klimabeschluss des Bundesverfassungsgerichts 2021 geändert (Treibhausgasneutralität bis 2045); mit der Änderung vom 15.7.2024 (BGBl. 2024 I Nr. 235) wurde die Überprüfung der Ziele auf eine sektorübergreifende, mehrjährige Gesamtrechnung umgestellt. Spätere Änderungen nicht im Detail geprüft.
status_note_en: In force since 18 December 2019. Amended after the Federal Constitutional Court's 2021 climate ruling (greenhouse gas neutrality by 2045); the amendment of 15 July 2024 switched target monitoring to a cross-sector, multi-year overall accounting. Later amendments not checked in detail.
languages:
- de
topics:
