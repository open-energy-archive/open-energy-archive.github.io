- supply_security
summary_de: 'Das Bundes-Klimaschutzgesetz legt die nationalen Klimaschutzziele fest: Minderung der Treibhausgasemissionen um mindestens 65 % bis 2030 und 88 % bis 2040 gegenüber 1990 sowie Netto-Treibhausgasneutralität bis 2045. Es regelt jährliche Emissionsmengen, die Überprüfung durch den Expertenrat für Klimafragen, Klimaschutzprogramme der Bundesregierung und die Vorbildfunktion der öffentlichen Hand.'
summary_en: 'The Federal Climate Change Act sets Germany''s climate targets: reducing greenhouse gas emissions by at least 65% by 2030 and 88% by 2040 compared with 1990, and net greenhouse gas neutrality by 2045. It governs annual emission budgets, review by the Council of Experts on Climate Change, the federal government''s climate action programmes and the exemplary role of the public sector.'
