status_note: Erlassen als Art. 1 des Gesetzes über Massnahmen zur Beschleunigung des Netzausbaus Elektrizitätsnetze vom 28.7.2011; seither mehrfach geändert. Aktuelle Fassung nicht im Detail geprüft.
