summary_de: Das NABEG regelt die Bundesfachplanung und die Planfeststellung für länderübergreifende und grenzüberschreitende Höchstspannungsleitungen, die im Bundesbedarfsplangesetz entsprechend gekennzeichnet sind. Zuständig ist die Bundesnetzagentur. Das Gesetz enthält Vorgaben zur Öffentlichkeitsbeteiligung, zu Trassenkorridoren, zum Vorrang der Erdverkabelung bei Gleichstromleitungen und Instrumente zur Verfahrensbeschleunigung.
summary_en: The NABEG governs federal sectoral planning and plan approval for extra-high-voltage lines crossing state or national borders that are marked accordingly in the Federal Requirements Plan Act. The Federal Network Agency is the competent authority. The act contains rules on public participation, route corridors, the priority of underground cabling for direct current lines and tools to speed up procedures.
