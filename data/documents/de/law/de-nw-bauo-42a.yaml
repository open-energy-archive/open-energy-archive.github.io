summary_de: § 42a der Landesbauordnung verpflichtet dazu, auf geeigneten Dachflächen neuer Gebäude und bei vollständiger Erneuerung der Dachhaut bestehender Gebäude Photovoltaikanlagen zu installieren und zu betreiben; § 48 Abs. 1a regelt Photovoltaik über neuen Stellplätzen. Ausgenommen sind Gebäude bis 50 m² Nutzfläche, Behelfsbauten und fliegende Bauten; die Pflicht entfällt bei Widerspruch zu anderen Vorschriften, technischer Unmöglichkeit oder Unwirtschaftlichkeit. Solarthermie oder Photovoltaik an anderen Aussenflächen des Gebäudes können die Pflicht erfüllen. Die Solaranlagen-Verordnung legt Mindestumfang, Ausnahmen und Nachweise fest.
summary_en: Section 42a of the state building code requires PV systems to be installed and operated on suitable roof areas of new buildings and when the roof covering of existing buildings is completely renewed; section 48(1a) covers PV over new parking spaces. Buildings with up to 50 m² of usable floor area, temporary and mobile structures are exempt; the obligation lapses if it conflicts with other rules, is technically impossible or uneconomic. Solar thermal or PV on other external surfaces of the building can fulfil it. The Solar Installations Ordinance sets minimum extent, exemptions and proof.
