id: de-nw-bauo-42a
title: Bauordnung für das Land Nordrhein-Westfalen (BauO NRW 2018), § 42a Solaranlagen, mit Solaranlagen-Verordnung (SAN-VO NRW)
title_en: North Rhine-Westphalia Building Code, section 42a (solar installations), with Solar Installations Ordinance
short_title: BauO NRW § 42a
doc_type: law
jurisdiction: DE
subdivision: DE-NW
issuer: Landtag Nordrhein-Westfalen; Landesregierung (Verordnung)
reference: § 42a eingefügt durch Gesetz vom 31.10.2023 (GV. NRW. S. 1172); SAN-VO NRW vom 6.6.2024
date: 2023-10-31
status: in_force
status_note: '§ 42a gilt seit 1.1.2024: Pflicht für neue Nichtwohngebäude (Bauantrag nach dem 1.1.2024) und neue Wohngebäude (Bauantrag nach dem 1.1.2025), bei vollständiger Erneuerung der Dachhaut ab Baubeginn nach dem 1.1.2026, für kommunale Gebäude bereits ab 1.7.2024. Einzelheiten in der Solaranlagen-Verordnung NRW vom 6.6.2024. Die Landesbauordnung wurde zuletzt mit Wirkung ab 1.9.2026 geändert (GV. NRW. 2026 S. 537); § 42a blieb dabei unverändert.'
status_note_en: 'Section 42a has applied since 1 January 2024: obligation for new non-residential buildings (permit application after 1 January 2024) and new residential buildings (after 1 January 2025), for complete renewal of the roof covering where works start after 1 January 2026, for municipal buildings already from 1 July 2024. Details in the NRW Solar Installations Ordinance of 6 June 2024. The building code was last amended with effect from 1 September 2026; section 42a was not changed.'
languages:
