id: de-rp-lsolarg
title: Landesgesetz zur Installation von Solaranlagen (Landessolargesetz – LSolarG)
title_en: Rhineland-Palatinate State Solar Act
short_title: LSolarG RP
doc_type: law
jurisdiction: DE
subdivision: DE-RP
issuer: Landtag Rheinland-Pfalz
reference: GVBl. 2021 S. 550; geändert durch Gesetz vom 22.11.2023 (GVBl. S. 367)
date: 2021-09-30
status: in_force
status_note: In Kraft seit 6.10.2021; Pflichten für gewerbliche Neubauten und Parkplätze seit 1.1.2023. Mit der Änderung vom 22.11.2023 auf Neubauten und grundlegende Dachsanierungen öffentlicher Gebäude sowie Parkplätze der öffentlichen Hand ausgeweitet; seit 1.1.2024 gilt zudem für alle Neubauten und grundlegenden Dachsanierungen eine Pflicht, das Gebäude für eine spätere Photovoltaikanlage vorzubereiten. Eine Installationspflicht für private Wohngebäude besteht nicht. Konkretisiert durch die Durchführungsverordnung (LSolarGDVO) vom 15.12.2022. Spätere Änderungen nicht im Detail geprüft.
status_note_en: In force since 6 October 2021; obligations for new commercial buildings and car parks since 1 January 2023. Extended by the amendment of 22 November 2023 to new public buildings, their fundamental roof renovations and public car parks; since 1 January 2024 all new buildings and fundamental roof renovations must also be prepared for a later PV system. There is no installation obligation for private residential buildings. Detailed in the implementing ordinance of 15 December 2022. Later amendments not checked in detail.
languages:
