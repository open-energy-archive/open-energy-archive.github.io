summary_de: Das Landessolargesetz verpflichtet Bauherrinnen und Bauherren gewerblich genutzter Neubauten mit mehr als 100 m² Nutzfläche und neuer gewerblicher Parkplätze mit mehr als 50 Stellplätzen, Photovoltaikanlagen zu installieren, bei Gebäuden auf mindestens 60 % der geeigneten Dachfläche. Seit 2024 gilt die Pflicht auch für Neubauten und grundlegende Dachsanierungen öffentlicher Gebäude und für Parkplätze der öffentlichen Hand; alle übrigen Neubauten und grundlegend sanierten Dächer müssen für eine spätere Photovoltaikanlage vorbereitet werden. Solarthermie kann angerechnet werden; Verstösse können mit Bussgeldern bis 50 000 Euro geahndet werden.
summary_en: The State Solar Act requires builders of new commercial buildings with more than 100 m² of usable floor area and of new commercial car parks with more than 50 spaces to install PV systems, on buildings covering at least 60% of the suitable roof area. Since 2024 the obligation also applies to new public buildings, their fundamental roof renovations and public car parks; all other new buildings and fundamentally renovated roofs must be prepared for a later PV system. Solar thermal can be counted; violations can be fined up to EUR 50,000.
