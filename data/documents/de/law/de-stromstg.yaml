status_note: In Kraft seit 1.4.1999. Zuletzt wesentlich geändert durch das Dritte Gesetz zur Änderung des Energiesteuer- und des Stromsteuergesetzes (BGBl. 2025 I Nr. 340), überwiegend in Kraft seit 1.1.2026, einzelne Bestimmungen ab 1.1.2027. Spätere Änderungen nicht im Detail geprüft.
status_note_en: In force since 1 April 1999. Last substantially amended by the Third Act amending the Energy Tax and Electricity Tax Acts (Federal Law Gazette 2025 I No. 340), mostly in force since 1 January 2026, some provisions from 1 January 2027. Later amendments not checked in detail.
