summary_de: Das Stromsteuergesetz regelt die Besteuerung von Strom, der im Steuergebiet entnommen wird, mit Steuerschuldnerschaft der Versorger und Eigenerzeuger. Es enthält Steuerbefreiungen, unter anderem für Strom aus erneuerbaren Energieträgern und aus kleinen Anlagen, der am Ort der Erzeugung verbraucht wird, sowie Entlastungen für Unternehmen des produzierenden Gewerbes. Die Änderung 2026 verstetigt die Entlastung des produzierenden Gewerbes auf den EU-Mindeststeuersatz und regelt Elektromobilität (Ladepunktbetreiber als Steuerschuldner, bidirektionales Laden), Stromspeicher und dezentrale Erzeugung neu.
summary_en: The Electricity Tax Act governs the taxation of electricity withdrawn in the tax territory, with suppliers and self-generators as taxpayers. It contains exemptions, among others for electricity from renewable sources and from small plants consumed at the place of generation, and relief for manufacturing companies. The 2026 amendment makes the relief for manufacturing permanent at the EU minimum rate and reorganises the rules for e-mobility (charge point operators as taxpayers, bidirectional charging), storage and decentralised generation.
