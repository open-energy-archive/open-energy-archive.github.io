summary_de: "Die MaStRV regelt das Marktstammdatenregister der Bundesnetzagentur. Betreiber von Stromerzeugungsanlagen und Speichern, auch kleiner Photovoltaik- und Steckersolaranlagen, sowie weitere Marktakteure müssen sich und ihre Anlagen dort registrieren; die Daten sind teilweise öffentlich einsehbar."
summary_en: "The MaStRV governs the Federal Network Agency's market master data register. Operators of generation units and storage, including small PV and plug-in solar systems, and other market participants must register themselves and their units; parts of the data are publicly accessible."
