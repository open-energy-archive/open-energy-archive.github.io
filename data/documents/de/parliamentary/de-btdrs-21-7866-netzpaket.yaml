id: de-btdrs-21-7866-netzpaket
title: "Gesetzentwurf der Bundesregierung zur Änderung des Energiewirtschaftsrechts zur Synchronisierung des Anlagenzubaus mit dem Netzausbau sowie zur Verbesserung des Netzanschlussverfahrens (Netzpaket)"
title_en: "Government bill amending energy law to synchronise plant deployment with grid expansion and improve the grid connection procedure (grid package)"
short_title: Netzpaket
doc_type: parliamentary
jurisdiction: DE
issuer: "Bundesregierung (Gesetzentwurf), Deutscher Bundestag"
reference: "BT-Drs. 21/7866"
date: 2026-09-01
date_precision: month
status: draft
status_note: "Vom Bundeskabinett am 29.7.2026 zusammen mit der EEG-Novelle beschlossen. Erste Lesung im Bundestag am 24.9.2026, Überweisung an den Ausschuss für Wirtschaft und Energie. Das genaue Datum der Drucksache wurde nicht geprüft."
status_note_en: "Adopted by the federal cabinet on 29 July 2026 together with the EEG amendment. First reading in the Bundestag on 24 September 2026, referred to the Committee on Economic Affairs and Energy. The exact date of the printed paper was not checked."
languages: [de]
topics: [grid, renewables, storage, permitting]
summary_de: "Der Entwurf soll den Zubau von Erneuerbare-Energien-Anlagen, Speichern und Großverbrauchern besser mit dem Netzausbau abstimmen. Vorgesehen sind unter anderem eine Abkehr vom Windhundprinzip bei Netzanschlussanfragen, ein Redispatchvorbehalt in engpassbelasteten Netzgebieten, die Ausweisung kapazitätslimitierter Netzgebiete, Baukostenzuschüsse auch für Erzeugungsanlagen und ein «Einspeisenetz» als Instrument vorausschauenden Netzausbaus."
summary_en: "The bill aims to align the deployment of renewable plants, storage and large consumers more closely with grid expansion. Measures include moving away from first-come-first-served grid connection requests, a redispatch reservation in congested grid areas, designation of capacity-limited grid areas, construction cost contributions for generation plants and a 'feed-in grid' as a tool for anticipatory grid expansion."
