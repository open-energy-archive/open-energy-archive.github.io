summary_de: Der Entwurf soll noch fehlende Vorgaben der EU-Energieeffizienzrichtlinie 2023/1791 umsetzen und das Energieeffizienzgesetz zugleich weitgehend auf EU-Recht zurückführen. Vorgesehen sind unter anderem der Verzicht auf gesetzlich festgelegte nationale Einsparziele, eine Pflicht zu Energie- oder Umweltmanagementsystemen erst ab 23,6 GWh Jahresverbrauch (bisher 7,5 GWh), der Wegfall der Meldepflicht für Abwärmepotenziale für die meisten Betriebe, gelockerte Anforderungen an Rechenzentren (100 % erneuerbarer Strom erst ab 2030) sowie der Grundsatz «Energieeffizienz an erster Stelle» für Investitionen über 100 Millionen Euro.
summary_en: The bill aims to transpose outstanding requirements of the EU Energy Efficiency Directive 2023/1791 while largely reducing the Energy Efficiency Act to EU requirements. Measures include dropping statutory national savings targets, requiring energy or environmental management systems only from 23.6 GWh annual consumption (previously 7.5 GWh), removing the waste heat reporting duty for most companies, relaxed requirements for data centres (100% renewable electricity only from 2030) and applying the energy-efficiency-first principle to investments above EUR 100 million.
