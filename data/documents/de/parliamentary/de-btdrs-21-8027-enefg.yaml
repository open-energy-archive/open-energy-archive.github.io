summary_de: Der Entwurf soll noch fehlende Vorgaben der EU-Energieeffizienzrichtlinie 2023/1791 umsetzen und das Energieeffizienzgesetz zugleich weitgehend auf EU-Recht zurückführen. Vorgesehen sind unter anderem der Verweis auf indikative statt gesetzlich festgelegte Einsparziele, die Streichung der Einsparverpflichtung von Bund und Ländern, höhere Schwellen für die Pflicht zu Energiemanagementsystemen, angepasste Anforderungen an Rechenzentren und Abwärme sowie die Umsetzung des Grundsatzes «Energieeffizienz an erster Stelle» bei grossen Planungs- und Investitionsentscheidungen.
summary_en: The bill aims to transpose outstanding requirements of the EU Energy Efficiency Directive 2023/1791 while largely reducing the Energy Efficiency Act to EU requirements. Measures include referring to indicative rather than statutory savings targets, deleting the savings obligation of the federal and state governments, higher thresholds for mandatory energy management systems, adjusted requirements for data centres and waste heat, and applying the energy-efficiency-first principle to major planning and investment decisions.
