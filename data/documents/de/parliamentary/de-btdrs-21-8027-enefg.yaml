status_note: Referentenentwurf des BMWE vom 9.4.2026, vom Bundeskabinett am 24.6.2026 beschlossen. Drucksache vom 16.9.2026; erste Lesung im Bundestag am 24.9.2026 und Überweisung an den Ausschuss für Wirtschaft und Energie, öffentliche Anhörung am 5.10.2026.
status_note_en: Draft of the Federal Ministry for Economic Affairs and Energy of 9 April 2026, adopted by the federal cabinet on 24 June 2026. Printed paper of 16 September 2026; first reading in the Bundestag on 24 September 2026 and referral to the Committee on Economic Affairs and Energy, public hearing on 5 October 2026.
