status_note: Referentenentwurf des BMWE vom 9.4.2026, vom Bundeskabinett am 24.6.2026 beschlossen. Erste Lesung im Bundestag am 24.9.2026, öffentliche Anhörung im Ausschuss für Wirtschaft und Energie im Oktober 2026. Das genaue Datum der Drucksache wurde nicht geprüft.
status_note_en: Draft of the Federal Ministry for Economic Affairs and Energy of 9 April 2026, adopted by the federal cabinet on 24 June 2026. First reading in the Bundestag on 24 September 2026, public hearing in the Committee on Economic Affairs and Energy in October 2026. The exact date of the printed paper was not checked.
