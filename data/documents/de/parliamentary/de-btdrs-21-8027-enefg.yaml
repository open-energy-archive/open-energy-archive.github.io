id: de-btdrs-21-8027-enefg
title: Gesetzentwurf der Bundesregierung zur Beschleunigung der Umsetzung der Energieeffizienzrichtlinie (EnEfG-Novelle)
title_en: Government bill to accelerate transposition of the Energy Efficiency Directive (EnEfG amendment)
short_title: EnEfG-Novelle
doc_type: parliamentary
jurisdiction: DE
issuer: Bundesregierung (Gesetzentwurf), Deutscher Bundestag
