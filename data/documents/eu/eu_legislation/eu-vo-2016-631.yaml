date: 2016-04-14
status: in_force
status_note: In Kraft seit 17.5.2016, anwendbar seit 27.4.2019. Eine Neufassung (NC RfG 2.0) als delegierte Verordnung, die die Verordnung 2016/631 ersetzen soll, hat die Kommission am 8.7.2026 zur Konsultation gestellt (Frist 25.8.2026); die Annahme ist für Ende 2026 oder Anfang 2027 geplant.
status_note_en: In force since 17 May 2016, applicable since 27 April 2019. A recast (NC RfG 2.0) as a delegated regulation to replace Regulation 2016/631 was put to consultation by the Commission on 8 July 2026 (deadline 25 August 2026); adoption is planned for late 2026 or early 2027.
