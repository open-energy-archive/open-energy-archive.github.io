id: eu-vo-2016-631
title: Verordnung (EU) 2016/631 zur Festlegung eines Netzkodex mit Netzanschlussbestimmungen für Stromerzeuger (NC RfG)
title_en: Regulation (EU) 2016/631 establishing a network code on requirements for grid connection of generators (NC RfG)
short_title: NC RfG
doc_type: eu_legislation
jurisdiction: EU
issuer: Europäische Kommission
