summary_de: Der Netzkodex legt die technischen Anforderungen fest, die neue Stromerzeugungsanlagen für den Anschluss an das Netz erfüllen müssen. Er unterteilt die Anlagen nach Leistung und Spannungsebene in die Typen A bis D und regelt unter anderem Frequenz- und Spannungsverhalten, Durchfahren von Netzfehlern (Fault Ride Through), Blindleistung, Schutz, Informationsaustausch und den Konformitätsnachweis. Die Mitgliedstaaten konkretisieren die nicht abschliessend geregelten Anforderungen national, in Deutschland etwa über die VDE-Anwendungsregeln.
summary_en: The network code sets the technical requirements new power generating modules must meet to connect to the grid. It classifies modules by capacity and voltage level into types A to D and governs, among other things, frequency and voltage behaviour, fault ride through, reactive power, protection, information exchange and compliance verification. Member States specify the non-exhaustive requirements nationally, in Germany for instance through the VDE application rules.
