- supply_security
- storage
summary_de: 'Die Leitlinie regelt den Regelenergiemarkt: Standardprodukte für Regelleistung, die europäischen Plattformen für Ersatzreserve (TERRE), Sekundärregelleistung mit automatischer Aktivierung (PICASSO), manuelle Aktivierung (MARI) und Netting von Ungleichgewichten (IGCC), die Bilanzkreisabrechnung mit einheitlicher Abrechnungsperiode von 15 Minuten sowie die Bedingungen für Regelreserveanbieter und Bilanzverantwortliche.'
summary_en: 'The guideline governs the balancing market: standard balancing products, the European platforms for replacement reserves (TERRE), automatic frequency restoration reserves (PICASSO), manual activation (MARI) and imbalance netting (IGCC), imbalance settlement with a harmonised 15-minute settlement period, and terms for balancing service providers and balance responsible parties.'
