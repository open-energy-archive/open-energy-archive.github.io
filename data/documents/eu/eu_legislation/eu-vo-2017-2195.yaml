id: eu-vo-2017-2195
title: Verordnung (EU) 2017/2195 zur Festlegung einer Leitlinie über den Systemausgleich im Elektrizitätsversorgungssystem (EB GL)
title_en: Regulation (EU) 2017/2195 establishing a guideline on electricity balancing (EB GL)
short_title: Leitlinie Systemausgleich
doc_type: eu_legislation
jurisdiction: EU
issuer: Europäische Kommission
reference: Verordnung (EU) 2017/2195, CELEX 32017R2195
date: 2017-11-23
status: in_force
status_note: In Kraft seit 18.12.2017; spätere Änderungen nicht im Detail geprüft. Massgebend ist die konsolidierte Fassung auf EUR-Lex. Für die Schweiz nicht unmittelbar anwendbar; ihre Teilnahme an den europäischen Regelenergieplattformen hängt vom Verhältnis zur EU ab.
status_note_en: In force since 18 December 2017; later amendments not checked. The consolidated version on EUR-Lex is authoritative. Not directly applicable in Switzerland; its participation in the European balancing platforms depends on its relations with the EU.
