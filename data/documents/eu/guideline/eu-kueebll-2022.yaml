id: eu-kueebll-2022
title: Leitlinien für staatliche Klima-, Umweltschutz- und Energiebeihilfen 2022 (KUEBLL)
title_en: Guidelines on State aid for climate, environmental protection and energy 2022 (CEEAG)
short_title: KUEBLL / CEEAG
doc_type: guideline
jurisdiction: EU
issuer: Europäische Kommission
reference: Mitteilung der Kommission 2022/C 80/01, ABl. C 80 vom 18.2.2022
date: 2022-01-27
status: in_force
status_note: Anwendbar seit 27.1.2022; ersetzen die Umwelt- und Energiebeihilfeleitlinien 2014–2020. Ergänzend gilt seit 2025 der Beihilferahmen für den Clean Industrial Deal (CISAF). Spätere Änderungen nicht im Detail geprüft. Für die Schweiz nicht anwendbar.
status_note_en: Applicable since 27 January 2022; replace the 2014–2020 environmental and energy aid guidelines. Since 2025 the Clean Industrial Deal State Aid Framework (CISAF) applies in addition. Later amendments not checked in detail. Not applicable in Switzerland.
