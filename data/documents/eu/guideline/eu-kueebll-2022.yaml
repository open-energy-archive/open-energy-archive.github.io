summary_de: Die Leitlinien legen fest, unter welchen Voraussetzungen die Kommission Beihilfen für Klima-, Umwelt- und Energieziele als mit dem Binnenmarkt vereinbar genehmigt. Sie decken unter anderem die Förderung erneuerbarer Energien und Wasserstoff, Energieeffizienz, saubere Mobilität, Infrastruktur, Versorgungssicherheit (Kapazitätsmechanismen), Fernwärme sowie Entlastungen energieintensiver Unternehmen von Abgaben ab. Grundsätzlich verlangen sie wettbewerbliche Ausschreibungen und, bei Betriebsbeihilfen, zunehmend zweiseitige Differenzverträge.
summary_en: The guidelines set out the conditions under which the Commission approves aid for climate, environmental and energy objectives as compatible with the internal market. They cover, among others, support for renewables and hydrogen, energy efficiency, clean mobility, infrastructure, security of supply (capacity mechanisms), district heating and levy reductions for energy-intensive users. As a rule they require competitive bidding and, for operating aid, increasingly two-way contracts for difference.
