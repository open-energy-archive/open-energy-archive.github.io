id: eu-eugh-c-573-12
title: EuGH, Urteil vom 1. Juli 2014, C-573/12 (Ålands Vindkraft) – Förderung nur für inländische Anlagen mit dem freien Warenverkehr vereinbar
title_en: CJEU, judgment of 1 July 2014, C-573/12 (Ålands Vindkraft) – support limited to domestic installations compatible with free movement of goods
doc_type: judgment
jurisdiction: EU
issuer: Gerichtshof der Europäischen Union
reference: C-573/12
date: 2014-07-01
status: final
status_note: Grosse Kammer; Vorabentscheidung auf Vorlage des schwedischen Förvaltningsrätten i Linköping zum schwedischen Zertifikatesystem.
status_note_en: Grand Chamber; preliminary ruling on a reference from the Administrative Court of Linköping on the Swedish green certificate scheme.
languages:
- de
- en
- fr
