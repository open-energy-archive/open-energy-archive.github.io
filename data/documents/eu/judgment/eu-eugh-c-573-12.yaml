topics:
- renewables
- wind
- subsidies
- cross_border
summary_de: Der Gerichtshof entschied, dass die Erneuerbare-Energien-Richtlinie 2009/28/EG es den Mitgliedstaaten erlaubt, ihre Fördersysteme auf Anlagen im eigenen Hoheitsgebiet zu beschränken. Die damit verbundene Beschränkung des freien Warenverkehrs ist durch das Ziel gerechtfertigt, die Nutzung erneuerbarer Energien zu fördern, und verhältnismässig. Das Urteil ist bis heute massgebend für die Frage, ob Mitgliedstaaten ihre Förderung für ausländische Anlagen öffnen müssen.
summary_en: The Court held that the Renewable Energy Directive 2009/28/EC allows Member States to limit their support schemes to installations on their own territory. The resulting restriction of the free movement of goods is justified by the aim of promoting renewable energy and is proportionate. The ruling remains decisive on whether Member States must open their support to installations abroad.
