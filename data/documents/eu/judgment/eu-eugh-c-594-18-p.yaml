id: eu-eugh-c-594-18-p
title: EuGH, Urteil vom 22. September 2020, C-594/18 P (Österreich/Kommission) – Beihilfe für das Kernkraftwerk Hinkley Point C
title_en: CJEU, judgment of 22 September 2020, C-594/18 P (Austria v Commission) – State aid for the Hinkley Point C nuclear power station
doc_type: judgment
jurisdiction: EU
issuer: Gerichtshof der Europäischen Union
reference: C-594/18 P
date: 2020-09-22
status: final
status_note: Grosse Kammer; Rechtsmittel Österreichs gegen das Urteil des Gerichts vom 12.7.2018 (T-356/15) zurückgewiesen. Der Genehmigungsbeschluss der Kommission vom 8.10.2014 bleibt bestehen.
status_note_en: Grand Chamber; Austria’s appeal against the General Court judgment of 12 July 2018 (T-356/15) dismissed. The Commission’s approval decision of 8 October 2014 stands.
