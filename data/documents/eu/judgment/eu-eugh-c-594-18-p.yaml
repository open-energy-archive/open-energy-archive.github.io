summary_de: Der Gerichtshof bestätigte die Genehmigung der britischen Beihilfen für den Bau des Kernkraftwerks Hinkley Point C (Differenzvertrag, Kreditgarantie, Entschädigung bei vorzeitiger Abschaltung). Eine Beihilfe nach Art. 107 Abs. 3 Bst. c AEUV muss kein gemeinsames Interesse aller Mitgliedstaaten verfolgen; es genügt, dass sie die Entwicklung eines Wirtschaftszweigs fördert und den Handel nicht übermässig beeinträchtigt. Der Umweltschutz ist bei der Prüfung zu berücksichtigen. Das Urteil ist wichtig für die beihilferechtliche Beurteilung von Differenzverträgen.
summary_en: The Court upheld approval of UK aid for building the Hinkley Point C nuclear power station (contract for difference, credit guarantee, compensation for early shutdown). Aid under Article 107(3)(c) TFEU need not pursue an interest common to all Member States; it suffices that it facilitates the development of an economic activity without adversely affecting trade to an excessive extent. Environmental protection must be taken into account. The ruling is important for the State aid assessment of contracts for difference.
